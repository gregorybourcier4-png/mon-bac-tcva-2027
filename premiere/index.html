 : fiche animation + affiche Canva.","Livrable principal"],["60–75 min","Tester et vérifier","Échange ta production avec un camarade, vérifie les calculs et détecte deux points à améliorer.","Grille de contrôle"],["75–90 min","Améliorer et présenter","Corrige, justifie trois choix professionnels et prépare une restitution courte.","Production finale + justification"]],"criteria":["Production complète et exploitable.","Choix professionnels justifiés.","Calculs et données vérifiés si nécessaires.","Présentation claire et amélioration après retour."]},"51":{"title":"Évaluer une promotion","brief":"Compare ventes, CA et marge avant/après, vérifie l’effet d’une remise, puis recommande de poursuivre ou non. Livrable : bilan chiffré.","steps":[["00–15 min","Comprendre le problème","Lis le brief, relève les contraintes et les critères de réussite.","Liste des contraintes"],["15–30 min","Préparer les données","Rassemble les informations nécessaires ; explicite les hypothèses lorsque les données sont fictives.","Tableau de départ"],["30–60 min","Produire","Réalise la mission : Compare ventes, CA et marge avant/après, vérifie l’effet d’une remise, puis recommande de poursuivre ou non. Livrable : bilan chiffré.","Livrable principal"],["60–75 min","Tester et vérifier","Échange ta production avec un camarade, vérifie les calculs et détecte deux points à améliorer.","Grille de contrôle"],["75–90 min","Améliorer et présenter","Corrige, justifie trois choix professionnels et prépare une restitution courte.","Production finale + justification"]],"criteria":["Production complète et exploitable.","Choix professionnels justifiés.","Calculs et données vérifiés si nécessaires.","Présentation claire et amélioration après retour."]},"53":{"title":"Réaliser un CCF blanc de merchandising","brief":"Étudie un rayon fictif, relève trois problèmes, propose un plan d’action, réalise un schéma et défends tes décisions. Livrable : dossier et oral.","steps":[["00–15 min","Comprendre le problème","Lis le brief, relève les contraintes et les critères de réussite.","Liste des contraintes"],["15–30 min","Préparer les données","Rassemble les informations nécessaires ; explicite les hypothèses lorsque les données sont fictives.","Tableau de départ"],["30–60 min","Produire","Réalise la mission : Étudie un rayon fictif, relève trois problèmes, propose un plan d’action, réalise un schéma et défends tes décisions. Livrable : dossier et oral.","Livrable principal"],["60–75 min","Tester et vérifier","Échange ta production avec un camarade, vérifie les calculs et détecte deux points à améliorer.","Grille de contrôle"],["75–90 min","Améliorer et présenter","Corrige, justifie trois choix professionnels et prépare une restitution courte.","Production finale + justification"]],"criteria":["Production complète et exploitable.","Choix professionnels justifiés.","Calculs et données vérifiés si nécessaires.","Présentation claire et amélioration après retour."]},"54":{"title":"Argumenter ses choix de rayon","brief":"Prépare une soutenance avec 3 décisions, 3 preuves chiffrées, 2 limites et 1 amélioration. Livrable : oral de 4 minutes.","steps":[["00–15 min","Comprendre le problème","Lis le brief, relève les contraintes et les critères de réussite.","Liste des contraintes"],["15–30 min","Préparer les données","Rassemble les informations nécessaires ; explicite les hypothèses lorsque les données sont fictives.","Tableau de départ"],["30–60 min","Produire","Réalise la mission : Prépare une soutenance avec 3 décisions, 3 preuves chiffrées, 2 limites et 1 amélioration. Livrable : oral de 4 minutes.","Livrable principal"],["60–75 min","Tester et vérifier","Échange ta production avec un camarade, vérifie les calculs et détecte deux points à améliorer.","Grille de contrôle"],["75–90 min","Améliorer et présenter","Corrige, justifie trois choix professionnels et prépare une restitution courte.","Production finale + justification"]],"criteria":["Production complète et exploitable.","Choix professionnels justifiés.","Calculs et données vérifiés si nécessaires.","Présentation claire et amélioration après retour."]}},"boosters":{"11":{"method":"La rotation ne dépend pas seulement de la date de réception. FIFO privilégie l’ordre d’entrée, FEFO la date limite la plus proche. Vérifier l’état, la DLC et les règles de conservation avant de déplacer un lot.","dossier":"Yaourts : lot A reçu lundi, DLC 18/11, 12 unités ; lot B reçu mardi, DLC 14/11, 18 unités ; lot C reçu mercredi, DLC 21/11, 10 unités.","task":"Classe les lots selon FIFO puis FEFO ; explique le conflit ; dessine l’ordre en rayon ; décris le contrôle des dates et une fiche de non-conformité.","answer":"FIFO : A, B, C ; FEFO : B, A, C. Les 18 unités du lot B passent devant si conformes ; on ne met jamais en vente un produit non conforme.","twohours":false},"12":{"method":"Un parcours client commence avant le choix du produit : entrée, orientation, recherche, comparaison, décision, caisse et sortie. À chaque étape, réduire l’effort du client sans entraver l’accessibilité.","dossier":"Magasin de 96 m² : entrée au sud, caisse à l’est, pain au nord, produits frais à l’ouest. Trois clients : pressé, parent avec poussette, personne cherchant un produit sans allergène.","task":"Dessine trois trajets distincts ; repère deux croisements gênants ; propose une signalétique et une modification de plan ; teste le parcours d’un camarade.","answer":"Les trajets doivent être compréhensibles, sûrs et adaptés aux trois besoins ; la justification prime sur un dessin esthétique.","twohours":true},"13":{"method":"L’accueil se construit en quatre temps : saluer, se rendre disponible, découvrir le besoin et orienter. Les questions ouvertes font parler ; les questions fermées confirment. Une reformulation évite les conseils hors sujet.","dossier":"Une cliente arrive avec un budget de 12 € pour un repas végétarien de quatre personnes. Elle est pressée et ne connaît pas les rayons.","task":"Écris deux questions ouvertes et une reformulation ; joue la scène trois minutes en binôme ; inverse les rôles ; l’observateur relève trois comportements.","answer":"Attendus : accueil respectueux, question sur le repas et les contraintes, reformulation du budget et orientation réaliste sans inventer un prix.","twohours":false},"14":{"method":"Le facing désigne le nombre de produits visibles de face. Le réassort reconstitue la disponibilité en rayon après vérification du stock, des dates et de l’état. Une belle présentation ne compense pas un prix absent.","dossier":"Étagère de 120 cm ; quatre produits de largeurs 10, 15, 12 et 20 cm. Un produit est en rupture et une étiquette affiche le mauvais prix.","task":"Propose une implantation avec au moins un facing par référence ; calcule l’espace utilisé ; traite la rupture et l’erreur de prix ; réalise un schéma avant/après.","answer":"Exemple : 3×10 + 2×15 + 2×12 + 1×20 = 104 cm, soit 16 cm restants. Corriger l’étiquette selon procédure ; ne pas masquer la rupture.","twohours":false},"16":{"method":"Une étiquette en rayon doit permettre d’identifier clairement le produit et son prix. Le prix à l’unité de mesure facilite la comparaison lorsque la réglementation l’impose. Les affichages promotionnels doivent être exacts.","dossier":"Pâtes 500 g à 1,80 € ; riz 1 kg à 3,20 € ; café 250 g à 4,75 €. Une affiche mentionne « 20 % de réduction » sur le café.","task":"Calcule les prix au kilo et le nouveau prix du café ; réalise trois étiquettes Canva ; vérifie les informations à afficher et corrige deux erreurs fictives.","answer":"Pâtes 3,60 €/kg ; riz 3,20 €/kg ; café 19 €/kg avant remise, 3,80 € après remise de 20 %.","twohours":true},"17":{"method":"Un conseil adapté part des besoins du client, pas des préférences du vendeur. La méthode caractéristique → avantage → preuve permet d’argumenter sans promettre ce qui n’est pas vérifié.","dossier":"Un client veut une collation pour un trajet de trois heures, sans fruits à coque, budget 5 €. Trois références fictives : A 2,20 € avec allergènes ; B 3,90 € sans fruits à coque selon étiquette ; C 5,40 €.","task":"Choisis une référence après vérification des informations ; formule deux arguments ; joue une objection ; rédige une phrase de conclusion.","answer":"B est compatible avec le budget sous réserve de vérification complète de l’étiquette et des risques d’allergènes ; A n’est pas adapté, C dépasse le budget.","twohours":false},"18":{"method":"Face à une réclamation : écouter les faits, reformuler, vérifier le produit ou le justificatif, appliquer la procédure et alerter si risque sanitaire. Ne jamais inventer une politique de remboursement.","dossier":"Un client rapporte un paquet de biscuits ouvert à l’achat, ticket disponible, puis devient impatient devant d’autres clients.","task":"Prépare un sketch client/vendeur/observateur ; ajoute un imprévu ; rédige le compte rendu : faits, vérifications, décision et responsable informé.","answer":"Le vendeur reste calme, isole le produit, vérifie les éléments, applique la procédure et sollicite le responsable si nécessaire.","twohours":false},"19":{"method":"La largeur correspond au nombre de familles ; la profondeur au nombre de références par famille. Un assortiment répond à une clientèle et à une surface disponible : tout proposer n’est pas possible.","dossier":"Épicerie de 40 m², clientèle d’étudiants, budget d’achat fictif 900 €. Familles : boissons, pâtes, fruits, snacking, hygiène.","task":"Construis un assortiment de 20 références avec quantité et coût fictif ; calcule la dépense ; supprime deux doublons ; justifie la largeur et la profondeur.","answer":"La dépense totale doit rester sous 900 € ; chaque référence doit répondre à un besoin ; identifier les familles prioritaires et les doublons.","twohours":true},"20":{"method":"Une zone de chalandise est l’espace d’où proviennent les clients potentiels. On la caractérise par temps d’accès, déplacements, concurrence et habitudes, pas seulement par un cercle tracé sur une carte.","dossier":"Commerce près d’un lycée et d’un arrêt de bus ; trois profils : élèves, riverains, salariés. Deux concurrents à 8 et 15 minutes à pied.","task":"Définis zone primaire et secondaire hypothétiques ; liste cinq données à vérifier sur le terrain ; propose un horaire adapté et explique ses limites.","answer":"Une hypothèse de zone doit être justifiée et vérifiée ; les flux scolaires ne garantissent pas des achats.","twohours":false},"21":{"method":"Une comparaison concurrentielle se fait sur des critères identiques et observables : prix au kilo, gamme, services, horaires, accessibilité. Il faut distinguer constat et opinion.","dossier":"Enseigne A : riz 750 g à 2,70 €, ouverte 8–19 h ; B : riz 1 kg à 3,20 €, ouverte 9–20 h. A propose livraison, B non.","task":"Calcule les deux prix au kilo ; complète un tableau à quatre critères ; formule une recommandation selon un client pressé puis un client économe.","answer":"A : 3,60 €/kg ; B : 3,20 €/kg. La meilleure enseigne dépend du besoin : coût, horaires, livraison.","twohours":false},"22":{"method":"Pour calculer une remise, convertir le pourcentage en décimal puis multiplier le prix initial. Pour deux remises successives, recalculer la seconde sur le prix déjà réduit.","dossier":"Un produit vaut 80 € ; remise 15 %. Autre produit 100 € ; remises successives 20 % puis 10 %.","task":"Calcule les prix finaux ; compare avec une remise unique de 30 % ; explique pourquoi les résultats diffèrent ; rédige une étiquette promotionnelle.","answer":"80×0,85 = 68 € ; 100×0,80×0,90 = 72 € ; remise unique 30 % = 70 €.","twohours":false},"23":{"method":"Un planogramme représente l’emplacement des références par tablette et par facing. Il doit intégrer dimensions, lisibilité, rotation, sécurité et contraintes commerciales.","dossier":"Rayon de 120 cm sur trois tablettes ; références A 15 cm, B 10 cm, C 20 cm, D 12 cm ; produits lourds C.","task":"Propose 10 facings au total, calcule la largeur par tablette, dessine le planogramme, puis explique pourquoi les produits lourds ne sont pas placés en hauteur.","answer":"Un planogramme est correct si chaque tablette reste dans les 120 cm et si l’implantation est sûre, cohérente et justifiée.","twohours":true},"24":{"method":"Les gestes professionnels associent efficacité, prévention des risques et qualité de service. Le salarié ne doit pas improviser une manutention dangereuse ni laisser une allée encombrée.","dossier":"Un carton lourd bloque une allée, un client attend un renseignement et une bouteille s’est cassée à proximité.","task":"Classe les priorités ; joue un échange vendeur/responsable/client ; établis une procédure d’alerte et de sécurisation ; argumente tes choix.","answer":"Sécuriser le danger immédiat et alerter selon procédure, puis organiser le service client ; ne pas manipuler un risque sans équipement adapté.","twohours":false},"25":{"method":"À la réception, comparer commande, livraison et documents ; contrôler quantités, intégrité, dates, lots et températures selon les produits. Tracer toute anomalie.","dossier":"Commande : 24 yaourts, 12 jus, 10 sachets de riz. Livrés : 22 yaourts dont deux emballages abîmés, 12 jus, 11 riz.","task":"Rédige un bon de réception, calcule les écarts par référence, isole les produits suspects et formule les réserves.","answer":"Yaourts −2 en quantité et deux emballages à contrôler ; jus 0 ; riz +1. Ne pas accepter silencieusement les écarts.","twohours":true},"26":{"method":"Un contrôle de réception porte sur quantité, qualité et conservation. Les valeurs de température applicables dépendent de la denrée et de son étiquetage ; ne pas utiliser un seuil unique.","dossier":"Livraison : 8 cartons attendus, 7 reçus ; une boîte écrasée ; un produit frais sans enregistrement de température.","task":"Sépare anomalies quantitatives, qualitatives et documentaires ; complète une grille de contrôle ; décide quels produits isoler et qui prévenir.","answer":"Quantité : −1 carton. L’emballage abîmé et le contrôle de température manquant imposent une vérification selon procédure.","twohours":false},"27":{"method":"Une non-conformité doit être décrite avec des faits précis, des preuves et une action immédiate. Une réserve n’est pas une accusation : elle protège la traçabilité.","dossier":"Bon de livraison 30 unités ; 28 reçues ; trois paquets déchirés ; lot illisible sur deux produits.","task":"Complète un rapport avec heure, produit, lot, quantité, preuve et destinataire ; simule l’appel au fournisseur ; propose une action préventive.","answer":"Signaler −2 unités, isoler les cinq produits suspects selon leur état, documenter et attendre décision autorisée.","twohours":true},"28":{"method":"Stock final théorique = stock initial + entrées − sorties. L’écart d’inventaire = stock réel − stock théorique. Un seuil d’alerte déclenche une vérification, pas une commande aveugle.","dossier":"Référence A : initial 45, entrées 20, sorties 52, réel 11 ; B : initial 30, entrées 0, sorties 18, réel 12.","task":"Calcule les stocks théoriques et écarts ; construis un tableau ; fixe un seuil argumenté ; propose deux causes possibles de l’écart.","answer":"A théorique 13, écart −2 ; B théorique 12, écart 0. Vérifier casse, erreurs et mouvements avant correction.","twohours":true},"30":{"method":"Un inventaire nécessite un périmètre, une date, une méthode de comptage et une vérification des écarts. La démarque connue et inconnue ne s’analysent pas de la même manière.","dossier":"Stock théorique : farine 36, jus 42, biscuits 50 ; comptage : 34, 42, 47 ; coûts unitaires : 1,20 €, 2 €, 1,50 €.","task":"Calcule les écarts en unités et en valeur d’achat ; propose une double vérification ; construis un plan de prévention de trois actions.","answer":"Écarts −2, 0, −3 ; valorisation indicative −2,40 €, 0 €, −4,50 €, soit −6,90 € au coût fourni.","twohours":true},"31":{"method":"Un objectif de stage doit être observable et réalisable : tâche, conditions, preuve, bilan. Il faut distinguer ce que l’élève peut faire seul et ce qui nécessite autorisation ou supervision.","dossier":"Tu arrives en stage dans un commerce alimentaire avec trois missions possibles : facing, accueil, réception. Le tuteur dispose de peu de temps.","task":"Rédige quatre objectifs mesurables, cinq questions au tuteur et une grille quotidienne ; prépare une présentation orale d’une minute.","answer":"Un bon objectif précise action, preuve et délai : « observer puis réaliser un réassort supervisé et en noter les étapes ».","twohours":true},"32":{"method":"Organiser une journée demande de hiérarchiser urgence, sécurité, service client et réassort. Les tâches doivent être réparties selon les consignes et les compétences.","dossier":"À 9 h : une flaque dans l’allée, un client demande conseil, une livraison arrive, deux rayons sont vides. Équipe : deux salariés.","task":"Construis un planning de 30 minutes ; justifie les priorités ; joue une transmission d’équipe ; adapte ton plan quand le livreur arrive en retard.","answer":"Sécuriser immédiatement la flaque, alerter et répartir les autres tâches sans laisser un risque ouvert.","twohours":false},"33":{"method":"Analyser un stage consiste à décrire une situation réelle : contexte, mission, actions, résultat, difficultés, amélioration. On évite les jugements non justifiés sur les personnes.","dossier":"Un élève a participé à un réassort et observé une réclamation. Il possède une photo autorisée du rayon et des notes de suivi.","task":"Rédige deux fiches d’analyse, identifie deux compétences acquises, puis présente une amélioration réaliste et mesurable.","answer":"Une analyse réussie distingue faits, décisions et résultats ; elle reconnaît les limites de l’observation.","twohours":true},"34":{"method":"Un oral professionnel doit expliquer une action avec des preuves : contexte, objectif, méthode, résultat, recul critique. Les diapositives soutiennent le discours, elles ne le remplacent pas.","dossier":"Présente une situation de stage en trois minutes avec une photo autorisée, un document anonymisé et une difficulté rencontrée.","task":"Prépare cinq diapositives ; répète à trois ; demande un retour sur clarté, vocabulaire et justification ; corrige puis rejoue.","answer":"Le jury doit comprendre ce qui a été fait personnellement, pourquoi et avec quel résultat.","twohours":true},"35":{"method":"Diagnostiquer un rayon exige des observations vérifiables : propreté, disponibilité, étiquetage, visibilité, rotation, sécurité. Un diagnostic se termine par des actions prioritaires.","dossier":"Rayon fictif : trois trous de stock, une étiquette absente, une promotion peu visible, une allée encombrée.","task":"Réalise une grille de six critères ; classe les anomalies ; propose un plan d’action immédiat puis une amélioration durable.","answer":"Sécurité et information du prix sont prioritaires ; chaque proposition doit préciser responsable et contrôle.","twohours":false},"36":{"method":"Un besoin client se mesure par observation et questionnement. Une enquête fiable évite les questions orientées et distingue fréquence déclarée et comportement observé.","dossier":"Enquête de six personnes : 4 souhaitent des produits à emporter, 3 privilégient le prix, 2 recherchent du local ; réponses multiples possibles.","task":"Rédige cinq questions neutres ; calcule les proportions ; formule deux décisions prudentes ; explique la limite de l’échantillon.","answer":"4/6 ≈ 66,7 %, 3/6 = 50 %, 2/6 ≈ 33,3 %. Six personnes ne représentent pas toute la clientèle.","twohours":true},"37":{"method":"Segmenter consiste à regrouper des clients selon des besoins ou comportements utiles. Les segments doivent guider des offres concrètes, sans réduire les personnes à des clichés.","dossier":"Profils : étudiant pressé budget 5 €, famille quatre personnes budget 25 €, salarié cherchant un déjeuner pratique budget 9 €.","task":"Construis une matrice besoins/produits/services ; propose une offre par segment ; teste les offres dans un jeu de rôle.","answer":"Chaque offre doit répondre au besoin et respecter le budget ; un même client peut appartenir à plusieurs segments.","twohours":true},"38":{"method":"Adapter l’offre revient à choisir assortiment, formats, services et prix selon une cible démontrée. Un choix commercial est une hypothèse à vérifier avec des données.","dossier":"Une épicerie proche d’une gare voit 60 % de ses achats entre 7 h et 9 h ; produits phares : boissons et petits-déjeuners.","task":"Propose cinq références, une nouvelle signalétique et un service ; justifie les coûts et les risques ; présente en deux minutes.","answer":"Privilégier praticité et visibilité, mais vérifier marges, disponibilité et faisabilité avant lancement.","twohours":false},"39":{"method":"La largeur mesure le nombre de familles ; la profondeur le nombre de références d’une famille. Les arbitrages dépendent de la surface, des besoins et du stock immobilisé.","dossier":"Magasin A : 6 familles et 40 références ; magasin B : 4 familles et 48 références. Dans B, boissons : 18 références.","task":"Compare largeur et profondeur ; calcule la part des boissons dans B ; propose une réduction de quatre doublons argumentée.","answer":"A est plus large ; B propose davantage de références au total. Boissons B : 18/48 = 37,5 % des références.","twohours":true},"40":{"method":"Choisir un fournisseur nécessite une comparaison multicritère : prix d’achat, délai, qualité, fiabilité, quantité minimale, conditionnement et services. Les critères peuvent être pondérés.","dossier":"A : 1,80 €/u, délai 8 j, minimum 100 ; B : 1,95 €/u, délai 2 j, minimum 20 ; besoin urgent 40 unités.","task":"Calcule les coûts d’achat selon les minima ; construis une matrice de décision ; justifie le fournisseur retenu pour l’urgence et pour un achat planifié.","answer":"A impose 180 € pour 100 unités ; B 78 € pour 40 unités. Le coût total et le délai priment selon la situation.","twohours":true},"41":{"method":"Taux de disponibilité = références disponibles / références attendues × 100. Il faut définir l’instant du relevé et ne pas confondre références et unités.","dossier":"Rayon de 80 références : 68 présentes ; lundi 72 sur 80 ; mardi 68 sur 80.","task":"Calcule les deux taux et l’évolution en points ; liste trois causes possibles ; propose un contrôle quotidien.","answer":"Lundi 90 %, mardi 85 %, baisse de 5 points. Une cause doit être vérifiée, pas supposée.","twohours":false},"42":{"method":"Marge unitaire = prix de vente HT − coût d’achat HT. Taux de marge = marge / coût HT × 100 ; taux de marque = marge / prix de vente HT × 100. Ne jamais mélanger HT et TTC.","dossier":"Produit A : achat 12 € HT, vente 18 € HT ; B : achat 8 € HT, vente 10 € HT ; ventes prévues : A 20, B 50.","task":"Calcule marge, taux de marge, taux de marque et marge totale ; compare les produits et explique pourquoi le taux seul ne suffit pas.","answer":"A : 6 €, 50 %, 33,33 %, total 120 € ; B : 2 €, 25 %, 20 %, total 100 €.","twohours":true},"43":{"method":"Un indicateur décrit un aspect de l’activité. CA = prix × quantités ; panier moyen = CA / tickets ; évolution = (nouveau − ancien) / ancien × 100. Il faut interpréter avec prudence.","dossier":"Semaine 1 : CA 4 800 €, 240 tickets ; semaine 2 : CA 5 400 €, 270 tickets ; coût promo supplémentaire 100 €.","task":"Calcule paniers moyens et évolution du CA ; propose deux explications possibles ; indique quelle donnée manque pour juger la rentabilité.","answer":"Panier moyen 20 € les deux semaines ; CA +12,5 %. Il manque notamment la marge et les coûts complets.","twohours":true},"45":{"method":"Une rupture peut venir d’une prévision insuffisante, d’un délai fournisseur, d’un stock erroné ou d’un problème de mise en rayon. La démarque nécessite une analyse distincte.","dossier":"Produit A : vente 8/jour, stock 12, livraison dans 3 jours ; B : vente 2/jour, stock 20, livraison dans 2 jours.","task":"Estime le besoin avant livraison ; identifie le risque de rupture ; propose un seuil d’alerte et deux mesures de prévention.","answer":"A : besoin estimé 24, manque potentiel 12 ; B : besoin 4, stock suffisant. Les ventes réelles peuvent varier.","twohours":true},"46":{"method":"Optimiser un linéaire consiste à équilibrer visibilité, facings, stock, accessibilité et logique d’achat. Les décisions doivent être testées, pas uniquement décoratives.","dossier":"Tablette de 100 cm : A largeur 10 cm, B 20 cm, C 15 cm ; A se vend deux fois plus vite que C.","task":"Conçois deux implantations respectant 100 cm ; compare les facings et justifie la visibilité du produit A sans négliger les autres.","answer":"Exemple : A×4 + B×1 + C×2 = 90 cm. Justifier l’espace libre et l’accessibilité.","twohours":true},"47":{"method":"Les zones chaudes et froides se déterminent par observation des déplacements, pas par une règle fixe sur l’emplacement de l’entrée. Un comptage permet de tester une hypothèse.","dossier":"Sur 100 clients observés : 80 passent en zone A, 45 en B, 25 en C. Une nouveauté est placée en C.","task":"Calcule les proportions ; propose une modification de signalétique et un test sur une semaine ; définis un indicateur de succès.","answer":"A 80 %, B 45 %, C 25 %. Déplacer la nouveauté peut aider, mais il faut comparer les ventes avant/après.","twohours":false},"48":{"method":"Une implantation se justifie avec des critères hiérarchisés : sécurité, accessibilité, lisibilité, cohérence des produits, disponibilité et objectifs commerciaux.","dossier":"Plan A : produits lourds en haut, parcours court ; plan B : lourds en bas, parcours un peu plus long et allées dégagées.","task":"Construis une grille de notation à cinq critères ; défends le plan choisi en trois minutes ; réponds à deux objections.","answer":"La sécurité ne se compense pas par un gain commercial : le plan B est à privilégier sur ce point.","twohours":true},"49":{"method":"Une animation commerciale doit avoir un objectif mesurable, une cible, un message clair, un budget, un calendrier et un bilan. La promotion doit respecter les règles d’information des prix.","dossier":"Opération dégustation fictive : budget 120 €, objectif vendre 40 unités ; marge unitaire avant animation 3 €.","task":"Prépare une affiche Canva et un planning ; calcule la marge totale attendue ; explique si elle couvre le budget d’animation.","answer":"40×3 = 120 € de marge brute produit : elle couvre tout juste le budget fictif, hors autres coûts.","twohours":true},"50":{"method":"Une signalétique efficace oriente, informe et rassure. Elle doit être lisible, cohérente avec le parcours et exacte ; la décoration ne doit pas masquer les prix ou les informations obligatoires.","dossier":"Magasin avec entrée, caisse et quatre familles ; trois clients ne trouvent pas le rayon sans gluten.","task":"Dessine une signalétique à trois niveaux (entrée, allée, rayon) ; teste-la avec un camarade ; note deux améliorations.","answer":"Un bon test vérifie que le client atteint le bon rayon sans explication orale ; ne pas promettre « sans allergènes » sans preuve.","twohours":false},"51":{"method":"L’efficacité d’une promotion s’analyse en quantités, CA, marge totale et coûts supplémentaires. Une hausse du CA peut s’accompagner d’une baisse de rentabilité.","dossier":"Avant : 30 unités à 10 € HT, coût 6 € ; pendant : 45 unités à 8 € HT, coût 6 €, frais d’affiche 15 €.","task":"Calcule CA, marge totale et résultat après frais pour les deux périodes ; rédige une recommandation argumentée.","answer":"Avant : CA 300 €, marge 120 € ; pendant : CA 360 €, marge 90 €, après frais 75 €. Le CA monte, la contribution baisse.","twohours":true},"52":{"method":"Une étude de cas suit une méthode : identifier le problème, trier les données, calculer si nécessaire, proposer des solutions et argumenter les choix. Une décision sans preuve reste une hypothèse.","dossier":"Commerce : 100 références, 12 ruptures, CA 3 000 € sur 150 tickets, 4 étiquettes erronées.","task":"Calcule disponibilité et panier moyen ; classe trois priorités ; écris une note de conseil de dix lignes.","answer":"Disponibilité 88 % ; panier moyen 20 €. Corriger les erreurs de prix et traiter les ruptures avec un plan de suivi.","twohours":false},"53":{"method":"Un CCF blanc vérifie la capacité à observer, analyser, réaliser et justifier une implantation. Préparer un dossier lisible avec données, plan, décisions et bilan.","dossier":"Rayon de 3 tablettes, 12 références, deux ruptures et une étiquette absente ; dimensions fournies par l’enseignant.","task":"Réalise diagnostic, planogramme et oral de quatre minutes ; un binôme évalue les justifications avec une grille.","answer":"Une bonne production relie chaque modification à un problème observé et respecte les contraintes.","twohours":true},"54":{"method":"Argumenter une décision commerciale consiste à présenter un choix, une preuve chiffrée, un bénéfice client, une limite et une méthode de contrôle.","dossier":"Ton enseigne a deux projets : élargir l’offre ou renforcer le stock des références populaires. Budget supplémentaire 300 €.","task":"Prépare un oral de quatre minutes avec trois chiffres ; réponds à une objection ; propose un indicateur de contrôle.","answer":"Les arguments doivent relier besoin client, faisabilité, coût et indicateur ; aucune option n’est gagnante sans contexte.","twohours":true},"55":{"method":"Un dossier final doit raconter une démarche cohérente : cible, offre, implantation, approvisionnement, expérience client, indicateurs et améliorations. Il ne suffit pas d’assembler des images.","dossier":"Dossier Mon Enseigne 2027 : concept, plan, assortiment, fournisseurs, accueil, stocks, prix, tableau de bord et bilan personnel.","task":"Contrôle la présence des neuf rubriques ; écris une synthèse de 150 mots ; prépare une présentation de deux minutes ; demande un retour pair.","answer":"Un dossier réussi montre des décisions justifiées, des calculs cohérents, des sources de données et une progression personnelle.","twohours":false}},"referentiel":{"source":"Référentiel Chlorofil Bac pro TCV alimentation avril 2024","url":"https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tcv-alim","modules":{"MP1":"Étude opérationnelle du point de vente","MP2":"Expertise conseil en produits alimentaires","MP3":"Conduite de la vente","MP4":"Optimisation du fonctionnement du rayon","MP5":"Qualité des produits alimentaires et hygiène","MP6":"Animation commerciale"},"note":"Rattachements pédagogiques proposés, sans équivalence automatique avec les capacités certifiées.","capacites":{"C5.1":"Situer le produit sur le marché","C5.2":"Proposer des actions commerciales en vue de l’implantation d’un produit","C6.1":"Réguler son activité par des échanges avec sa hiérarchie","C6.2":"Rendre compte d’observations susceptibles d’avoir une influence sur la politique commerciale","C7.1":"Conseiller un client","C7.2":"Réaliser une vente","C8.1":"Gérer le rayon et son approvisionnement","C8.2":"Préparer à la vente des produits","C9.1":"Installer des espaces de vente promotionnels","C9.2":"Organiser des animations autour des produits alimentaires","C10":"S’adapter à des enjeux professionnels particuliers (MAP : selon établissement)"},"precision":"Correspondance indicative avec les capacités C5 à C9, établie par objectifs de séance ; ne constitue pas une évaluation certificative ni une attribution réglementaire exclusive."}}</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent);let sid=localStorage.getItem('academie-student')||'';let current=0,mode='cours',qi=0,correct=0,selected=null;const getKey=()=>`academie-tcva-v2-${sid||'anonyme'}`;function load(){try{return JSON.parse(localStorage.getItem(getKey())||'{}')}catch{return {}}}let state=load();function persist(){localStorage.setItem(getKey(),JSON.stringify(state))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setStudent(s){sid=s.trim().slice(0,40);localStorage.setItem('academie-student',sid);state=load();showHome()}function sess(i){return DATA.rows[i]}function detail(i){return DATA.content[String(i+1)]}function activity(i){return DATA.activities[String(i+1)]}function doneCount(){return Object.values(state.done||{}).filter(Boolean).length}function drawMenu(){let f=document.getElementById('filter').value;document.getElementById('menu').innerHTML=DATA.rows.map((r,i)=>{let d=detail(i),type=r['Durée'];if(f==='ready'&&!d||f==='1'&&type!=='1 h'||f==='2'&&type!=='2 h')return '';return `<button class="sidebutton ${i===current?'active':''}" onclick="openSession(${i})"><b>${esc(r['Séance'])} · ${esc(r['Thème'])}</b><span>${esc(type)} · ${d?'Cours disponible':'Programmée'} ${state.done?.[i]?' · ✓ terminée':''}</span></button>`}).join('');document.getElementById('sideprogress').style.width=(100*doneCount()/55)+'%';document.getElementById('sidestatus').textContent=`${doneCount()} / 55 séances validées · progression locale`;}function showHome(){current=-1;drawMenu();let n=doneCount(),ready=Object.keys(DATA.content).length;document.getElementById('view').innerHTML=`<span class="tag">Bienvenue ${esc(sid||'dans ton parcours')}</span><h2>Apprends à gérer ton commerce</h2><p class="sub">Un cours, une activité différente, une correction. Pour les ateliers de 2 h, construis ton enseigne avec Canva et SketchUp.</p><div class="statrow"><div class="stat"><strong>${n}/55</strong><small>Séances validées</small></div><div class="stat"><strong>${ready}</strong><small>Cours rédigés</small></div><div class="stat"><strong>${Object.keys(state.answers||{}).length}</strong><small>Activités travaillées</small></div></div><div class="card"><h3>Commencer ou continuer</h3><p>Les séances 01, 15, 29 et 44 sont des temps d'accueil ou de révision. Les séances de 2 h proposent les ateliers créatifs. Les autres alternent quiz, études de textes, enquêtes, situations professionnelles et jeux de rôle en groupe.</p><button class="btn" onclick="openSession(1)">Ouvrir la séance 02 →</button></div><div class="card"><h3>📚 Réviser les essentiels des MP</h3><p>Un manuel indépendant des 55 séances : MP1, MP3, MP6 et formules de gestion, avec définitions, exemples et erreurs à éviter.</p><button class="btn" onclick="showRevisions()">Ouvrir les fiches de révision →</button></div><div class="card blue"><h3>Suivi Google Sheets</h3><p>Export CSV compatible avec Google Sheets. La synchronisation automatique et le tableau enseignant partagé ne sont pas encore connectés : les résultats restent enregistrés dans ce navigateur.</p><div class="actions"><button class="btn secondary" onclick="exportCSV()">Exporter mes résultats (.csv)</button><button class="btn light" onclick="exportJSON()">Sauvegarder mon parcours (.json)</button><label class="btn light" style="cursor:pointer">Restaurer un parcours<input type="file" accept=".json" onchange="importJSON(event)" hidden></label></div></div><p class="note">Version de travail : 55 séances planifiées ; les thèmes techniques disposent maintenant d’un support de travail. Attention : les nouveaux cours 11 à 55 sont des trames pédagogiques à enrichir et valider, pas encore des cours de 20 minutes complets. Les séances libres restent sans nouveau cours. Les correspondances MP sont indicatives et devront être vérifiées sur le référentiel Chlorofil avant publication finale.</p>`}
function openSession(i,m='cours'){current=i;mode=m;qi=0;correct=0;selected=null;drawMenu();render()}
function roleplayHTML(rp){let saved=state.roleplay?.[current]||{};return `<div class="card blue"><h3>🎭 ${esc(rp.title)}</h3><p><b>Le brief :</b> ${esc(rp.brief)}</p><p><b>Organisation :</b> groupes de 3 ; 5 min de préparation, 3 min de scène, 2 min de retour, puis permutation des rôles. Répéter 2 fois (25 min au total).</p></div><div class="rolegrid">${rp.roles.map(([name,desc])=>`<div class="card"><b>🎬 ${esc(name)}</b><p>${esc(desc)}</p></div>`).join('')}</div><div class="card amber"><b>🔀 Rebond de scénario</b><p>${esc(rp.twist)}</p></div><h3>Grille d’observation</h3>${rp.criteria.map((x,j)=>`<label class="checkline"><input type="checkbox" id="rolecheck${j}" ${saved.criteria?.[j]?'checked':''}> ${esc(x)}</label>`).join('')}<label class="field">Retour du groupe : une réussite et une piste d’amélioration<textarea id="rolefeedback" placeholder="Note les observations concrètes...">${esc(saved.feedback||'')}</textarea></label><button class="btn" onclick="saveRoleplay()">Enregistrer le jeu de rôle</button><p class="note">Aucun QCM imposé : l’évaluation porte sur les comportements observables et la justification des décisions.</p>`}function saveRoleplay(){let rp=DATA.roleplays[String(current+1)];state.roleplay??={};state.roleplay[current]={criteria:rp.criteria.map((_,j)=>document.getElementById('rolecheck'+j).checked),feedback:document.getElementById('rolefeedback').value};persist();alert('Jeu de rôle enregistré sur cet appareil.')}

function mathFigure(kind){const bars=kind==='marge'?[80,120,40]:kind==='remise'?[100,75,25]:kind==='promo'?[100,120,75]:[100,65,35];const labels=kind==='marge'?['Achat','Vente','Marge']:kind==='remise'?['Initial','Final','Remise']:kind==='promo'?['CA avant','CA après','Marge']:['Initial','Final','Écart'];return `<div class="math-figure"><svg viewBox="0 0 240 110" role="img" aria-label="Schéma comparatif des indicateurs"><line x1="10" y1="87" x2="235" y2="87" stroke="#7b9aa7"/>${bars.map((b,i)=>`<rect x="${22+i*75}" y="${87-b*.58}" width="47" height="${b*.58}" rx="5" fill="${['#237c99','#50a8a1','#f1ad57'][i]}"/><text x="${45+i*75}" y="103" font-size="9" text-anchor="middle" fill="#28465a">${labels[i]}</text>`).join('')}</svg><p><b>À observer :</b> ce schéma illustre les différences entre indicateurs. Les hauteurs sont pédagogiques, pas un graphique à l’échelle des données de l’exercice. Toujours calculer avant de conclure.</p></div>`}
function mathHTML(w,withAnswers=false){return `<div class="card blue"><h3>🧮 ${esc(w.title)}</h3><p>${esc(w.context)}</p></div>${mathFigure(w.visual)}<table class="math-table"><thead><tr>${w.cols.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${w.rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table><h3>À toi de calculer et de justifier</h3>${w.tasks.map(([q,a],j)=>`<div class="math-task"><b>${j+1}. ${esc(q)}</b>${withAnswers?`<p>${esc(a)}</p>`:`<textarea id="math${j}" placeholder="Écris ton calcul, ton résultat et ton interprétation...">${esc(state.math?.[current]?.[j]||'')}</textarea><details><summary>Voir la méthode et la correction</summary><p>${esc(a)}</p></details>`}</div>`).join('')}${withAnswers?'':`<button class="btn" onclick="saveMath()">Enregistrer mes calculs</button><p class="note">Travail personnel ou en binôme. Les réponses sont sauvegardées sur cet appareil ; le professeur valide le raisonnement.</p>`}`}
function saveMath(){const w=DATA.mathwork[String(current+1)];state.math??={};state.math[current]=w.tasks.map((_,j)=>document.getElementById('math'+j).value);persist();alert('Calculs enregistrés sur cet appareil.')}


function guidedWorkshopHTML(w){const notes=state.guided?.[current]||{};return `<div class="card blue"><h3>🧭 Trame guidée — ${esc(w.title)}</h3><p>${esc(w.brief)}</p><p><b>Organisation :</b> 90 minutes de mission + environ 30 minutes de cours, d’échanges et de restitution pour une séance de 2 h. Les durées sont indicatives.</p></div><div class="card"><h3>📝 Ma fiche de préparation</h3><label class="field">Nom de mon enseigne<input id="g-name" value="${esc(notes.name||'')}" placeholder="Nom provisoire de ton magasin"></label><label class="field">Clientèle visée et besoin prioritaire<textarea id="g-target" placeholder="Qui ? Quel problème résolu ?">${esc(notes.target||'')}</textarea></label><label class="field">Mes contraintes et ressources<textarea id="g-constraints" placeholder="Budget, local, produits, horaires, sécurité...">${esc(notes.constraints||'')}</textarea></label></div><h3>Les étapes de la mission</h3>${w.steps.map(([time,title,task,proof],j)=>`<div class="chapter-card"><h3>${esc(time)} · ${esc(title)}</h3><p>${esc(task)}</p><p><b>Preuve à produire :</b> ${esc(proof)}</p><label class="field">Mes décisions et résultats<textarea id="g-step${j}" placeholder="Écris ici tes choix, calculs ou références de fichier...">${esc((notes.steps||[])[j]||'')}</textarea></label></div>`).join('')}<div class="card"><h3>✓ Vérification avant de rendre</h3>${w.criteria.map(c=>`<label class="checkline"><input type="checkbox">${esc(c)}</label>`).join('')}<label class="field">Lien Canva, SketchUp ou document (facultatif)<input id="g-link" value="${esc(notes.link||'')}" placeholder="https://..."></label><label class="field">Ce que j’améliorerai la prochaine fois<textarea id="g-review">${esc(notes.review||'')}</textarea></label><button class="btn" onclick="saveGuidedWorkshop()">Enregistrer ma mission</button><p class="note">Sauvegarde locale sur cet appareil : conserve également ton fichier de production sur ton espace scolaire.</p></div>`}
function saveGuidedWorkshop(){const w=DATA.guidedWorkshops[String(current+1)];if(!w)return;state.guided??={};state.guided[current]={name:document.getElementById('g-name').value,target:document.getElementById('g-target').value,constraints:document.getElementById('g-constraints').value,steps:w.steps.map((_,j)=>document.getElementById('g-step'+j).value),link:document.getElementById('g-link').value,review:document.getElementById('g-review').value};persist();alert('Mission enregistrée sur cet appareil.');}


function boosterHTML(b,asActivity){if(!b)return '';if(!asActivity)return `<div class="card amber"><h3>🧠 Le dossier professionnel à préparer</h3><p>${esc(b.dossier)}</p><p><b>Compétence attendue :</b> ${esc(b.method)}</p></div>`;return `<div class="card blue"><span class="tag">${b.twohours?'Mission longue':'Défi de 25 minutes'}</span><h3>📁 Mission professionnelle — données réelles de l’exercice</h3><p>${esc(b.dossier)}</p><p><b>Travail demandé :</b> ${esc(b.task)}</p><ol class="steps"><li><b>5 min :</b> relève les données et reformule le problème.</li><li><b>${b.twohours?'35':'12'} min :</b> effectue les calculs, prépare ton document, ton plan ou ton jeu de rôle.</li><li><b>${b.twohours?'15':'8'} min :</b> compare avec un binôme, justifie ta décision et améliore ta réponse.</li></ol><label class="field">Mon analyse, mes calculs et ma décision<textarea id="boost-answer" placeholder="Rédige ta démarche, pas seulement le résultat...">${esc((state.boost||{})[current]||'')}</textarea></label><button class="btn secondary" onclick="saveBooster()">Enregistrer ma réponse</button><details class="card"><summary><b>✓ Corrigé commenté — à consulter après l’activité</b></summary><p>${esc(b.answer)}</p><p>Vérifie les unités, les hypothèses et la justification professionnelle ; une autre solution peut être valable si elle est argumentée et sûre.</p></details></div>`}
function saveBooster(){state.boost??={};state.boost[current]=document.getElementById('boost-answer').value;persist();alert('Réponse enregistrée sur cet appareil.');}

const REVISIONS=[{"mp": "MP1", "name": "Étude opérationnelle du point de vente", "intro": "Analyser l’environnement commercial et prendre des décisions pour le point de vente.", "sections": [["Zone de chalandise", "Territoire d’où viennent les clients potentiels. Examiner accessibilité, concurrence, flux et profils de clientèle.", "Une épicerie près d’un lycée cible les élèves à midi, mais aussi les habitants du quartier.", "Ne pas confondre clientèle réelle et clientèle supposée."], ["Segmentation et positionnement", "Segmenter consiste à distinguer des groupes de clients aux besoins proches. Positionner, c’est choisir la place que l’enseigne veut occuper face aux concurrents.", "Une offre locale à prix accessibles n’a pas le même positionnement qu’une épicerie haut de gamme.", "Éviter une cible « tout le monde » sans justification."], ["Diagnostic commercial", "Observer forces, faiblesses, opportunités et menaces en s’appuyant sur des faits : prix, trafic, assortiment, services.", "Comparer deux magasins sur le prix d’un panier identique et la facilité d’accès.", "Une impression personnelle n’est pas une donnée mesurée."], ["Indicateurs de pilotage", "Chiffre d’affaires = somme des ventes ; panier moyen = CA ÷ nombre de tickets ; évolution % = (nouveau − ancien) ÷ ancien × 100.", "2 400 € de CA pour 120 tickets : panier moyen 20 €.", "Le CA ne mesure pas à lui seul la rentabilité."]]}, {"mp": "MP2", "name": "Expertise conseil en produits alimentaires", "intro": "Connaître les produits pour expliquer leurs caractéristiques et conseiller sans inventer.", "sections": [["Familles et caractéristiques", "Identifier les familles, les ingrédients, les usages, la conservation et les caractéristiques utiles au choix du client.", "Comparer deux jus sur composition, volume, conservation et prix au litre.", "Ne pas affirmer une propriété nutritionnelle non vérifiée."], ["Lire une étiquette", "Repérer dénomination, ingrédients, allergènes, quantité, dates, conditions de conservation et informations obligatoires pertinentes.", "Un client allergique aux fruits à coque demande de vérifier l’étiquette avant toute recommandation.", "Ne jamais garantir l’absence d’allergène sans information fiable."], ["Conseil adapté", "Relier un besoin explicite à des critères produits vérifiables : goût, budget, usage, origine, conservation.", "Pour un pique-nique sans glacière, vérifier si le produit choisi exige le froid.", "Ne pas substituer une intuition à une vérification de l’emballage."], ["Comparaison argumentée", "Comparer à unité égale, distinguer faits et arguments commerciaux, signaler les limites des données.", "Deux formats de 750 mL et 1 L se comparent au prix au litre.", "Un prix de vente plus bas n’est pas forcément un meilleur prix unitaire."]]}, {"mp": "MP3", "name": "Conduite de la vente", "intro": "Accueillir, découvrir le besoin, argumenter et conclure avec professionnalisme.", "sections": [["Les étapes de la vente", "Accueil → découverte du besoin → reformulation → conseil/argumentation → réponse aux objections → conclusion.", "« Vous cherchez un cadeau gourmand à moins de 20 €, c’est bien cela ? »", "Ne pas présenter un produit avant d’avoir compris le besoin."], ["Écoute active", "Questionner sans interrompre, reformuler, confirmer les contraintes et adapter son langage.", "« Vous souhaitez une option sans lactose ; vérifions ensemble la composition. »", "Une question fermée ne suffit pas toujours à comprendre le besoin."], ["Argumentation CAP", "Caractéristique → avantage → preuve, avec des éléments observables.", "Caractéristique : format refermable ; avantage : transport facile ; preuve : fermeture visible.", "Éviter les promesses non prouvées."], ["Réclamation", "Rester calme, écouter, vérifier les faits, appliquer la procédure et proposer une solution autorisée.", "Produit abîmé : recueillir ticket et lot, prévenir le responsable si nécessaire.", "Ne pas promettre un remboursement hors procédure."]]}, {"mp": "MP4", "name": "Optimisation du fonctionnement du rayon", "intro": "Approvisionner, implanter, contrôler les stocks et améliorer le fonctionnement du rayon.", "sections": [["Réception et contrôle", "Comparer commande, livraison et marchandises : références, quantités, état, dates et conditions pertinentes.", "Commande 24 unités, livraison 22 : signaler un écart de −2.", "Ne pas signer sans contrôle prévu par la procédure."], ["FIFO, FEFO et réassort", "FIFO : premier entré, premier sorti. FEFO : date de péremption la plus proche d’abord. Réassortir sans masquer les dates.", "Placer devant les yaourts dont la DLC est la plus proche, si leur état est conforme.", "FIFO et FEFO ne sont pas interchangeables."], ["Stocks et inventaire", "Stock théorique final = initial + entrées − sorties. Écart = stock réel − stock théorique.", "40 + 25 − 50 = 15 théoriques ; 13 comptés : écart −2.", "Un écart ne prouve pas automatiquement un vol."], ["Facing et implantation", "Facing : nombre de produits visibles de face. Optimiser lisibilité, accessibilité, rotation et sécurité.", "Comparer deux implantations selon visibilité et facilité de réassort.", "Une présentation attractive ne doit pas compromettre la sécurité."], ["Marges et gestion", "Marge commerciale unitaire = PV HT − coût d’achat HT. Taux de marge = marge ÷ coût HT × 100 ; taux de marque = marge ÷ PV HT × 100.", "Achat 8 € HT, vente 12 € HT : marge 4 €, taux de marge 50 %, taux de marque 33,33 %.", "Ne pas confondre taux de marge et taux de marque."]]}, {"mp": "MP5", "name": "Qualité des produits alimentaires et hygiène", "intro": "Préserver la qualité et maîtriser les risques sanitaires en magasin.", "sections": [["Dangers et prévention", "Identifier les dangers biologiques, chimiques, physiques et allergènes ; limiter contaminations croisées.", "Séparer les produits d’entretien des denrées et suivre les procédures.", "Nettoyer et désinfecter sont deux opérations différentes."], ["DLC et DDM", "DLC : date limite de consommation ; produit concerné non commercialisable après dépassement. DDM : qualité optimale, sans interdiction automatique de vente après la date.", "Comparer deux emballages et expliquer le traitement prévu pour chacun.", "Ne pas confondre les deux dates."], ["Chaîne du froid", "Respecter les températures prescrites pour chaque catégorie et la procédure de surveillance. Mesurer, consigner, alerter si anomalie.", "Une vitrine réfrigérée présente un écart : isoler les produits concernés et alerter selon le protocole.", "Ne pas inventer une température universelle pour tous les aliments."], ["Traçabilité et retrait-rappel", "Identifier lot, fournisseur, dates, mouvements et actions menées. Bloquer un lot rappelé selon les consignes.", "Un rappel vise le lot L204 : retrouver les produits, retirer de la vente et tracer l’action.", "Un simple retrait du rayon sans enregistrement peut être insuffisant."]]}, {"mp": "MP6", "name": "Animation commerciale", "intro": "Concevoir, organiser et évaluer une action qui valorise l’offre.", "sections": [["Objectif et cible", "Définir un objectif mesurable, une cible, un message et une durée.", "Faire découvrir une gamme locale sur deux jours avec un objectif de 50 dégustations.", "« Vendre plus » sans indicateur ne permet pas de mesurer l’effet."], ["Préparer l’opération", "Vérifier stock, budget, emplacement, signalétique, calendrier et règles applicables.", "Prévoir un stock suffisant avant d’annoncer une réduction.", "Une promotion ne doit pas créer une rupture immédiate."], ["Signalétique", "Message lisible, prix exact, conditions claires et implantation cohérente avec le parcours client.", "Comparer deux affiches pour retenir celle dont le prix et la durée sont lisibles.", "Éviter les conditions ambiguës."], ["Évaluer une promotion", "Comparer volumes, CA, marge et coûts supplémentaires, avec une période de référence pertinente.", "Avant : 30 × 4 € = 120 € de marge ; après : 45 × 2 € = 90 €.", "Une hausse des ventes ne garantit pas une hausse du bénéfice."]]}, {"mp": "Calculs", "name": "Formules commerciales transversales", "intro": "S’entraîner aux calculs utilisés dans plusieurs modules.", "sections": [["Remise", "Prix remisé = prix initial × (1 − taux/100).", "20 € avec −15 % : 20 × 0,85 = 17 €.", "Ne pas retirer 15 € au lieu de 15 %."], ["TVA", "PV TTC = PV HT × (1 + taux/100) ; PV HT = PV TTC ÷ (1 + taux/100).", "10 € HT avec TVA 5,5 % : 10,55 € TTC.", "Utiliser le taux réellement applicable au produit."], ["Marge", "Marge = vente HT − coût d’achat HT. Taux de marge = marge ÷ coût × 100. Taux de marque = marge ÷ vente HT × 100.", "Coût 8 €, vente 12 € HT : marge 4 € ; 50 % de marge ; 33,33 % de marque.", "Le dénominateur change selon le taux."], ["Stock", "Final = initial + entrées − sorties ; écart = réel − théorique.", "30 + 20 − 35 = 15 ; réel 14 : écart −1.", "Toujours préciser l’unité."], ["Panier moyen", "Panier moyen = chiffre d’affaires ÷ nombre de tickets.", "1 500 € pour 75 tickets : 20 € par ticket.", "Ne pas confondre tickets et visiteurs."]]}];
const REVISION_PLUS={};
function showRevisions(mp){current=-1;drawMenu();const tabs=REVISIONS.map(r=>`<button class="btn ${r.mp===mp?'':'secondary'}" onclick="showRevisions('${r.mp}')">${esc(r.mp==='Calculs'?'🧮 Calculs':r.mp)}</button>`).join('');const chosen=REVISIONS.filter(r=>!mp||r.mp===mp);document.getElementById('view').innerHTML=`<span class="tag">Manuel indépendant des séances</span><h2>📚 Réviser mes MP</h2><p class="sub">Notions, méthodes, exemples corrigés et activités de révision regroupés ici. Pas besoin d'ouvrir les 55 cours. Les intitulés et regroupements sont pédagogiques : vérifier les libellés officiels du référentiel avec l'enseignant.</p><div class="topnav"><button class="btn ${!mp?'':'secondary'}" onclick="showRevisions()">Tout voir</button>${tabs}</div>${chosen.map(r=>`<section class="card"><h2>${esc(r.mp)} · ${esc(r.name)}</h2><p>${esc(r.intro)}</p><div class="rev-grid">${r.sections.map((v,i)=>`<div class="rev-card"><span class="tag gray">Fiche ${i+1}</span><h3>${esc(v[0])}</h3><p>${esc(v[1])}</p><p><strong>Exemple :</strong> ${esc(v[2])}</p><p class="note"><strong>⚠ À éviter :</strong> ${esc(v[3])}</p></div>`).join('')}</div><h3>📘 Approfondir et s’entraîner</h3><div class="rev-grid">${(REVISION_PLUS[r.mp]||[]).map((v,i)=>`<div class="rev-card"><span class="tag gray">Mémo ${i+1}</span><h3>${esc(v[0])}</h3><p>${esc(v[1])}</p><p><strong>Exemple corrigé :</strong> ${esc(v[2])}</p><p class="note"><strong>À pratiquer / point de vigilance :</strong> ${esc(v[3])}</p></div>`).join('')}</div></section>`).join('')}<div class="actions rev-print"><button class="btn secondary" onclick="window.print()">🖨 Imprimer les fiches</button><button class="btn light" onclick="showHome()">Retour à l'accueil</button></div>`}
