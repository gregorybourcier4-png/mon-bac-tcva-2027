 lisibilité.","Le nombre de facings, la hauteur d’implantation et les regroupements influencent l’expérience d’achat.","Un produit très demandé est placé dans une zone peu visible.","Optimiser un linéaire consiste à équilibrer visibilité, facings, stock, accessibilité et logique d’achat."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"47":{"mp":"MP1 · MP4","objective":"Comprendre et appliquer : analyser zones chaudes et zones froides. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Les zones chaudes sont plus fréquentées ou plus visibles que les zones froides, selon la configuration du magasin."],["Méthode professionnelle","On vérifie les déplacements réels plutôt que de supposer que toutes les entrées produisent le même parcours."],["Observer une situation","Une allée secondaire reçoit peu de visiteurs malgré une offre attractive."],["Analyser avant de décider","Pour « analyser zones chaudes et zones froides », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Les zones chaudes et froides se déterminent par observation des déplacements, pas par une règle fixe sur l’emplacement de l’entrée. Un comptage permet de tester une hypothèse."],["Dossier de travail — données à exploiter","Sur 100 clients observés : 80 passent en zone A, 45 en B, 25 en C. Une nouveauté est placée en C."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["Les zones chaudes sont plus fréquentées ou plus visibles que les zones froides, selon la configuration du magasin.","On vérifie les déplacements réels plutôt que de supposer que toutes les entrées produisent le même parcours.","Une allée secondaire reçoit peu de visiteurs malgré une offre attractive.","Les zones chaudes et froides se déterminent par observation des déplacements, pas par une règle fixe sur l’emplacement de l’entrée."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"48":{"mp":"MP4","objective":"Comprendre et appliquer : justifier une implantation commerciale. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Une implantation commerciale doit concilier parcours client, sécurité, conservation, accessibilité et objectifs de vente."],["Méthode professionnelle","Une décision se justifie avec des observations, des contraintes et un bénéfice attendu."],["Observer une situation","Déplacer le rayon boissons près de l’entrée : quels avantages et risques ?"],["Analyser avant de décider","Pour « justifier une implantation commerciale », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Une implantation se justifie avec des critères hiérarchisés : sécurité, accessibilité, lisibilité, cohérence des produits, disponibilité et objectifs commerciaux."],["Dossier de travail — données à exploiter","Plan A : produits lourds en haut, parcours court ; plan B : lourds en bas, parcours un peu plus long et allées dégagées."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Une implantation commerciale doit concilier parcours client, sécurité, conservation, accessibilité et objectifs de vente.","Une décision se justifie avec des observations, des contraintes et un bénéfice attendu.","Déplacer le rayon boissons près de l’entrée : quels avantages et risques ?.","Une implantation se justifie avec des critères hiérarchisés : sécurité, accessibilité, lisibilité, cohérence des produits, disponibilité et objectifs commerciaux."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"49":{"mp":"MP6","objective":"Comprendre et appliquer : préparer une animation promotionnelle. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Une animation promotionnelle possède un objectif, une cible, une mécanique, un calendrier et des indicateurs de résultat."],["Méthode professionnelle","Prévoir le stock, le budget, la signalétique, le respect des règles commerciales et la sécurité."],["Observer une situation","Organiser une dégustation de produits locaux un samedi matin."],["Analyser avant de décider","Pour « préparer une animation promotionnelle », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Une animation commerciale doit avoir un objectif mesurable, une cible, un message clair, un budget, un calendrier et un bilan. La promotion doit respecter les règles d’information des prix."],["Dossier de travail — données à exploiter","Opération dégustation fictive : budget 120 €, objectif vendre 40 unités ; marge unitaire avant animation 3 €."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Une animation promotionnelle possède un objectif, une cible, une mécanique, un calendrier et des indicateurs de résultat.","Prévoir le stock, le budget, la signalétique, le respect des règles commerciales et la sécurité.","Organiser une dégustation de produits locaux un samedi matin.","Une animation commerciale doit avoir un objectif mesurable, une cible, un message clair, un budget, un calendrier et un bilan."],"referentiel":[{"code":"MP6","intitule":"Animation commerciale"}],"capacites":[{"code":"C9.1","libelle":"Installer des espaces de vente promotionnels"},{"code":"C9.2","libelle":"Organiser des animations autour des produits alimentaires"}]},"50":{"mp":"MP6","objective":"Comprendre et appliquer : concevoir une signalétique efficace. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Une signalétique efficace aide le client à s’orienter et à comprendre l’offre."],["Méthode professionnelle","Elle doit être lisible, cohérente, accessible et conforme aux informations à afficher."],["Observer une situation","Un rayon utilise cinq polices et trois couleurs pour une même promotion."],["Analyser avant de décider","Pour « concevoir une signalétique efficace », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Une signalétique efficace oriente, informe et rassure. Elle doit être lisible, cohérente avec le parcours et exacte ; la décoration ne doit pas masquer les prix ou les informations obligatoires."],["Dossier de travail — données à exploiter","Magasin avec entrée, caisse et quatre familles ; trois clients ne trouvent pas le rayon sans gluten."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["Une signalétique efficace aide le client à s’orienter et à comprendre l’offre.","Elle doit être lisible, cohérente, accessible et conforme aux informations à afficher.","Un rayon utilise cinq polices et trois couleurs pour une même promotion.","Une signalétique efficace oriente, informe et rassure."],"referentiel":[{"code":"MP6","intitule":"Animation commerciale"}],"capacites":[{"code":"C9.1","libelle":"Installer des espaces de vente promotionnels"}]},"51":{"mp":"MP6","objective":"Comprendre et appliquer : mesurer l'efficacité d'une promotion. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Pourquoi mesurer une promotion ?","Une hausse des ventes ne suffit pas à prouver qu’une promotion est rentable. Il faut regarder les quantités vendues, le chiffre d’affaires, la marge et éventuellement les invendus."],["Chiffre d’affaires","CA = quantité vendue × prix de vente. Exemple : 40 unités à 5 € = 200 € de CA. Attention : CA et marge ne sont pas synonymes."],["Comparer avant et pendant","Avant : 30 articles à 10 € = 300 € de CA. Pendant : 45 articles à 8 € = 360 € de CA. Le CA augmente de 60 €, soit +20 %."],["Calculer la marge de l’opération","Si l’achat coûte 6 € HT, avant la promotion la marge unitaire est 4 € et la marge totale 120 €. Pendant, la marge unitaire n’est plus que 2 € et la marge totale 90 €. Le CA monte mais la marge baisse."],["Calculer un taux d’évolution","Évolution (%) = (valeur nouvelle − valeur initiale) ÷ valeur initiale × 100. Une évolution négative correspond à une diminution."],["Décider et expliquer","Prendre en compte les objectifs de la promotion : attirer des clients, écouler un stock ou dégager une marge. Vérifier les données comparables (même durée, même périmètre) et ne pas attribuer automatiquement tous les changements à la promotion."],["Approfondissement — raisonner comme un professionnel","L’efficacité d’une promotion s’analyse en quantités, CA, marge totale et coûts supplémentaires. Une hausse du CA peut s’accompagner d’une baisse de rentabilité."],["Dossier de travail — données à exploiter","Avant : 30 unités à 10 € HT, coût 6 € ; pendant : 45 unités à 8 € HT, coût 6 €, frais d’affiche 15 €."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["CA = quantité × prix.","Marge totale = quantité × (PV HT − PA HT).","Évolution (%) = (nouveau − ancien) ÷ ancien × 100.","Une hausse de CA peut masquer une baisse de marge."],"referentiel":[{"code":"MP6","intitule":"Animation commerciale"}],"capacites":[{"code":"C9.2","libelle":"Organiser des animations autour des produits alimentaires"}]},"52":{"mp":"MP1 · MP4","objective":"Comprendre et appliquer : réaliser une étude de cas commerciale. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Une étude de cas commerciale consiste à identifier le problème, analyser les données, comparer des options et justifier une décision."],["Méthode professionnelle","Citer les documents et distinguer faits, calculs et hypothèses."],["Observer une situation","Un rayon connaît une baisse de ventes et une hausse des invendus."],["Analyser avant de décider","Pour « réaliser une étude de cas commerciale », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Une étude de cas suit une méthode : identifier le problème, trier les données, calculer si nécessaire, proposer des solutions et argumenter les choix. Une décision sans preuve reste une hypothèse."],["Dossier de travail — données à exploiter","Commerce : 100 références, 12 ruptures, CA 3 000 € sur 150 tickets, 4 étiquettes erronées."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["Une étude de cas commerciale consiste à identifier le problème, analyser les données, comparer des options et justifier une décision.","Citer les documents et distinguer faits, calculs et hypothèses.","Un rayon connaît une baisse de ventes et une hausse des invendus.","Une étude de cas suit une méthode : identifier le problème, trier les données, calculer si nécessaire, proposer des solutions et argumenter les choix."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C5.1","libelle":"Situer le produit sur le marché"},{"code":"C5.2","libelle":"Proposer des actions commerciales en vue de l’implantation d’un produit"}]},"53":{"mp":"MP4","objective":"Comprendre et appliquer : préparer un ccf blanc de merchandising. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Une évaluation de merchandising demande d’observer, diagnostiquer, proposer puis justifier une implantation."],["Méthode professionnelle","Préparer un plan lisible, des choix argumentés et des indicateurs de vérification."],["Observer une situation","Un rayon de 4 m doit être réorganisé pour réduire les ruptures."],["Analyser avant de décider","Pour « préparer un ccf blanc de merchandising », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Un CCF blanc vérifie la capacité à observer, analyser, réaliser et justifier une implantation. Préparer un dossier lisible avec données, plan, décisions et bilan."],["Dossier de travail — données à exploiter","Rayon de 3 tablettes, 12 références, deux ruptures et une étiquette absente ; dimensions fournies par l’enseignant."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Une évaluation de merchandising demande d’observer, diagnostiquer, proposer puis justifier une implantation.","Préparer un plan lisible, des choix argumentés et des indicateurs de vérification.","Un rayon de 4 m doit être réorganisé pour réduire les ruptures.","Un CCF blanc vérifie la capacité à observer, analyser, réaliser et justifier une implantation."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"54":{"mp":"MP4","objective":"Comprendre et appliquer : argumenter ses choix de gestion de rayon. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Argumenter une décision de gestion de rayon nécessite un objectif, des faits, une proposition et ses limites."],["Méthode professionnelle","Une bonne argumentation relie intérêt client, faisabilité et résultat attendu."],["Observer une situation","Défendre une réduction de l’assortiment devant un responsable."],["Analyser avant de décider","Pour « argumenter ses choix de gestion de rayon », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Argumenter une décision commerciale consiste à présenter un choix, une preuve chiffrée, un bénéfice client, une limite et une méthode de contrôle."],["Dossier de travail — données à exploiter","Ton enseigne a deux projets : élargir l’offre ou renforcer le stock des références populaires. Budget supplémentaire 300 €."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Argumenter une décision de gestion de rayon nécessite un objectif, des faits, une proposition et ses limites.","Une bonne argumentation relie intérêt client, faisabilité et résultat attendu.","Défendre une réduction de l’assortiment devant un responsable.","Argumenter une décision commerciale consiste à présenter un choix, une preuve chiffrée, un bénéfice client, une limite et une méthode de contrôle."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C6.2","libelle":"Rendre compte d’observations susceptibles d’avoir une influence sur la politique commerciale"},{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"55":{"mp":"MP1 · MP3 · MP4 · MP6","objective":"Comprendre et appliquer : finaliser le dossier mon enseigne 2027. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Le dossier final rassemble les productions de l’année et les décisions justifiées."],["Méthode professionnelle","Il doit montrer l’évolution du projet, les corrections effectuées et les compétences réellement mobilisées."],["Observer une situation","Présenter son enseigne, son plan, son assortiment, ses prix et sa communication."],["Analyser avant de décider","Pour « finaliser le dossier mon enseigne 2027 », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Un dossier final doit raconter une démarche cohérente : cible, offre, implantation, approvisionnement, expérience client, indicateurs et améliorations. Il ne suffit pas d’assembler des images."],["Dossier de travail — données à exploiter","Dossier Mon Enseigne 2027 : concept, plan, assortiment, fournisseurs, accueil, stocks, prix, tableau de bord et bilan personnel."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["Le dossier final rassemble les productions de l’année et les décisions justifiées.","Il doit montrer l’évolution du projet, les corrections effectuées et les compétences réellement mobilisées.","Présenter son enseigne, son plan, son assortiment, ses prix et sa communication.","Un dossier final doit raconter une démarche cohérente : cible, offre, implantation, approvisionnement, expérience client, indicateurs et améliorations."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP3","intitule":"Conduite de la vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"},{"code":"MP6","intitule":"Animation commerciale"}],"capacites":[{"code":"C5.2","libelle":"Proposer des actions commerciales en vue de l’implantation d’un produit"},{"code":"C6.2","libelle":"Rendre compte d’observations susceptibles d’avoir une influence sur la politique commerciale"},{"code":"C9.2","libelle":"Organiser des animations autour des produits alimentaires"}]}},"activities":{"3":{"kind":"document","text":"Une épicerie de quartier de 95 m² propose 240 références. Le responsable veut simplifier le parcours d’achat. Aujourd’hui, les jus de fruits sont placés avec les produits frais, les eaux près de la caisse, les boissons végétales au rayon bio et les compotes au rayon biscuits. Plusieurs clients ne trouvent pas les produits recherchés. Les salariés signalent aussi des erreurs de réassort. Le magasin possède deux meubles réfrigérés, quatre gondoles centrales et une zone de produits frais à l’entrée. Le responsable demande un classement compréhensible, sans déplacer des produits dans un équipement inadapté. Il souhaite également repérer les articles qui se vendent ensemble.","questions":[["Quelle différence fais-tu entre famille et rayon ?","Une famille est une catégorie de produits ; un rayon est un espace physique de présentation."],["Propose trois familles pour ces produits.","Par exemple épicerie salée : riz et lentilles ; boissons : eau et jus ; produits frais : yaourt. La compote peut relever de l’épicerie sucrée."],["Le classement des boissons végétales peut-il varier ?","Oui. Plusieurs classements sont possibles si l’on explique la logique commerciale et la lisibilité pour le client."],["Quelles contraintes vérifier avant l’implantation ?","Conservation, circulation, mobilier, signalétique et attentes des clients."],["Quel problème principal les clients rencontrent-ils ?","La logique de classement est peu lisible ; les clients cherchent dans plusieurs zones."],["Distingue un rayon d’une famille de produits.","Le rayon est une zone physique ; la famille est une catégorie de produits."],["Classe eau, jus et boissons végétales selon deux logiques possibles.","Boissons par usage, ou boissons végétales avec alternatives végétales ; justifier la cohérence."],["Propose une sous-famille pour les jus.","Par fruit, format ou usage, selon la stratégie retenue."],["Quelles informations identifient une référence précise ?","Marque, désignation, contenance, variante et code article le cas échéant."],["Pourquoi les produits frais ne peuvent-ils pas être déplacés librement ?","Leurs exigences de conservation doivent être respectées."],["Propose un regroupement facilitant un achat complémentaire.","Pâtes et sauces, ou céréales et boissons associées, avec justification."],["Quelle conséquence un mauvais classement peut-il avoir sur le réassort ?","Erreurs de localisation, oublis, rupture apparente et temps perdu."],["Quelles deux observations permettraient de vérifier le nouveau plan ?","Questions des clients, temps de recherche, ventes ou retours des salariés."],["Une compote est-elle toujours classée en épicerie sucrée ?","Non ; le choix dépend du concept et du repérage client."],["Décris une règle de nommage des rayons.","Noms courts, compréhensibles, cohérents et visibles."],["Quel arbitrage faut-il faire si le meilleur emplacement commercial n’est pas adapté au froid ?","La sécurité sanitaire prime ; choisir une autre implantation."],["Rédige une recommandation en trois phrases pour le responsable.","Décrire le problème, proposer une solution, expliquer l’intérêt pour le client et l’équipe."]]},"4":{"kind":"simulation","text":"Lundi, 9 h 10. Une cliente entre dans une épicerie alors que deux salariés rangent une livraison. L’un poursuit sa conversation privée sans saluer. L’autre dit rapidement « c’est là-bas » sans écouter la demande. La cliente cherche une alternative à un produit contenant un allergène. L’étiquette de la première référence est partiellement effacée. Un troisième salarié intervient, reformule la demande et consulte la fiche produit avant de proposer une solution. Il précise qu’il doit vérifier certaines informations avec son responsable. La cliente remercie l’équipe, mais signale qu’elle s’est d’abord sentie ignorée.","questions":[["Quelle est ta première réponse ?","Je l’écoute, reformule sa demande et propose de vérifier les informations disponibles."],["Peux-tu dire « aucun risque » sans lire l’étiquette ?","Non. Une affirmation non vérifiée serait inappropriée."],["Où trouver une information fiable ?","Sur l’étiquette, la documentation du fabricant ou auprès du responsable compétent."],["Comment terminer l’échange ?","Présenter les informations vérifiées, expliquer les limites et laisser le client décider."],["Identifie deux comportements qui nuisent à l’accueil.","Absence de salutation et réponse expéditive sans écoute."],["Pourquoi la reformulation est-elle utile ?","Elle confirme que le besoin du client a été correctement compris."],["Quelle différence entre disponibilité et familiarité ?","Être attentif et respectueux sans imposer une proximité personnelle."],["Que faire si une étiquette allergène est illisible ?","Ne pas deviner ; vérifier une source fiable et solliciter le responsable."],["Rédige une salutation adaptée.","Bonjour Madame/Monsieur, je peux vous renseigner ?"],["Réécris « c’est là-bas » de manière professionnelle.","Je vais vous indiquer le rayon ; cherchez-vous un produit précis ?"],["Cite deux éléments de communication non verbale.","Posture ouverte, regard adapté, distance respectueuse, expression attentive."],["Pourquoi interrompre une conversation privée à l’arrivée d’un client ?","La disponibilité et l’accueil du client font partie des priorités de service."],["Comment réagir face à une demande à laquelle on ne sait pas répondre ?","Reconnaître la limite, vérifier et orienter vers la personne compétente."],["La posture professionnelle est-elle identique avec tous les clients ?","Les principes restent, mais le langage et le rythme s’adaptent aux besoins."],["Rédige une reformulation de la demande sur l’allergène.","Vous recherchez un produit sans [allergène] ; je vais vérifier les informations disponibles."],["Comment conclure après une réponse incomplète ?","Expliquer la vérification nécessaire et proposer un suivi ou une alternative."],["Donne un indicateur observable de qualité d’accueil.","Délai de prise en charge, reformulation, satisfaction ou réclamations."]]},"6":{"kind":"enquete","text":"Un vendredi après-midi, une bouteille se casse près d’un meuble de produits frais. Un salarié ramasse les morceaux à mains nues et repose sur l’étagère un emballage éclaboussé. Une autre personne utilise un spray de nettoyage à proximité de denrées non protégées. Le responsable constate aussi un carton de produits frais resté dans le passage pendant la livraison. Un client demande si le yaourt qu’il vient de prendre peut être consommé sans risque. Aucun contrôle n’a encore été réalisé. Le magasin dispose d’une procédure écrite de nettoyage, d’un registre de températures et d’une zone permettant d’isoler les produits douteux.","questions":[["Quels dangers repères-tu ?","Risque de chute, corps étrangers possibles, contamination des emballages et éventuellement des denrées."],["Quelle est la priorité immédiate ?","Sécuriser la zone et empêcher l’accès des clients, puis prévenir le responsable."],["Pourquoi un simple coup de chiffon ne suffit-il pas ?","Il faut appliquer une procédure adaptée et évaluer les produits potentiellement souillés."],["Que faire des produits dont la sécurité est incertaine ?","Les isoler et suivre la décision du responsable selon la procédure."],["Identifie un danger physique.","Éclats de verre provenant de la bouteille cassée."],["Identifie un danger chimique.","Projection ou mauvais usage du produit de nettoyage."],["Identifie un danger biologique possible.","Contamination ou mauvaise conservation des denrées sensibles."],["Pourquoi un emballage éclaboussé doit-il être vérifié ?","Son intégrité et la sécurité du contenu peuvent être compromises."],["Quelle est la première priorité près des éclats de verre ?","Sécuriser la zone et éviter l’exposition des clients et salariés."],["Pourquoi ne pas ramasser le verre à mains nues ?","Risque de coupure ; appliquer la procédure et utiliser les équipements adaptés."],["Différencie nettoyage et désinfection.","Nettoyage : enlever les salissures ; désinfection : réduire les micro-organismes selon protocole."],["Peut-on garantir au client l’absence de risque sans contrôle ?","Non ; il faut vérifier et demander au responsable."],["Quel risque pose un carton frais laissé longtemps hors du froid ?","Une rupture potentielle des conditions de conservation."],["Quel document permet de vérifier la conservation ?","Registre ou relevé des températures, selon la procédure."],["Que faire des produits potentiellement contaminés ?","Les isoler, les identifier et appliquer la procédure de décision."],["Pourquoi ne faut-il pas mélanger les produits de nettoyage ?","Réactions chimiques dangereuses possibles et non-respect des consignes."],["Décris les étapes d’un signalement professionnel.","Constater, sécuriser, isoler si nécessaire, informer et tracer l’anomalie."]]},"7":{"kind":"defi","text":"Un magasin rectangulaire mesure 12 m sur 8 m. L’entrée est sur la façade sud. Le plan initial prévoit une caisse au centre du passage, une gondole très proche de l’entrée, un congélateur dessiné à côté d’une issue de secours et un rayon boissons tout au fond. Le responsable souhaite que les clients circulent facilement, que les zones de stockage soient distinctes de la vente et que les équipements adaptés soient accessibles pour l’entretien. Les élèves doivent proposer un schéma annoté avant de le modéliser ultérieurement sur SketchUp.","questions":[["Identifie deux problèmes de circulation.","La caisse gêne la sortie et les cartons encombrent l’allée."],["Quel problème technique concerne les surgelés ?","Ils nécessitent un équipement de conservation approprié."],["Quelle amélioration proposer pour orienter les clients ?","Installer une signalétique claire et cohérente."],["Comment justifier un nouveau plan ?","Par la sécurité, l’accessibilité, le parcours client et les contraintes des produits."],["Quelle est la surface totale du magasin ?","12 × 8 = 96 m²."],["Pourquoi une caisse au centre du passage pose-t-elle problème ?","Elle gêne la circulation et peut créer des files ou obstacles."],["Quel risque présente une gondole trop proche de l’entrée ?","Engorgement et difficulté d’accès."],["Peut-on encombrer une issue de secours ?","Non, les dégagements doivent rester libres."],["Quels éléments doivent figurer sur le plan ?","Entrée, sortie, caisse, rayons, équipements, circulation, légende."],["Pourquoi prévoir une légende ?","Pour rendre les symboles et zones compréhensibles."],["Quelle différence entre plan à l’échelle et croquis ?","Le plan à l’échelle respecte des proportions mesurées ; le croquis est indicatif."],["Comment matérialiser le sens de circulation ?","Avec des flèches claires et une implantation lisible."],["Pourquoi isoler les réserves de la zone client ?","Pour sécuriser le travail et organiser les flux."],["Quelle contrainte concerne les équipements froids ?","Alimentation, accessibilité, entretien et conditions de conservation."],["Propose une amélioration de l’implantation de la caisse.","Près de la sortie, sans obstruer les cheminements."],["Comment tester la qualité d’un plan ?","Simuler le trajet client, le réassort et les situations d’affluence."],["Quelles décisions faudra-t-il justifier à l’oral ?","Emplacements, circulation, sécurité, visibilité et cohérence commerciale."]]},"8":{"kind":"quiz","text":"QUIZ — Réponds aux questions, puis lis les explications.","questions":[]},"10":{"kind":"document","text":"NOTE INTERNE — 14 janvier 2027. Le fournisseur signale un retrait préventif de la soupe de légumes « Jardin Bleu » en bouteille de 1 L. Seul le lot JB2714 est concerné, à la suite d’un risque de corps étranger. Le magasin a reçu 30 unités de ce lot le 9 janvier ; 12 ont déjà été vendues, 18 sont encore en stock. Le responsable demande le blocage immédiat des 18 unités, la conservation des preuves de livraison, le contrôle des autres emplacements et l’application des consignes officielles d’information des consommateurs. Une autre livraison de 20 bouteilles du lot JB2715 n’est pas visée par l’alerte. Le personnel doit consigner les actions et ne pas inventer de consignes supplémentaires.","questions":[["Quelle information permet de cibler les unités concernées ?","Le numéro de lot JB2714, associé au produit et à ses caractéristiques."],["Que doit faire le magasin avec ses 18 unités ?","Les isoler immédiatement de la vente et appliquer la procédure de retrait."],["Pourquoi faut-il conserver les documents de réception ?","Ils aident à identifier l’origine et les mouvements des lots."],["Quelle information donner au client ?","La consigne officielle du rappel et les modalités prévues, sans minimiser le risque."],["Quel produit est concerné par le retrait ?","Soupe Jardin Bleu 1 L, lot JB2714."],["Quel est le motif signalé ?","Risque de présence d’un corps étranger."],["Combien d’unités sont encore en stock ?","18 unités."],["Combien d’unités ont déjà été vendues ?","12 unités."],["Pourquoi le numéro de lot est-il déterminant ?","Il permet de cibler les unités concernées."],["Le lot JB2715 est-il automatiquement concerné ?","Non, pas selon cet avis ; vérifier les informations officielles."],["Quelle action immédiate sur les 18 unités ?","Blocage et isolement de la vente selon procédure."],["Pourquoi conserver le bon de livraison ?","Il permet de retracer les quantités et l’origine des produits."],["Que faire si des unités sont aussi dans un autre rayon ?","Contrôler tous les emplacements et les isoler si concernées."],["Comment informer les clients ?","Selon les consignes officielles de rappel/retrait et du magasin."],["Pourquoi enregistrer la date et le responsable de l’action ?","Pour assurer une traçabilité des mesures prises."],["Différencie retrait et rappel.","Retrait : empêcher la commercialisation ; rappel : informer les consommateurs pour les produits déjà vendus."],["Rédige une note courte au responsable.","Produit/lot, quantités, actions de blocage, vérifications et informations à suivre."]]},"11":{"kind":"document","text":"DOSSIER PROFESSIONNEL — APPLIQUER FIFO ET FEFO EN RAYON\n\nNotion : FIFO : premier entré, premier sorti. FEFO : première date d’expiration, première sortie.\n\nProcédure / analyse : Un arrivage récent ne doit pas masquer les lots plus anciens. Contrôler les dates et l’état avant toute rotation.\n\nSITUATION : Un rayon contient trois lots datés du 12, du 18 et du 25 : commencer par vérifier le lot du 12.\n\nTu es employé dans une épicerie de quartier. Ton responsable te demande de traiter ce problème, de justifier tes décisions et de préparer une recommandation pour ton équipe.","questions":[["Quel problème professionnel est au cœur de cette séance ?","Le thème « appliquer fifo et fefo en rayon » nécessite de comprendre la notion, puis de prendre une décision justifiée."],["Quelle définition faut-il retenir ?","FIFO : premier entré, premier sorti. FEFO : première date d’expiration, première sortie."],["Quelle méthode faut-il appliquer ?","Un arrivage récent ne doit pas masquer les lots plus anciens. Contrôler les dates et l’état avant toute rotation."],["Que se passe-t-il dans la situation proposée ?","Un rayon contient trois lots datés du 12, du 18 et du 25 : commencer par vérifier le lot du 12."],["Quelles informations faut-il vérifier avant d’agir ?","Identifier les données fiables, les procédures internes et les contraintes réglementaires ou matérielles pertinentes."],["Quels sont les risques d’une décision prise trop vite ?","Erreur de conseil, rupture, insatisfaction, pertes ou non-conformité selon la situation."],["Quels acteurs peuvent être concernés ?","Client, vendeur, responsable de rayon, fournisseur et équipe s r et à qui signaler une anomalie."]]}},"quiz":[["Que signifie DLC ?",["Date limite de consommation","Durée libre de conservation","Date de livraison commerciale","Délai légal de commande"],0,"La DLC correspond à « à consommer jusqu’au »."],["Une DLC dépassée permet-elle la vente ?",["Oui, systématiquement","Non","Oui après une réduction","Oui si le rayon est froid"],1,"Un produit ayant dépassé sa DLC ne doit pas être commercialisé."],["Que signifie DDM ?",["Date de durabilité minimale","Date de distribution maximale","Durée de déstockage mensuelle","Date de destruction obligatoire"],0,"La DDM correspond à « à consommer de préférence avant »."],["Une DDM dépassée entraîne-t-elle automatiquement l’interdiction de vente ?",["Oui","Non, sous réserve de vérifications","Seulement le lundi","Seulement en promotion"],1,"La DDM concerne principalement la conservation des qualités attendues."],["Que faut-il aussi vérifier ?",["L’emballage et la conservation","La couleur du chariot","Le nom du caissier","Le prix du parking"],0,"Les conditions de stockage et l’intégrité du produit comptent."],["Quelle formule indique une DLC ?",["À consommer jusqu’au","À consommer de préférence avant","Offre valable jusqu’au","Produit en rayon depuis"],0,"La formulation « à consommer jusqu’au » signale une DLC."],["Quelle formule indique une DDM ?",["À consommer de préférence avant","À consommer jusqu’au","À livrer avant","À déstocker le"],0,"La formulation « à consommer de préférence avant » signale une DDM."],["Que faire en cas de doute ?",["Vérifier et demander au responsable","Effacer la date","Vendre rapidement","Cacher le produit derrière"],0,"La vérification prévaut sur l’improvisation."],["Un yaourt avec DLC dépassée doit-il être remis en vente ?",["Non","Oui si l’emballage est joli","Oui à moitié prix","Oui si le client insiste"],0,"Une DLC dépassée interdit la commercialisation."],["Une boîte de biscuits avec DDM dépassée est-elle nécessairement impropre ?",["Non, pas automatiquement"
