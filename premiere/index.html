ion de rayon","Durée":"2 h","Format dominant":"Atelier Mon Enseigne 2027 (Canva / SketchUp / dossier)","Déroulé":"Cours guidé + atelier créatif + restitution"},{"Séance":"55","Thème":"Finaliser le dossier Mon Enseigne 2027","Durée":"1 h","Format dominant":"Étude de cas","Déroulé":"20 min cours + 25 min activité + 15 min correction"}],"content":{"2":{"mp":"MP1","objective":"Construire un concept de commerce alimentaire cohérent, réaliste et différenciant. À la fin, tu disposes d’une fiche concept, d’une clientèle cible, d’une proposition de valeur et d’une première maquette.","parts":[["Qu’est-ce qu’un concept commercial ?","Un concept commercial est l’idée directrice d’un magasin : ce qu’il vend, à qui, comment et pourquoi les clients le choisissent. Un magasin ne se résume pas à un nom et un logo. Il doit résoudre un besoin précis. Exemple : une épicerie de quartier qui propose des produits locaux en petites quantités à des actifs pressés. Son offre, ses horaires et ses prix doivent être cohérents avec cette promesse."],["La cible et ses besoins","Une clientèle cible est le groupe de personnes que le magasin veut servir en priorité. Décris des critères observables : âge, habitudes, budget, horaires, mobilité, contraintes alimentaires. Distingue un besoin (acheter un repas rapide) d’une préférence (préférer des produits bio). Un concept « pour tout le monde » est rarement assez précis pour guider les choix."],["L’offre et la proposition de valeur","L’offre réunit les familles de produits, les services et l’expérience d’achat. La proposition de valeur répond à la question : « Pourquoi venir chez moi plutôt qu’ailleurs ? » Elle peut reposer sur la proximité, la spécialisation, le prix, le conseil, la rapidité ou la qualité. Évite les promesses impossibles à tenir, comme « le moins cher et le plus haut de gamme » sans explication."],["La cohérence commerciale","Vérifie l’accord entre la cible, l’assortiment, le prix, le lieu, la communication et l’ambiance. Exemple : un magasin visant des étudiants avec un petit budget devrait proposer des portions accessibles, des produits faciles à préparer et une signalétique simple. Une décoration luxueuse et des prix très élevés seraient contradictoires."],["Comment présenter et justifier son concept","Une bonne présentation contient : nom provisoire, type de magasin, client prioritaire, trois besoins identifiés, cinq familles de produits, deux services, deux concurrents possibles et trois arguments de différenciation. Chaque choix doit être justifié par un besoin du client et non par « parce que j’aime bien »."]],"activity":"Réalise la mission guidée « Mon Enseigne 2027 » : suis chaque étape, conserve tes preuves et justifie tes choix.","kind":"atelier","essentiel":["Concept = cible + offre + promesse + expérience d’achat.","Une clientèle cible se décrit avec des critères précis.","Chaque choix commercial doit répondre à un besoin identifié.","La différenciation explique pourquoi un client choisit ton enseigne."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"}],"capacites":[{"code":"C5.1","libelle":"Situer le produit sur le marché"},{"code":"C5.2","libelle":"Proposer des actions commerciales en vue de l’implantation d’un produit"}]},"3":{"mp":"MP2 · MP4","objective":"Classer des produits alimentaires de façon logique pour aider le client et gérer le rayon.","parts":[["Famille, sous-famille, référence : trois niveaux distincts","Une famille regroupe des produits ayant une fonction ou une nature commune : boissons, produits laitiers, épicerie salée. Une sous-famille précise le groupe : eaux plates dans les boissons. Une référence est un article précis identifiable par sa marque, son format et éventuellement son code-barres : eau plate 1,5 L marque X. Une même référence n’est pas une famille."],["Construire une arborescence de rayon","La logique est : magasin → univers → rayon → famille → sous-famille → référence. Exemple : alimentation → épicerie → petit-déjeuner → céréales → mueslis → muesli 500 g. Cette classification facilite le rangement, la commande, l’inventaire et la recherche par le client. Certains magasins regroupent autrement les produits : la logique doit rester lisible."],["Les critères de classement","On peut classer par usage, température de conservation, composition, format ou type de client. Les produits surgelés nécessitent un équipement adapté ; les produits allergènes demandent une information fiable. Deux articles semblables par la marque peuvent relever de familles différentes selon leur fonction."],["L’assortiment et la lisibilité","L’assortiment est l’ensemble des produits proposés à la vente. Un assortiment large couvre de nombreuses familles ; un assortiment profond offre plusieurs références au sein d’une famille. Trop de références proches peuvent compliquer le choix et immobiliser du stock. Trop peu peuvent entraîner des ventes perdues."],["Application professionnelle","Tu dois pouvoir classer 12 articles, justifier deux cas ambigus et dessiner une mini-arborescence pour ton enseigne. Vérifie que les intitulés sont compréhensibles par le client et utilisables par le responsable de rayon."]],"activity":"20 min de lecture guidée du cours et du dossier, 25 min de réponses argumentées aux 17 questions, puis 15 min de correction et synthèse. Étude de document : classer douze produits en familles et sous-familles, puis expliquer deux classements discutables.","kind":"document","essentiel":["Une famille rassemble des articles proches par nature ou usage.","Un rayon est un espace physique de présentation.","Pour décider : observer les faits, vérifier les informations, expliquer son choix."],"referentiel":[{"code":"MP2","intitule":"Expertise conseil en produits alimentaires"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C5.1","libelle":"Situer le produit sur le marché"},{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"4":{"mp":"MP3","objective":"Adopter des comportements professionnels adaptés à différents clients et situations.","parts":[["La posture professionnelle","La posture associe la tenue adaptée, la ponctualité, l’attention, le langage et le respect des consignes. Elle ne signifie pas être rigide : un vendeur peut être chaleureux tout en restant précis et respectueux. La première impression commence avant la prise de parole."],["Communication verbale et non verbale","Le verbal concerne les mots, les questions et les reformulations ; le non-verbal comprend la distance, le regard, les gestes et l’orientation du corps. Une voix audible et calme aide à rassurer. Évite de juger un client sur son apparence, de tutoyer sans raison ou de consulter ton téléphone en l’accueillant."],["Écouter et reformuler","Pose une question ouverte (« Pour quel usage ? »), laisse répondre, puis reformule (« Vous cherchez donc un repas rapide sans cuisson ? »). Cette méthode limite les erreurs de conseil. Une question fermée permet ensuite de confirmer un point précis."],["Situations difficiles","Si un client est mécontent, garde un ton neutre, écoute les faits, reformule et cherche une solution dans le cadre des procédures. N’invente pas de règle de remboursement. Si la situation dépasse tes responsabilités, fais appel au responsable."],["L’auto-évaluation","Après un échange, évalue : salutations, posture, questions, écoute, clarté, proposition, conclusion. Une remarque constructive doit décrire un comportement observable et proposer une amélioration."]],"activity":"20 min de lecture guidée du cours et du dossier, 25 min de réponses argumentées aux 17 questions, puis 15 min de correction et synthèse. Simulation : choisir les meilleures répliques face à un client pressé, indécis ou préoccupé par un allergène.","kind":"simulation","essentiel":["La posture professionnelle associe ponctualité, présentation adaptée, disponibilité, politesse, écoute et respect des procédures.","Accueillir, laisser parler, poser une question ouverte, reformuler puis proposer une solution : cette progression permet de limiter les malentendus et les conseils inadaptés..","Pour décider : observer les faits, vérifier les informations, expliquer son choix."],"referentiel":[{"code":"MP3","intitule":"Conduite de la vente"}],"capacites":[{"code":"C7.2","libelle":"Réaliser une vente"}]},"5":{"mp":"MP1 · MP4","objective":"Dessiner un espace de vente compréhensible, accessible et cohérent avec la cible.","parts":[["Les zones d’un magasin","L’espace de vente comprend l’entrée, les allées, les rayons, les zones de services et les caisses. Le parcours doit être lisible, accessible et sûr. Les espaces de stockage, réserves et zones techniques sont distincts de l’espace accessible au public."],["Zones chaudes et froides","Une zone chaude est naturellement plus fréquentée ; une zone froide reçoit moins de passage. Ce sont des observations à vérifier dans chaque magasin, pas une règle universelle. On peut améliorer la visibilité d’une zone froide par la signalétique, une offre attractive et un parcours logique, sans gêner la circulation."],["Circulation et sécurité","Un plan commercial doit permettre le passage des clients, y compris des personnes à mobilité réduite, selon les règles applicables. Les allées doivent rester dégagées ; les issues de secours ne doivent jamais être obstruées. Les produits lourds et les équipements nécessitent une implantation adaptée."],["Implantation par logique d’achat","Regroupe les produits qui se complètent lorsque cela aide les clients : pâtes et sauces, café et filtres. Sépare les familles nécessitant des températures différentes. Place les produits d’achat fréquent dans des zones facilement repérables et prévois une signalétique claire."],["Justifier un plan","Un plan se juge sur quatre critères : compréhension du parcours, accessibilité, cohérence des familles et faisabilité. Chaque zone doit avoir une fonction identifiée. La beauté du dessin ne suffit pas : il faut pouvoir expliquer les choix."]],"activity":"Réalise la mission guidée « Mon Enseigne 2027 » : suis chaque étape, conserve tes preuves et justifie tes choix.","kind":"atelier","essentiel":["L’espace de vente comprend notamment l’entrée, les zones de circulation, les rayons, la caisse et parfois des zones de service.","L’aménagement cherche à rendre les produits visibles, à faciliter les déplacements et à éviter les obstacles.","Les produits frais ou surgelés doivent être présentés dans des équipements appropriés."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"6":{"mp":"MP5","objective":"Repérer les dangers, prévenir les contaminations et agir correctement en cas d’anomalie.","parts":[["Les dangers alimentaires","On distingue les dangers biologiques (microorganismes), chimiques (produits d’entretien, résidus) et physiques (morceaux de verre, plastique). Les allergènes demandent aussi une maîtrise rigoureuse de l’information et des contaminations croisées. Un produit peut paraître normal tout en étant dangereux."],["Contamination et contamination croisée","Une contamination croisée survient quand un danger passe d’un produit, d’un ustensile ou d’une surface à un autre aliment. Exemple : utiliser la même planche pour une viande crue et un produit prêt à consommer sans nettoyage adapté. L’hygiène des mains et la séparation des activités sont essentielles."],["Nettoyer et désinfecter","Nettoyer élimine les salissures ; désinfecter réduit les microorganismes selon le produit et son protocole. Les deux actions ne sont pas synonymes. Respecte les dosages, temps de contact, rinçages éventuels et équipements de protection indiqués par les procédures."],["Température, stockage et rotation","Respecte les températures figurant sur les étiquettes et les procédures de l’établissement ; ne généralise pas une température unique à tous les aliments. Range les produits pour éviter les contaminations et applique la rotation appropriée. En cas de doute sur une rupture de froid, isole le produit et préviens le responsable."],["Réagir à une anomalie","Face à une denrée endommagée, un emballage ouvert ou une étiquette manquante : ne la remets pas en vente, identifie-la, signale l’anomalie et applique la procédure. La traçabilité permet ensuite de retrouver les lots concernés."]],"activity":"20 min de lecture guidée du cours et du dossier, 25 min de réponses argumentées aux 17 questions, puis 15 min de correction et synthèse. Enquête : analyser un incident dans un rayon alimentaire et identifier les dangers, mesures immédiates et actions préventives.","kind":"enquete","essentiel":["Les dangers biologiques sont liés notamment aux micro-organismes ; les dangers chimiques à des substances indésirables ; les dangers physiques à des corps étrangers.","Un danger peut passer d’une surface, d’un matériel ou d’un produit à un autre.","Pour décider : observer les faits, vérifier les informations, expliquer son choix."],"referentiel":[{"code":"MP5","intitule":"Qualité des produits alimentaires et hygiène"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"7":{"mp":"MP1 · MP4","objective":"Lire, mesurer et produire un plan de magasin compréhensible.","parts":[["À quoi sert un plan de magasin ?","Un plan représente les espaces et leurs relations : entrée, caisse, rayons, réserve, accès et circulation. Il sert à organiser le parcours client, préparer l’implantation et communiquer avec l’équipe. Un croquis libre peut aider au départ, mais un plan doit rester lisible."],["Légende, orientation et échelle","Une légende explique les symboles et couleurs ; une orientation permet de comprendre le sens du dessin. L’échelle exprime le rapport entre une longueur sur le plan et la réalité. Exemple : au 1:100, 1 cm sur le plan représente 100 cm, soit 1 m en réalité."],["Calculer une dimension simple","Pour un local rectangulaire de 12 m sur 8 m, la surface brute est 12 × 8 = 96 m². Cette surface n’est pas entièrement vendable : il faut prévoir les réserves, caisses, circulations et contraintes du bâtiment. À l’échelle 1:100, le rectangle mesure 12 cm × 8 cm sur papier."],["Dessiner un parcours cohérent","Place d’abord les accès et contraintes fixes, puis les allées principales, les rayons et la caisse. Trace ensuite le parcours d’un client qui cherche trois produits différents. Si le trajet crée un blocage ou un détour inutile, améliore le plan."],["Contrôler son dessin","Vérifie la présence d’un titre, d’une légende, de l’échelle, des zones principales et d’une justification de l’implantation. Les exigences réglementaires d’accessibilité et de sécurité doivent être contrôlées dans un projet réel."]],"activity":"20 min de lecture guidée du cours et du dossier, 25 min de réponses argumentées aux 17 questions, puis 15 min de correction et synthèse. Défi : repérer cinq erreurs sur un plan fictif puis proposer une implantation corrigée.","kind":"defi","essentiel":["Un plan simplifié représente l’entrée, les circulations, les meubles, la caisse, les sorties et les zones techniques.","Les déplacements doivent rester fluides et adaptés à tous les clients.","Pour décider : observer les faits, vérifier les informations, expliquer son choix."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"8":{"mp":"MP5","objective":"Distinguer DLC et DDM et décider de l’action adaptée en rayon.","parts":[["Pourquoi les dates existent-elles ?","Les dates indiquées sur les denrées guident leur conservation et leur commercialisation. Elles n’ont pas toutes le même sens. Il faut lire le libellé complet, pas seulement le jour et le mois."],["DLC : une limite de sécurité","La date limite de consommation (DLC) est indiquée par « À consommer jusqu’au… ». Elle concerne les denrées très périssables présentant un risque sanitaire après cette date. Un produit dont la DLC est dépassée ne doit pas être vendu ni consommé."],["DDM : une garantie de qualité","La date de durabilité minimale (DDM) est indiquée par « À consommer de préférence avant… ». Une DDM dépassée n’implique pas automatiquement un danger ; le produit peut toutefois avoir perdu certaines qualités. Son état, son emballage, ses conditions de conservation et les procédures du magasin doivent être vérifiés."],["Stockage et dates après ouverture","La date imprimée sur un produit fermé ne suffit plus toujours après ouverture. Il faut appliquer les instructions de conservation et la durée après ouverture éventuelle. Une chaîne du froid interrompue peut rendre un produit impropre avant sa date."],["Contrôle de rayon","Lors d’un contrôle, relève le produit, le lot, la date, l’état de l’emballage et l’action décidée. Place les produits à échéance proche devant selon les règles de rotation ; signale les produits non conformes au responsable."]],"activity":"Quiz et mini-cas : distinguer six étiquettes et décider des retraits ou vérifications.","kind":"quiz","essentiel":["DLC : une fois dépassée, le produit concerné ne doit pas être commercialisé.","DDM : le dépassement ne signifie pas automatiquement que le produit est dangereux.","Toujours contrôler les conditions de conservation, l’emballage et les consignes applicables."],"referentiel":[{"code":"MP5","intitule":"Qualité des produits alimentaires et hygiène"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"9":{"mp":"MP5","objective":"Sécuriser le parcours d’un produit sensible au froid, de la réception à la vente.","parts":[["Définition de la chaîne du froid","La chaîne du froid est le maintien des conditions de température nécessaires à la conservation d’une denrée depuis sa production jusqu’à la vente. Elle dépend du produit et de ses consignes : une température adaptée aux surgelés n’est pas celle de tous les produits réfrigérés."],["Les moments sensibles","Réception, déchargement, stockage, préparation de commande, réassort et attente avant mise en rayon sont des étapes à risque. Il faut réduire le temps hors des équipements adaptés et respecter les procédures du magasin."],["Contrôles à effectuer","Contrôle la température selon le matériel et la procédure, l’état des emballages, les dates et les enregistrements nécessaires. Une mesure isolée ne suffit pas toujours : observe aussi les conditions de transport et les éventuels signes de décongélation."],["Que faire en cas de doute ?","Isole les denrées suspectes, empêche leur mise en vente, note les faits (produit, lot, heure, mesure, circonstances) et préviens le responsable. Ne décide pas seul qu’un produit est sûr sur la base de son apparence."],["Concevoir la zone froide de son enseigne","Prévois les meubles adaptés, l’emplacement du stockage, le trajet entre réception et mise en rayon, les points de contrôle et la procédure en cas de panne. Justifie comment ton organisation réduit le risque."]],"activity":"Réalise la mission guidée « Mon Enseigne 2027 » : suis chaque étape, conserve tes preuves et justifie tes choix.","kind":"atelier","essentiel":["Le froid ralentit la multiplication de nombreux micro-organismes sans rendre tous les aliments stériles.","Réception, transport interne, mise en rayon et stockage sont des étapes sensibles.","Le professionnel mesure avec un équipement adapté, consigne les résultats selon la procédure et signale les écarts."],"referentiel":[{"code":"MP5","intitule":"Qualité des produits alimentaires et hygiène"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"10":{"mp":"MP5","objective":"Identifier un lot, retrouver son parcours et participer à un retrait ou rappel.","parts":[["Qu’est-ce que la traçabilité ?","La traçabilité permet de retrouver l’origine, les mouvements et la destination d’un produit ou d’un lot. Elle sert notamment à identifier rapidement les produits concernés par une non-conformité ou un rappel."],["Les informations utiles","Selon les produits et les procédures, on relève la désignation, le fournisseur, le numéro de lot, les dates, les quantités, la réception et les mouvements. Le code-barres d’un article n’est pas nécessairement un identifiant de lot."],["Du fournisseur au rayon","À la réception, on rapproche le bon de livraison des marchandises. On conserve les informations permettant d’identifier les lots et leur emplacement. Une erreur de saisie peut compliquer un retrait ultérieur."],["Retrait et rappel : ne pas confondre","Un retrait vise à empêcher la commercialisation de produits non conformes ; un rappel vise également les consommateurs lorsque des produits ont déjà été vendus. Les consignes officielles et les procédures internes déterminent les actions à entreprendre."],["Simulation de rappel","Si un avis concerne le lot L204 de biscuits, recherche les références et quantités reçues, localise le stock restant, isole les unités concernées et informe le responsable. Ne retire pas au hasard tous les produits de la marque si seuls certains lots sont visés."]],"activity":"20 min de lecture guidée du cours et du dossier, 25 min de réponses argumentées aux 17 questions, puis 15 min de correction et synthèse. Étude de texte : lire un avis fictif de rappel et identifier lot, produit, risque, conduite à tenir.","kind":"document","essentiel":["La traçabilité permet de retrouver l’origine et le parcours d’une denrée à partir d’informations documentées : fournisseur, lot, dates et mouvements..","Étiquettes, bons de livraison, registres et systèmes informatiques aident à identifier les produits concernés par une anomalie..","Pour décider : observer les faits, vérifier les informations, expliquer son choix."],"referentiel":[{"code":"MP5","intitule":"Qualité des produits alimentaires et hygiène"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"11":{"mp":"MP4 · MP5","objective":"Comprendre et appliquer : appliquer fifo et fefo en rayon. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","FIFO : premier entré, premier sorti. FEFO : première date d’expiration, première sortie."],["Méthode professionnelle","Un arrivage récent ne doit pas masquer les lots plus anciens. Contrôler les dates et l’état avant toute rotation."],["Observer une situation","Un rayon contient trois lots datés du 12, du 18 et du 25 : commencer par vérifier le lot du 12."],["Analyser avant de décider","Pour « appliquer fifo et fefo en rayon », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","La rotation ne dépend pas seulement de la date de réception. FIFO privilégie l’ordre d’entrée, FEFO la date limite la plus proche. Vérifier l’état, la DLC et les règles de conservation avant de déplacer un lot."],["Dossier de travail — données à exploiter","Yaourts : lot A reçu lundi, DLC 18/11, 12 unités ; lot B reçu mardi, DLC 14/11, 18 unités ; lot C reçu mercredi, DLC 21/11, 10 unités."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["FIFO : premier entré, premier sorti.","Un arrivage récent ne doit pas masquer les lots plus anciens.","Un rayon contient trois lots datés du 12, du 18 et du 25 : commencer par vérifier le lot du 12.","La rotation ne dépend pas seulement de la date de réception."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"},{"code":"MP5","intitule":"Qualité des produits alimentaires et hygiène"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"12":{"mp":"MP1 · MP3","objective":"Comprendre et appliquer : comprendre le parcours client. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Le parcours client comprend préparation de l’achat, entrée, orientation, recherche, comparaison, choix et passage en caisse."],["Méthode professionnelle","Un parcours fluide dépend de la signalétique, de la disponibilité des produits, de l’accessibilité et de la qualité de l’accueil."],["Observer une situation","Une cliente ne trouve pas le rayon des produits sans gluten : repérer les points de friction."],["Analyser avant de décider","Pour « comprendre le parcours client », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Un parcours client commence avant le choix du produit : entrée, orientation, recherche, comparaison, décision, caisse et sortie. À chaque étape, réduire l’effort du client sans entraver l’accessibilité."],["Dossier de travail — données à exploiter","Magasin de 96 m² : entrée au sud, caisse à l’est, pain au nord, produits frais à l’ouest. Trois clients : pressé, parent avec poussette, personne cherchant un produit sans allergène."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Le parcours client comprend préparation de l’achat, entrée, orientation, recherche, comparaison, choix et passage en caisse.","Un parcours fluide dépend de la signalétique, de la disponibilité des produits, de l’accessibilité et de la qualité de l’accueil.","Une cliente ne trouve pas le rayon des produits sans gluten : repérer les points de friction.","Un parcours client commence avant le choix du produit : entrée, orientation, recherche, comparaison, décision, caisse et sortie."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP3","intitule":"Conduite de la vente"}],"capacites":[{"code":"C7.1","libelle":"Conseiller un client"}]},"13":{"mp":"MP3","objective":"Comprendre et appliquer : pratiquer l'accueil professionnel. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","L’accueil professionnel associe salutation, disponibilité, écoute et adaptation au client."],["Méthode professionnelle","Éviter les suppositions ; reformuler la demande et laisser au client le temps de préciser son besoin."],["Observer une situation","Un client pressé demande où trouver une référence précise."],["Analyser avant de décider","Pour « pratiquer l'accueil professionnel », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","L’accueil se construit en quatre temps : saluer, se rendre disponible, découvrir le besoin et orienter. Les questions ouvertes font parler ; les questions fermées confirment. Une reformulation évite les conseils hors sujet."],["Dossier de travail — données à exploiter","Une cliente arrive avec un budget de 12 € pour un repas végétarien de quatre personnes. Elle est pressée et ne connaît pas les rayons."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["L’accueil professionnel associe salutation, disponibilité, écoute et adaptation au client.","Éviter les suppositions ; reformuler la demande et laisser au client le temps de préciser son besoin.","Un client pressé demande où trouver une référence précise.","L’accueil se construit en quatre temps : saluer, se rendre disponible, découvrir le besoin et orienter."],"referentiel":[{"code":"MP3","intitule":"Conduite de la vente"}],"capacites":[{"code":"C7.2","libelle":"Réaliser une vente"}]},"14":{"mp":"MP4","objective":"Comprendre et appliquer : découvrir le facing et le réassort. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Le facing désigne la présentation visible des produits en façade ; le réassort consiste à remettre des articles en rayon."],["Méthode professionnelle","Avant le réassort, vérifier dates, état, prix affiché, sécurité du mobilier et logique de rotation."],["Observer une situation","Une étagère paraît pleine en façade mais ne contient plus de réserve derrière."],["Analyser avant de décider","Pour « découvrir le facing et le réassort », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Le facing désigne le nombre de produits visibles de face. Le réassort reconstitue la disponibilité en rayon après vérification du stock, des dates et de l’état. Une belle présentation ne compense pas un prix absent."],["Dossier de travail — données à exploiter","Étagère de 120 cm ; quatre produits de largeurs 10, 15, 12 et 20 cm. Un produit est en rupture et une étiquette affiche le mauvais prix."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essenti er de travail — données à exploiter","Pâtes 500 g à 1,80 € ; riz 1 kg à 3,20 € ; café 250 g à 4,75 €. Une affiche mentionne « 20 % de réduction » sur le café."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Le prix affiché doit être lisible et correspondre au produit proposé.","Distinguer prix unitaire, prix au kilogramme ou au litre, prix promotionnel et prix réellement appliqué en caisse.","Une étiquette de 250 g affiche 2,50 € : le prix au kilo est de 10 €.","Une étiquette en rayon doit permettre d’identifier clairement le produit et son prix."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"},{"code":"MP6","intitule":"Animation commerciale"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"},{"code":"C9.1","libelle":"Installer des espaces de vente promotionnels"}]},"17":{"mp":"MP2 · MP3","objective":"Comprendre et appliquer : conseiller un client selon ses besoins. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Le conseil client commence par la découverte des besoins, pas par la présentation du produit le plus cher."],["Méthode professionnelle","Une recommandation crédible s’appuie sur les usages, le budget, les contraintes alimentaires et les informations vérifiées."],["Observer une situation","Un client cherche un repas rapide pour quatre personnes avec un budget limité."],["Analyser avant de décider","Pour « conseiller un client selon ses besoins », commencer par identifier les i nées à exploiter","Épicerie de 40 m², clientèle d’étudiants, budget d’achat fictif 900 €. Familles : boissons, pâtes, fruits, snacking, hygiène."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Un assortiment cohérent équilibre largeur des familles et profondeur des références.","Le choix dépend du positionnement, de la clientèle, de la surface, de la saison et de la rentabilité attendue.","Une petite épicerie souhaite ajouter vingt références sans agrandir sa surface.","La largeur correspond au nombre de familles ; la profondeur au nombre de références par famille."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C5.1","libelle":"Situer le produit sur le marché"},{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"20":{"mp":"MP1","objective":"Comprendre et appliquer : définir sa clientèle et sa zone de chalandise. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","La zone de chalandise correspond à l’aire géographique d’où proviennent les clients potentiels d’un point de vente."],["Méthode professionnelle","L’accessibilité, les habitudes de déplacement, la concurrence et la densité de population influencent cette zone."],["Observer une situation","Une épicerie proche d’un lycée veut attirer les élèves et les habitants du quartier."],["Analyser avant de décider","Pour « définir sa clientèle et sa zone de chalandise », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Une zone de chalandise est l’espace d’où proviennent les clients potentiels. On la caractérise par temps d’accès, déplacements, concurrence et habitudes, pas seulement par un cercle tracé sur une carte."],["Dossier de travail — données à exploiter","Commerce près d’un lycée et d’un arrêt de bus ; trois profils : élèves, riverains, salariés. Deux concurrents à 8 et 15 minutes à pied."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["La zone de chalandise correspond à l’aire géographique d’où proviennent les clients potentiels d’un point de vente.","L’accessibilité, les habitudes de déplacement, la concurrence et la densité de population influencent cette zone.","Une épicerie proche d’un lycée veut attirer les élèves et les habitants du quartier.","Une zone de chalandise est l’espace d’où proviennent les clients potentiels."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"}],"capacites":[{"code":"C5.1","libelle":"Situer le produit sur le marché"}]},"21":{"mp":"MP1","objective":"Comprendre et appliquer : comparer les enseignes concurrentes. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Comparer des concurrents nécessite des critères communs : offre, prix, services, emplacement, horaires et image."],["Méthode professionnelle","Éviter les jugements vagues ; observer des données vérifiables et distinguer faits et opinions."],["Observer une situation","Deux magasins voisins vendent des produits locaux à des prix différents."],["Analyser avant de décider","Pour « comparer les enseignes concurrentes », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Une comparaison concurrentielle se fait sur des critères identiques et observables : prix au kilo, gamme, services, horaires, accessibilité. Il faut distinguer constat et opinion."],["Dossier de travail — données à exploiter","Enseigne A : riz 750 g à 2,70 €, ouverte 8–19 h ; B : riz 1 kg à 3,20 €, ouverte 9–20 h. A propose livraison, B non."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["Comparer des concurrents nécessite des critères communs : offre, prix, services, emplacement, horaires et image.","Éviter les jugements vagues ; observer des données vérifiables et distinguer faits et opinions.","Deux magasins voisins vendent des produits locaux à des prix différents.","Une comparaison concurrentielle se fait sur des critères identiques et observables : prix au kilo, gamme, services, horaires, accessibilité."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"}],"capacites":[{"code":"C5.1","libelle":"Situer le produit sur le marché"}]},"22":{"mp":"MP1 · MP6","objective":"Comprendre et appliquer : calculer prix, remises et promotions. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre les trois prix","Le prix initial est le prix avant promotion. La remise est une diminution exprimée en euros ou en pourcentage. Le prix final est ce que le client paie réellement. Une promotion doit être lisible, non trompeuse et calculée sur une référence justifiable."],["Calculer une remise en euros","Remise (€) = prix initial × taux de remise ÷ 100. Exemple : 24 € avec −15 % donne 24 × 0,15 = 3,60 € de remise. Prix final : 20,40 €."],["Retrouver le taux","Taux de remise (%) = montant de remise ÷ prix initial × 100. Un article qui passe de 50 € à 42 € a une remise de 8 €, soit 16 %."],["Comparer les offres","Deux offres peuvent sembler similaires mais ne pas l’être : −20 % sur 15 € donne 12 € ; 3 € de remise sur 15 € donne aussi 12 €. Pour un lot, comparer le prix à l’unité ou au kilogramme."],["Contrôler l’étiquette","Avant d’imprimer une étiquette : identifier le produit et son format, vérifier le prix de référence, calculer le nouveau prix, arrondir au centime et contrôler la concordance caisse/rayon."],["Situation professionnelle","Pour ton épicerie, tu prépares une opération sur quatre références. Le responsable souhaite un affichage clair du prix initial, du taux et du prix payé. Justifie les offres retenues sans promettre une économie incorrecte."],["Approfondissement — raisonner comme un professionnel","Pour calculer une remise, convertir le pourcentage en décimal puis multiplier le prix initial. Pour deux remises successives, recalculer la seconde sur le prix déjà réduit."],["Dossier de travail — données à exploiter","Un produit vaut 80 € ; remise 15 %. Autre produit 100 € ; remises successives 20 % puis 10 %."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["Remise (€) = prix initial × taux ÷ 100.","Prix remisé = prix initial − remise.","Taux de remise = remise ÷ prix initial × 100.","Comparer des formats avec le prix unitaire ; vérifier le prix affiché et le prix caisse."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP6","intitule":"Animation commerciale"}],"capacites":[{"code":"C5.2","libelle":"Proposer des actions commerciales en vue de l’implantation d’un produit"}]},"23":{"mp":"MP4","objective":"Comprendre et appliquer : concevoir un planogramme simple. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Un planogramme représente l’emplacement des références sur un linéaire."],["Méthode professionnelle","L’implantation tient compte des dimensions, du nombre de facings, de la rotation, des catégories et de l’accessibilité."],["Observer une situation","Un rayon de deux mètres doit accueillir trois familles de biscuits."],["Analyser avant de décider","Pour « concevoir un planogramme simple », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Un planogramme représente l’emplacement des références par tablette et par facing. Il doit intégrer dimensions, lisibilité, rotation, sécurité et contraintes commerciales."],["Dossier de travail — données à exploiter","Rayon de 120 cm sur trois tablettes ; références A 15 cm, B 10 cm, C 20 cm, D 12 cm ; produits lourds C."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Un planogramme représente l’emplacement des références sur un linéaire.","L’implantation tient compte des dimensions, du nombre de facings, de la rotation, des catégories et de l’accessibilité.","Un rayon de deux mètres doit accueillir trois familles de biscuits.","Un planogramme représente l’emplacement des références par tablette et par facing."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"24":{"mp":"MP4 · MP5","objective":"Comprendre et appliquer : s'entraîner aux gestes professionnels. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprend traintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["La réception consiste à comparer la livraison à la commande et aux documents associés.","Vérifier quantités, références, emballages, dates, température si nécessaire, puis signaler les écarts.","La commande indique 24 yaourts ; le bon de livraison en annonce 24, mais 22 sont présents.","À la réception, comparer commande, livraison et documents ; contrôler quantités, intégrité, dates, lots et températures selon les produits."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"},{"code":"MP5","intitule":"Qualité des produits alimentaires et hygiène"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"26":{"mp":"MP4 · MP5","objective":"Comprendre et appliquer : contrôler quantité, qualité et température. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Un contrôle de réception croise quantité, qualité et conditions de conservation."],["Méthode professionnelle","Une anomalie doit être consignée et traitée selon la procédure, avant mise en vente."],["Observer une situation","Deux cartons présentent des emballages écrasés et un relevé de température incohérent."],["Analyser avant de décider","Pour « contrôler quantité, qualité et température », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Un contrôle de réception porte sur quantité, qualité et conservation. Les valeurs de température applicables dépendent de la denrée et de son étiquetage ; ne pas utiliser un seuil unique."],["Dossier de travail — données à exploiter","Livraison : 8 cartons attendus, 7 reçus ; une boîte écrasée ; un produit frais sans enregistrement de température."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["Un contrôle de réception croise quantité, qualité et conditions de conservation.","Une anomalie doit être consignée et traitée selon la procédure, avant mise en vente.","Deux cartons présentent des emballages écrasés et un relevé de température incohérent.","Un contrôle de réception porte sur quantité, qualité et conservation."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"},{"code":"MP5","intitule":"Qualité des produits alimentaires et hygiène"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"27":{"mp":"MP4 · MP5","objective":"Comprendre et appliquer : identifier les anomalies à la réception. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Les anomalies de livraison peuvent concerner les quantités, les références, les dates, l’état ou la température."],["Méthode professionnelle","Il faut isoler les produits douteux, documenter l’écart et prévenir la personne responsable."],["Observer une situation","Un lot commandé n’a pas le même numéro que celui mentionné sur le document."],["Analyser avant de décider","Pour « identifier les anomalies à la réception », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Une non-conformité doit être décrite avec des faits précis, des preuves et une action immédiate. Une réserve n’est pas une accusation : elle protège la traçabilité."],["Dossier de travail — données à exploiter","Bon de livraison 30 unités ; 28 reçues ; trois paquets déchirés ; lot illisible sur deux produits."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Les anomalies de livraison peuvent concerner les quantités, les références, les dates, l’état ou la température.","Il faut isoler les produits douteux, documenter l’écart et prévenir la personne responsable.","Un lot commandé n’a pas le même numéro que celui mentionné sur le document.","Une non-conformité doit être décrite avec des faits précis, des preuves et une action immédiate."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"},{"code":"MP5","intitule":"Qualité des produits alimentaires et hygiène"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"28":{"mp":"MP4","objective":"Comprendre et appliquer : suivre les stocks et les ruptures. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Lire un état de stock","Stock initial : unités présentes au début. Entrées : produits reçus. Sorties : ventes, casse ou transferts. Le stock final doit être expliqué par les mouvements."],["Calculer le stock final","Stock final = stock initial + entrées − sorties. Exemple : 35 unités au départ, 24 reçues et 41 sorties donnent 18 unités."],["Mesurer une rupture","Une rupture apparaît lorsqu’un produit attendu n’est plus disponible à la vente. Elle peut venir d’une erreur de prévision, d’un retard fournisseur ou d’une anomalie de stock."],["Déclencher une commande","Comparer le stock disponible au stock de sécurité et aux ventes prévisionnelles pendant le délai de livraison. La règle précise dépend de la politique de réapprovisionnement du magasin."],["Traiter les écarts","Si le stock informatique annonce 18 unités mais que 15 sont comptées, l’écart est −3. Vérifier les mouvements, la casse, les erreurs de saisie et signaler l’écart avant correction."],["Approfondissement — raisonner comme un professionnel","Stock final théorique = stock initial + entrées − sorties. L’écart d’inventaire = stock réel − stock théorique. Un seuil d’alerte déclenche une vérification, pas une commande aveugle."],["Dossier de travail — données à exploiter","Référence A : initial 45, entrées 20, sorties 52, réel 11 ; B : initial 30, entrées 0, sorties 18, réel 12."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Stock final théorique = stock initial + entrées − sorties.","Stock initial : unités présentes au début.","Stock final = stock initial + entrées − sorties."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"30":{"mp":"MP4","objective":"Comprendre et appliquer : organiser l'inventaire et limiter la démarque. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","L’inventaire consiste à compter et rapprocher les stocks physiques des stocks théoriques."],["Méthode professionnelle","La démarque peut être connue (casse, dates dépassées) ou inconnue (écarts non expliqués)."],["Observer une situation","Le logiciel annonce 40 unités, mais le comptage en révèle 36."],["Analyser avant de décider","Pour « organiser l'inventaire et limiter la démarque », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Un inventaire nécessite un périmètre, une date, une méthode de comptage et une vérification des écarts. La démarque connue et inconnue ne s’analysent pas de la même manière."],["Dossier de travail — données à exploiter","Stock théorique : farine 36, jus 42, biscuits 50 ; comptage : 34, 42, 47 ; coûts unitaires : 1,20 €, 2 €, 1,50 €."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["L’inventaire consiste à compter et rapprocher les stocks physiques des stocks théoriques.","La démarque peut être connue (casse, dates dépassées) ou inconnue (écarts non expliqués).","Le logiciel annonce 40 unités, mais le comptage en révèle 36.","Un inventaire nécessite un périmètre, une date, une méthode de comptage et une vérification des écarts."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"31":{"mp":"MP1 · MP3","objective":"Comprendre et appliquer : préparer ses objectifs de stage. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Un objectif de stage doit être concret, observable et réalisable pendant la période en entreprise."],["Méthode professionnelle","Relier l’objectif à une compétence : observer une réception, accueillir un client ou analyser un rayon."],["Observer une situation","Un élève écrit « devenir meilleur en vente » : transformer cette intention en objectif vérifiable."],["Analyser avant de décider","Pour « préparer ses objectifs de stage », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenu n à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["La largeur d’assortiment est le nombre de familles ; la profondeur est le nombre de références par famille.","Un assortiment très profond facilite le choix mais complique stocks et implantation.","Comparer un commerce avec 12 familles et 3 références chacune à un commerce avec 6 familles et 10 références.","La largeur mesure le nombre de familles ; la profondeur le nombre de références d’une famille."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C5.1","libelle":"Situer le produit sur le marché"},{"code":"C8.2","libelle":"Préparer à la vente des produits"}]},"40":{"mp":"MP1 · MP4","objective":"Comprendre et appliquer : choisir les fournisseurs et les références. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Choisir un fournisseur exige de comparer prix, qualité, délais, fiabilité, conditions de livraison et service."],["Méthode professionnelle","Le prix d’achat seul ne reflète pas toujours le coût total ni le risque de rupture."],["Observer une situation","Deux fournisseurs proposent des tarifs différents mais des délais de livraison opposés."],["Analyser avant de décider","Pour « choisir les fournisseurs et les références », commencer par identifier les informations disponibles et celles qui manquent. Vérifier les contraintes de sécurité, de conservation et de service client selon la situation. Comparer au moins deux options et justifier la solution retenue."],["Transférer au magasin de l’élève","Appliquer la notion à Mon Enseigne 2027 : décrire une décision précise, les moyens nécessaires et la manière de vérifier son efficacité. Éviter une réponse générale non reliée au concept du magasin."],["Approfondissement — raisonner comme un professionnel","Choisir un fournisseur nécessite une comparaison multicritère : prix d’achat, délai, qualité, fiabilité, quantité minimale, conditionnement et services. Les critères peuvent être pondérés."],["Dossier de travail — données à exploiter","A : 1,80 €/u, délai 8 j, minimum 100 ; B : 1,95 €/u, délai 2 j, minimum 20 ; besoin urgent 40 unités."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Choisir un fournisseur exige de comparer prix, qualité, délais, fiabilité, conditions de livraison et service.","Le prix d’achat seul ne reflète pas toujours le coût total ni le risque de rupture.","Deux fournisseurs proposent des tarifs différents mais des délais de livraison opposés.","Choisir un fournisseur nécessite une comparaison multicritère : prix d’achat, délai, qualité, fiabilité, quantité minimale, conditionnement et services."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"41":{"mp":"MP4","objective":"Comprendre et appliquer : mesurer la disponibilité des produits. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Définir la disponibilité","Un produit disponible est effectivement présent et accessible à la vente quand le client le recherche. Un stock en réserve ne garantit pas la disponibilité en rayon."],["Calculer un taux simple","Taux de disponibilité = références disponibles ÷ références contrôlées × 100. Exemple : 46 références présentes sur 50 attendues = 92 %."],["Interpréter les résultats","Un taux global peut masquer des ruptures sur les meilleures ventes. Il faut analyser les références concernées, la durée de rupture et les causes."],["Plan d’action","Contrôler la réserve, le stock informatique, les livraisons et le réassort. Prioriser les produits à forte demande et mesurer le taux après action."],["Approfondissement — raisonner comme un professionnel","Taux de disponibilité = références disponibles / références attendues × 100. Il faut définir l’instant du relevé et ne pas confondre références et unités."],["Dossier de travail — données à exploiter","Rayon de 80 références : 68 présentes ; lundi 72 sur 80 ; mardi 68 sur 80."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Étude de cas guidée : analyser le dossier, répondre aux questions et confronter ses décisions au corrigé.","kind":"document","essentiel":["Taux de disponibilité = références disponibles / références attendues × 100.","Un produit disponible est effectivement présent et accessible à la vente quand le client le recherche.","Taux de disponibilité = références disponibles ÷ références contrôlées × 100."],"referentiel":[{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"42":{"mp":"MP1 · MP4","objective":"Comprendre et appliquer : calculer taux de marge et taux de marque. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Prix d’achat, prix de vente et marge","La marge commerciale unitaire mesure l’écart entre prix de vente HT et coût d’achat HT des marchandises. Elle ne représente pas le bénéfice net du magasin : salaires, loyer, énergie et autres charges restent à payer."],["Calculer la marge","Marge unitaire = PV HT − PA HT. Un produit acheté 8 € HT et vendu 12 € HT génère 4 € de marge unitaire. Pour 50 ventes identiques : marge commerciale totale 200 €."],["Le taux de marge","Taux de marge = marge ÷ PA HT × 100. Avec 4 € de marge et 8 € de PA HT, le taux de marge est de 50 %. La base de comparaison est le prix d’achat."],["Le taux de marque","Taux de marque = marge ÷ PV HT × 100. Avec 4 € de marge et 12 € de PV HT, le taux de marque est de 33,33 %. La base est le prix de vente."],["Ne pas mélanger HT et TTC","Les deux prix doivent être exprimés hors taxes pour calculer ces indicateurs. Si le taux de TVA est fourni, PV HT = PV TTC ÷ (1 + taux de TVA). Exemple pédagogique : 11 € TTC avec 10 % de TVA donne 10 € HT."],["Fixer un prix à partir d’un objectif","Si PA HT = 6 € et taux de marque souhaité = 25 %, PV HT = 6 ÷ (1 − 0,25) = 8 €. Avec un taux de marge de 25 %, PV HT serait seulement 7,50 €."],["Décider comme un gestionnaire","Comparer la marge et les ventes possibles, les prix concurrents, les pertes et la perception des clients. Une marge unitaire élevée ne garantit pas la meilleure performance si les quantités vendues diminuent."],["Approfondissement — raisonner comme un professionnel","Marge unitaire = prix de vente HT − coût d’achat HT. Taux de marge = marge / coût HT × 100 ; taux de marque = marge / prix de vente HT × 100. Ne jamais mélanger HT et TTC."],["Dossier de travail — données à exploiter","Produit A : achat 12 € HT, vente 18 € HT ; B : achat 8 € HT, vente 10 € HT ; ventes prévues : A 20, B 50."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Marge = PV HT − PA HT.","Taux de marge = marge ÷ PA HT × 100.","Taux de marque = marge ÷ PV HT × 100.","Comparer des montants HT ; la marge commerciale n’est pas le bénéfice net."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C8.1","libelle":"Gérer le rayon et son approvisionnement"}]},"43":{"mp":"MP1 · MP4","objective":"Comprendre et appliquer : interpréter des indicateurs commerciaux. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Choisir le bon indicateur","Le CA mesure les ventes en valeur, la marge mesure la contribution commerciale brute, le panier moyen mesure le montant moyen par passage en caisse et le taux de disponibilité mesure l’offre présente."],["Panier moyen","Panier moyen = CA ÷ nombre de tickets. Exemple : 1 800 € de CA pour 120 tickets = 15 € par ticket."],["Comparer les périodes","Une hausse du CA doit être examinée avec les prix, les quantités, les promotions et la durée de comparaison. Une variation en % se calcule sur la valeur initiale."],["Argumenter une décision","Ne pas conclure sur un seul chiffre. Si le CA progresse mais la marge baisse, analyser les remises, la composition des ventes et la démarque."],["Approfondissement — raisonner comme un professionnel","Un indicateur décrit un aspect de l’activité. CA = prix × quantités ; panier moyen = CA / tickets ; évolution = (nouveau − ancien) / ancien × 100. Il faut interpréter avec prudence."],["Dossier de travail — données à exploiter","Semaine 1 : CA 4 800 €, 240 tickets ; semaine 2 : CA 5 400 €, 270 tickets ; coût promo supplémentaire 100 €."],["De l’observation à la décision","Avant de proposer une action, distingue les faits du dossier, les calculs éventuels, les contraintes et les hypothèses. Présente une décision argumentée puis explique comment vérifier son efficacité. En magasin, une réponse doit pouvoir être comprise et appliquée par un collègue."]],"activity":"Atelier créatif : analyser le brief, produire une réalisation sur Canva, SketchUp ou un support adapté, puis défendre trois choix professionnels.","kind":"workshop","essentiel":["Un indicateur décrit un aspect de l’activité.","Le CA mesure les ventes en valeur, la marge mesure la contribution commerciale brute, le panier moyen mesure le montant moyen par passage en caisse et le taux de disponibilité mesure l’offre présente.","Panier moyen = CA ÷ nombre de tickets."],"referentiel":[{"code":"MP1","intitule":"Étude opérationnelle du point de vente"},{"code":"MP4","intitule":"Optimisation du fonctionnement du rayon"}],"capacites":[{"code":"C6.2","libelle":"Rendre compte d’observations susceptibles d’avoir une influence sur la politique commerciale"}]},"45":{"mp":"MP4","objective":"Comprendre et appliquer : prévenir les ruptures et la démarque. Argumenter une décision professionnelle à partir de documents et de contraintes.","parts":[["Comprendre la notion","Prévenir les ruptures demande d’anticiper les ventes, les délais de livraison et le stock de sécurité."],["Méthode professionnelle","La démarque se limite par la rotation, les contrôles, le rangement et la traçabilité des écarts."],["Observer une situation","Une promotion annoncée va doubler la demande sur une référence."],["Analyser avant de décider","Pour « prévenir les ruptures et la démarque », commencer
