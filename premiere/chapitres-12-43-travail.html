<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Première TCVA — Chapitres 12 à 43</title><style>:root{font-family:system-ui,Arial;background:#f4f7fa;color:#173449}*{box-sizing:border-box}body{margin:0}header{background:#102e45;color:white;padding:22px 5vw}header h1{margin:6px 0}header p{color:#c8dce8}main{max-width:980px;margin:auto;padding:16px}.card{background:white;border:1px solid #dbe6ed;border-radius:16px;padding:20px;margin:14px 0}button,select{font:inherit;padding:11px;border:0;border-radius:9px;background:#e5eff3;color:#153d50;font-weight:700;cursor:pointer}.active,.primary{background:#087e93;color:white}.tabs{display:flex;flex-wrap:wrap;gap:8px}.question{padding:15px;border:1px solid #dbe6ed;border-radius:12px;margin:10px 0}.question label{display:block;margin:9px 0}.question small{display:block;color:#647785}textarea{width:100%;min-height:90px;border:1px solid #b9cbd5;border-radius:8px;padding:10px;font:inherit}p,li{line-height:1.65}.hidden{display:none}.fact{border-left:4px solid #087e93;padding:12px 16px;background:#edf8f7;margin:12px 0}.reveal{border:1px solid #dbe6ed;border-radius:10px;padding:12px;margin:10px 0}.reveal button{width:100%;text-align:left}.answer{border-bottom:1px solid #e5edf2;padding:10px 0}.muted{color:#627583}a{color:#087e93}h3{margin-top:23px}</style><header><small>MANUEL TCVA · 2026–2027</small><h1 id="heading"></h1><p id="goal"></p></header><main><p><a href="manuel-v3.html">← Retour au parcours annuel</a></p><div class="card"><label for="select"><b>Choisir une séance</b></label><p><select id="select" style="width:100%"></select></p><p class="muted">Version de travail : les 32 séances sont structurées avec leurs notions et exercices ; le développement complet et la vérification approfondie restent nécessaires avant diffusion comme manuel définitif.</p></div><div class="tabs" id="tabs"></div><section id="body" class="card"></section></main><script>const lessons=[{"n":12,"title":"Analyser les réponses","goal":"Lire un résultat d'enquête","facts":[["Effectif ","nombre de réponses observées"],["Fréquence ","effectif d'une catégorie divisé par effectif total"],["Pourcentage ","fréquence multipliée par 100"],["Échantillon ","personnes effectivement interrogées"],["Biais ","défaut qui peut déformer l'interprétation"]],"caseText":"Un sondage de 80 personnes, dont 24 préfèrent le local, donne 30 %. Ce résultat décrit les répondants, pas automatiquement tous les habitants."},{"n":13,"title":"Protéger le consommateur","goal":"Informer et traiter une réclamation","facts":[["Affichage des prix ","information lisible et non trompeuse"],["DLC ","limite de consommation à respecter pour la sécurité"],["DDM ","date de durabilité minimale, différente d'une DLC"],["Allergènes ","information réglementée à transmettre correctement"],["Réclamation ","écouter, vérifier les faits et proposer une solution conforme"]],"caseText":"La rétractation de 14 jours ne s'applique pas de manière générale à un achat alimentaire effectué en magasin."},{"n":14,"title":"Qui fait quoi dans le magasin ?","goal":"Organiser les responsabilités","facts":[["Organigramme ","représentation des liens hiérarchiques"],["Responsable de rayon ","coordonne l'activité et suit les résultats"],["Réception ","contrôle quantités, qualité et documents"],["Conseiller-vendeur ","accueille, informe et contribue à la tenue du rayon"],["Transmission ","consigne fiable, datée et adressée à la bonne personne"]],"caseText":"Un défaut de température observé à la réception doit être signalé sans attendre au responsable selon les procédures."},{"n":15,"title":"Mesurer la qualité du service","goal":"Évaluer la satisfaction client","facts":[["Qualité attendue ","niveau de service espéré par le client"],["Qualité perçue ","expérience réellement vécue"],["Critère observable ","accueil, attente, disponibilité, propreté"],["Indicateur ","mesure suivie dans le temps"],["Action corrective ","réponse précise à un problème identifié"]],"caseText":"Une enquête de satisfaction et une observation mystère sont complémentaires, mais ne mesurent pas exactement la même chose."},{"n":16,"title":"Choisir ses fournisseurs","goal":"Comparer les offres d'approvisionnement","facts":[["Prix d'achat ","coût facturé selon les conditions négociées"],["Délai ","temps entre commande et réception"],["Fiabilité ","respect des quantités, délais et qualité"],["Traçabilité ","possibilité de suivre l'origine et le parcours des produits"],["Coût complet ","achat, transport, contraintes et pertes éventuelles"]],"caseText":"Un fournisseur moins cher peut coûter davantage si ses livraisons tardives créent des ruptures."},{"n":17,"title":"Construire son offre","goal":"Choisir un assortiment cohérent","facts":[["Assortiment ","ensemble des références proposées"],["Largeur ","nombre de familles ou catégories"],["Profondeur ","nombre de références dans une famille"],["Gamme ","ensemble de produits liés par une logique commerciale"],["Positionnement ","promesse distinctive perçue par la clientèle"]],"caseText":"Un rayon avec huit familles et deux références par famille est plus large et moins profond qu'un rayon de trois familles avec dix références chacune."},{"n":18,"title":"Prix et valeur","goal":"Calculer et argumenter un prix","facts":[["Marge commerciale unitaire ","prix de vente HT moins prix d'achat HT"],["Taux de marge ","marge divisée par prix d'achat HT"],["Taux de marque ","marge divisée par prix de vente HT"],["TVA ","impôt calculé selon le taux applicable au produit"],["Prix au kg ","prix de vente divisé par masse en kg"]],"caseText":"Un produit acheté 8 € HT et vendu 12 € HT dégage 4 € de marge, 50 % de taux de marge et 33,33 % de taux de marque."},{"n":19,"title":"Communiquer et fidéliser","goal":"Concevoir une action de communication","facts":[["Cible ","groupe de clients visé par le message"],["Objectif ","résultat mesurable attendu"],["Canal ","support utilisé pour toucher la cible"],["Fidélisation ","actions encourageant des achats répétés"],["Indicateur ","mesure permettant d'évaluer l'action"]],"caseText":"Une promotion diffusée sur les réseaux sociaux ne touche pas nécessairement les clients qui ne les utilisent pas."},{"n":20,"title":"Bilan MP1 avant stage","goal":"Construire un diagnostic commercial","facts":[["Observation ","fait vérifiable relevé sur le terrain"],["Analyse ","interprétation argumentée des faits"],["Recommandation ","action adaptée aux contraintes"],["Indicateur ","donnée permettant de suivre les effets"],["Justification ","lien explicite entre preuve et décision"]],"caseText":"Dire « le magasin est mal organisé » est une opinion ; relever trois ruptures récurrentes et leur fréquence permet un diagnostic."},{"n":21,"title":"Mission observation rayon","goal":"Décrire un rayon sans juger trop vite","facts":[["Zone chaude ","espace généralement plus fréquenté selon le parcours"],["Zone froide ","espace moins fréquenté à vérifier par observation"],["Linéaire ","espace de présentation mesuré sur le mobilier"],["Facing ","nombre de produits visibles de face"],["Implantation ","organisation des produits sur le rayon"]],"caseText":"Une zone supposée chaude doit être vérifiée avec les flux réels ; l'emplacement ne suffit pas."},{"n":22,"title":"Rayon sous contrôle","goal":"Contrôler l'état d'un rayon","facts":[["Étiquetage ","information prix cohérente et accessible"],["Facing ","présentation frontale des références"],["Rupture ","référence indisponible au moment du besoin"],["Rotation ","sortie prioritaire des produits selon les dates et règles"],["Anomalie ","écart entre situation observée et exigence"]],"caseText":"Une étiquette absente, un produit abîmé et une DLC dépassée nécessitent des traitements distincts."},{"n":23,"title":"Je corrige le rayon","goal":"Prioriser les corrections","facts":[["Diagnostic ","identification des anomalies"],["Urgence ","priorité selon la sécurité et la gravité"],["Réassort ","réapprovisionnement de l'espace de vente"],["Traçabilité ","preuve du contrôle ou de l'action"],["Contrôle final ","vérification après correction"]],"caseText":"Un produit suspect doit être isolé selon la procédure, pas simplement replacé au fond du rayon."},{"n":24,"title":"De la commande au rayon","goal":"Réceptionner et contrôler une livraison","facts":[["Bon de commande ","quantités et références demandées"],["Bon de livraison ","produits déclarés livrés"],["Contrôle quantitatif ","vérification des quantités"],["Contrôle qualitatif ","état, température, dates et conformité"],["Réserve ","espace organisé de stockage temporaire"]],"caseText":"Une livraison de 48 unités au lieu de 60 présente un écart de 12 unités à signaler et documenter."},{"n":25,"title":"Éviter les ruptures","goal":"Suivre et faire tourner les stocks","facts":[["FIFO / PEPS ","premier entré, premier sorti"],["FEFO ","première date d'expiration, première sortie"],["LIFO / DEPS ","dernier entré, premier sorti, généralement inadapté aux denrées périssables"],["Stock de sécurité ","quantité prévue pour absorber certains aléas"],["Couverture ","durée théorique pendant laquelle le stock répond à la consommation"]],"caseText":"Avec 120 unités et 20 ventes par jour, la couverture théorique est de 6 jours ; elle ne garantit pas l'absence de rupture."},{"n":26,"title":"Limiter la démarque","goal":"Comprendre les écarts de stock","facts":[["Démarque connue ","pertes identifiées et enregistrées"],["Démarque inconnue ","écarts non expliqués à l'inventaire"],["Inventaire ","comptage physique des produits"],["Écart de stock ","différence entre stock théorique et réel"],["Prévention ","actions réduisant casse, vols, erreurs et invendus"]],"caseText":"Un stock théorique de 90 unités et un stock physique de 84 révèle un écart de −6 unités à investiguer."},{"n":27,"title":"Agir en sécurité","goal":"Prévenir les risques en rayon","facts":[["Manutention ","déplacement ou port de charges"],["Risque ","possibilité d'un dommage lié à un danger"],["Prévention ","réduction du risque à la source"],["EPI ","protection individuelle adaptée aux tâches"],["Signalement ","remontée rapide d'une situation dangereuse"]],"caseText":"Un sol mouillé exige une sécurisation immédiate de la zone et un traitement selon la procédure."},{"n":28,"title":"Pourquoi ce produit ici ?","goal":"Justifier une implantation","facts":[["Linéaire au sol ","longueur occupée sur le mobilier"],["Linéaire développé ","somme des longueurs sur les niveaux"],["Facing ","quantité de produits visibles de face"],["Rotation ","rythme de vente des références"],["Saisonnalité ","variation de la demande selon la période"]],"caseText":"Un produit à forte rotation peut nécessiter davantage de capacité de présentation, sous réserve de la stratégie du rayon."},{"n":29,"title":"Dessiner un planogramme","goal":"Répartir l'espace du rayon","facts":[["Planogramme ","schéma d'implantation des produits"],["Contrainte de mobilier ","dimensions et niveaux disponibles"],["Famille ","groupe cohérent de références"],["Capacité ","quantité réellement présentable"],["Lisibilité ","facilité de repérage par le client"]],"caseText":"Un planogramme doit respecter les dimensions et la sécurité, pas seulement l'esthétique."},{"n":30,"title":"Réimplanter en équipe","goal":"Conduire une réimplantation","facts":[["Brief ","répartition des objectifs et rôles"],["Préparation ","matériel, stock, étiquettes et sécurité"],["Exécution ","mise en place conforme au plan"],["Contrôle ","vérification du facing et des prix"],["Bilan ","écarts constatés et améliorations"]],"caseText":"Une réimplantation réussie doit préserver la disponibilité des produits et l'accès des clients."},{"n":31,"title":"Défendre mon implantation","goal":"Présenter une justification professionnelle","facts":[["Constat ","observation précise"],["Objectif ","résultat commercial visé"],["Choix ","implantation retenue"],["Argument ","lien entre choix et besoin"],["Limite ","risque ou donnée manquante"]],"caseText":"Un oral convaincant décrit le rayon, justifie les choix et reconnaît les contraintes."},{"n":32,"title":"Lire les chiffres du rayon","goal":"Calculer les indicateurs de base","facts":[["Chiffre d'affaires ","somme des ventes réalisées"],["Panier moyen ","chiffre d'affaires divisé par nombre de tickets"],["Évolution ","différence rapportée à la valeur initiale"],["Volume ","nombre d'unités vendues"],["Comparabilité ","mêmes périodes et périmètres"]],"caseText":"Un CA de 9 600 € pour 400 tickets correspond à un panier moyen de 24 €."},{"n":33,"title":"Le linéaire est-il rentable ?","goal":"Comparer les performances de présentation","facts":[["CA par mètre linéaire ","CA divisé par linéaire considéré"],["Productivité ","résultat rapporté à une ressource"],["Rotation ","ventes rapportées au stock moyen selon la formule choisie"],["Marge ","différence entre vente HT et achat HT"],["Arbitrage ","décision tenant compte de plusieurs indicateurs"]],"caseText":"Un rayon avec plus de CA n'est pas nécessairement celui qui dégage la meilleure marge."},{"n":34,"title":"Calculer puis proposer","goal":"Construire un diagnostic chiffré","facts":[["Calcul ","appliquer une formule et vérifier les unités"],["Interprétation ","expliquer ce que signifie le résultat"],["Comparaison ","confronter à une période ou référence"],["Proposition ","action cohérente avec le constat"],["Vérification ","contrôler la faisabilité et les limites"]],"caseText":"Une hausse de CA peut provenir d'une hausse des prix plutôt que d'une augmentation des quantités vendues."},{"n":35,"title":"Oral blanc 1 : rayon surprise","goal":"Observer et décrire un rayon","facts":[["Présentation ","identifier le rayon et sa clientèle"],["Observation ","décrire sans inventer"],["Anomalie ","écart précis et vérifiable"],["Proposition ","action réaliste"],["Justification ","argument commercial ou réglementaire"]],"caseText":"Un oral de rayon doit mobiliser des preuves visibles et des termes professionnels exacts."},{"n":36,"title":"Retour sur l'oral","goal":"Améliorer l'argumentation","facts":[["Précision ","employer le terme exact"],["Structure ","observation, analyse, proposition"],["Écoute ","répondre à la question posée"],["Justification ","relier choix et conséquence"],["Autoévaluation ","repérer une force et un progrès"]],"caseText":"Dire « je changerais tout » n'est pas une recommandation opérationnelle."},{"n":37,"title":"Écrit blanc 1","goal":"Analyser un dossier commercial","facts":[["Lecture ","repérer les données utiles"],["Calcul ","choisir la formule correcte"],["Unité ","écrire €, %, unités ou jours"],["Interprétation ","donner le sens commercial"],["Recommandation ","conclure avec une action justifiée"]],"caseText":"Un taux sans base de calcul ou sans unité peut conduire à une mauvaise décision."},{"n":38,"title":"Observation d'un rayon réel","goal":"Confronter le cours au terrain","facts":[["Relevé ","collecte de faits datés"],["Implantation ","positionnement des familles"],["Étiquetage ","cohérence prix et référence"],["Promotion ","opération limitée et identifiable"],["Limite ","ce qui n'est pas observable sans documents internes"]],"caseText":"On ne peut pas déduire une marge commerciale à partir du seul prix de vente affiché."},{"n":39,"title":"Oral blanc 2","goal":"Défendre des choix en autonomie","facts":[["Diagnostic ","points forts et anomalies"],["Priorité ","ordre des actions"],["Argumentation ","preuve et effet attendu"],["Vocabulaire ","termes du rayon employés justement"],["Bilan ","proposition d'indicateurs"]],"caseText":"Une recommandation gagne en qualité si elle précise comment mesurer son résultat."},{"n":40,"title":"Écrit blanc 2 et bilan","goal":"Mobiliser les compétences ECCF","facts":[["Donnée ","information utile et sourcée"],["Calcul ","méthode reproductible"],["Résultat ","valeur avec unité"],["Analyse ","sens et limites du chiffre"],["Décision ","action fondée sur le diagnostic"]],"caseText":"Un corrigé professionnel explique le raisonnement, pas uniquement le résultat numérique."},{"n":41,"title":"Proposer une animation","goal":"Définir un projet commercial","facts":[["Animation ","action destinée à mettre en valeur une offre"],["Objectif ","résultat visé"],["Cible ","clientèle prioritaire"],["Thème ","fil conducteur cohérent"],["Indicateur ","mesure du succès"]],"caseText":"Une dégustation doit être préparée avec les contraintes d'hygiène et d'information sur les allergènes."},{"n":42,"title":"Préparer l'action","goal":"Planifier une animation","facts":[["Rétroplanning ","étapes ordonnées avant l'événement"],["Budget ","dépenses prévues et ressources"],["Communication ","message et canaux adaptés"],["Logistique ","matériel, stock, espace et personnel"],["Sécurité ","risques et mesures de prévention"]],"caseText":"Un stand attractif mais mal placé peut gêner la circulation et créer un risque."},{"n":43,"title":"Animer et faire le bilan","goal":"Évaluer une action commerciale","facts":[["Accueil ","premier contact avec le client"],["Argumentation ","bénéfice adapté au besoin"],["Suivi ","collecte des résultats"],["Écart ","différence entre prévu et réalisé"],["Bilan ","enseignements et pistes d'amélioration"]],"caseText":"Une hausse des ventes pendant une animation doit être analysée avec la période de comparaison et les coûts."}];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));let lesson=lessons[0],active='cours',opened=[];const names=['Cours','Exercices','Synthèse','Corrigé 🔒','Mission'],ids=['cours','exercices','synthese','corrige','mission'];function buildQuestions(l){const q=[],F=l.facts;for(let i=0;i<6;i++){const f=F[i%5],g=F[(i+1)%5],h=F[(i+2)%5],opts=[f[1],g[1],h[1],'Une opinion suffit toujours.'];const offset=(l.n+i)%4,rot=opts.map((_,j)=>opts[(j+offset)%4]);const multi=i%3===1;q.push({type:'qcm',text:i%3===0?'Que signifie « '+f[0]+' » ?':i%3===1?'Quelles affirmations sont exactes ?':'Quel repère concerne « '+f[0]+' » ?',opts:rot,correct:multi?[rot.indexOf(f[1]),rot.indexOf(g[1])]:[rot.indexOf(f[1])],explanation:f[0]+' : '+f[1]+(multi?' ; '+g[0]+' : '+g[1]:'')});}const prompts=['Définis « {x} ».','Donne un exemple de « {x} ».','Quelle erreur éviter avec « {x} » ?','Quelle donnée vérifier pour « {x} » ?','Compare « {x} » et « {y} ».','Quel effet de « {x} » pour le client ?','Quel contrôle réaliser pour « {x} » ?','Propose une action sur « {x} ».','Justifie une décision sur « {x} ».','Rédige une consigne sur « {x} ».'];prompts.forEach((t,k)=>{const f=F[k%5],g=F[(k+1)%5];q.push({type:'written',text:t.replace('{x}',f[0]).replace('{y}',g[0]),answer:'Attendu : '+f[1]+'. '+(k===4?'Comparer avec '+g[0]+' : '+g[1]+'. ':'')+'Illustration professionnelle exacte et justifiée.'});});['Identifie le problème principal.','Quelles informations vérifier ?','Quelle action proposer ?','Comment mesurer son résultat ?'].forEach((t,i)=>q.push({type:'written',text:t,context:l.caseText,answer:['Reformuler les faits du cas sans en inventer.','Vérifier des données liées à '+F[0][0]+' et '+F[1][0]+'.','Choisir une action faisable et expliquer pourquoi.','Choisir un indicateur mesurable, avec période de suivi.'][i]}));return q;}function draw(){const qs=buildQuestions(lesson),n=lesson.n;document.title='Séance '+n+' — '+lesson.title;$('heading').textContent='Séance '+n+' · '+lesson.title;$('goal').textContent=lesson.goal;$('tabs').innerHTML=ids.map((x,i)=>'<button data-tab="'+x+'" class="'+(active===x?'active':'')+'">'+names[i]+'</button>').join('');$('body').innerHTML='';if(active==='cours'){$('body').innerHTML='<h2>Cours — '+esc(lesson.goal)+'</h2><p>Objectif professionnel : comprendre les notions suivantes et savoir les mobiliser dans une situation de magasin.</p>'+lesson.facts.map((f,i)=>'<h3>'+(i+1)+'. '+esc(f[0])+'</h3><p><b>Définition :</b> '+esc(f[1])+'.</p><p><b>Application professionnelle :</b> pour utiliser cette notion, le vendeur ou responsable doit observer une situation réelle, recueillir une donnée fiable, distinguer un fait d’une hypothèse et envisager les conséquences pour le client et le rayon.</p><div class="fact"><b>Méthode :</b> identifier le problème ; relever un indice précis ; analyser la situation ; proposer une décision réaliste ; prévoir un contrôle. <b>Question :</b> comment vérifier cette notion dans un magasin alimentaire ?</div><p><b>Point de vigilance :</b> ne pas généraliser à partir d’une seule observation et tenir compte des contraintes du commerce.</p>').join('')+'<h3>Situation fil rouge</h3><p>'+esc(lesson.caseText)+'</p><p class="muted">Complément d\'entraînement : les questions font travailler les notions et leur application. Ce chapitre reste à enrichir avant validation comme cours complet.</p>';}if(active==='exercices'){$('body').innerHTML='<h2>20 questions — 6 QCM, 10 applications et 4 questions de cas</h2><p class="muted">Certaines questions ont plusieurs bonnes réponses. Réponds avant d\'ouvrir le corrigé.</p>'+qs.map((q,i)=>'<div class="question"><b>Q'+(i+1)+'. '+esc(q.text)+'</b>'+(q.context?'<p class="fact">'+esc(q.context)+'</p>':'')+(q.type==='qcm'?'<small>Une ou plusieurs réponses correctes.</small>'+q.opts.map((o,j)=>'<label><input type="checkbox" data-q="'+i+'" data-v="'+j+'"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join(''):'<textarea data-w="'+i+'" placeholder="Réponse argumentée…"></textarea>')+'</div>').join('')+'<button class="primary" id="save">Sauvegarder mes réponses</button> <span id="saved"></span>';const key='tcva_annual_'+n;try{const a=JSON.parse(localStorage.getItem(key)||'null');if(a){for(const [i,values] of Object.entries(a.q)){for(const j of values){const e=document.querySelector('[data-q="'+i+'"][data-v="'+j+'"]');if(e)e.checked=true}}for(const [i,v] of Object.entries(a.w)){const e=document.querySelector('[data-w="'+i+'"]');if(e)e.value=v}}}catch(e){}$('save').onclick=()=>{const a={q:{},w:{}};document.querySelectorAll('[data-q]:checked').forEach(e=>(a.q[e.dataset.q]??=[]).push(Number(e.dataset.v)));document.querySelectorAll('[data-w]').forEach(e=>a.w[e.dataset.w]=e.value);localStorage.setItem(key,JSON.stringify(a));$('saved').textContent='Enregistré sur cet appareil.'};}if(active==='synthese'){$('body').innerHTML='<h2>À connaître — les cinq notions</h2><p>Les titres et explications sont cachés au départ. Dévoile chaque point progressivement.</p>'+lesson.facts.map((f,i)=>'<div class="reveal"><button data-open="'+i+'">'+(opened.includes(i)?'− Masquer':'+ Dévoiler')+' le point '+(i+1)+'</button>'+(opened.includes(i)?'<div class="fact"><b>'+esc(f[0])+'</b><p>'+esc(f[1])+'</p><p><b>Situation :</b> '+esc(lesson.caseText)+'</p></div>':'')+'</div>').join('')+'<button id="reset">Tout masquer</button>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.open);opened=opened.includes(i)?opened.filter(x=>x!==i):[...opened,i];draw()});$('reset').onclick=()=>{opened=[];draw()};}if(active==='corrige'){$('body').innerHTML='<h2>Corrigé — accès professeur</h2><p>Code numérique de la séance.</p><input id="code" type="number" min="1" max="500" placeholder="Code" style="padding:12px;width:130px"> <button class="primary" id="unlock">Déverrouiller</button><p id="err"></p><div id="answers" class="hidden">'+qs.map((q,i)=>'<div class="answer"><b>Q'+(i+1)+'</b><p>'+esc(q.type==='qcm'?q.correct.map(j=>String.fromCharCode(65+j)).join(', ')+' — '+q.explanation:q.answer)+'</p></div>').join('')+'</div>';$('unlock').onclick=()=>{const ok=Number($('code').value)===((n*37)%499+1);$('err').textContent=ok?'Code accepté':'Code incorrect';$('answers').classList.toggle('hidden',!ok)};}if(active==='mission'){$('body').innerHTML='<h2>Mission professionnelle</h2><p><b>Défi :</b> '+esc(lesson.goal)+'</p><p>Par équipes, collectez des faits dans un magasin ou un dossier fourni par le professeur. Présentez deux observations, une proposition et un indicateur permettant de la vérifier.</p><p><b>Situation de départ :</b> '+esc(lesson.caseText)+'</p><p class="muted">La mission est à réaliser avec un support terrain, document ou activité fourni par le professeur.</p>';}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;draw()});}function choose(){lesson=lessons.find(x=>x.n===Number($('select').value))||lessons[0];active='cours';opened=[];draw()}$('select').innerHTML=lessons.map(l=>'<option value="'+l.n+'">Séance '+l.n+' — '+esc(l.title)+'</option>').join('');$('select').onchange=choose;const wanted=Number(new URLSearchParams(location.search).get('seance'));if(lessons.some(x=>x.n===wanted))$('select').value=wanted;choose();</script></html>
