<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexique MP4</title><style>body{font:16px system-ui;background:#f5f7f3;color:#18332e;margin:0}main{max-width:950px;margin:auto;padding:20px}a,button{color:#14674e}button,input,select{font:inherit;padding:12px;border:1px solid #ccdcd4;border-radius:9px;background:white}input{width:100%;box-sizing:border-box;margin:12px 0}article{background:white;border:1px solid #dce6df;border-radius:12px;padding:15px;margin:9px 0}h2{font-size:19px}small{color:#56736a}button{cursor:pointer;margin:4px}p{line-height:1.5}</style><main><a href="./">Retour à l'accueil</a><h1>Lexique professionnel MP4</h1><p>150 définitions pour réviser le vocabulaire de la gestion commerciale en commerce alimentaire.</p><input id="q" placeholder="Rechercher : facing, DDM, PLV…" aria-label="Rechercher"><select id="theme" aria-label="Thème"></select><button id="mode">Mode mémorisation</button><button id="quiz">Quiz</button><p id="count"></p><div id="list"></div></main><script>const data=[{"theme":"Mobilier et équipements","term":"Gondole","def":"Meuble de vente à rayonnages, souvent accessible des deux côtés."},{"theme":"Mobilier et équipements","term":"Tête de gondole (TG)","def":"Extrémité d'une gondole utilisée pour mettre des produits en valeur."},{"theme":"Mobilier et équipements","term":"Linéaire","def":"Longueur de présentation des produits sur un meuble de vente."},{"theme":"Mobilier et équipements","term":"Tablette","def":"Surface horizontale sur laquelle reposent les produits."},{"theme":"Mobilier et équipements","term":"Étagère","def":"Support horizontal de rangement ou de présentation."},{"theme":"Mobilier et équipements","term":"Broche","def":"Tige permettant de suspendre des produits."},{"theme":"Mobilier et équipements","term":"Bac promotionnel","def":"Contenant ouvert présentant des produits en promotion."},{"theme":"Mobilier et équipements","term":"Îlot","def":"Meuble de présentation indépendant accessible de plusieurs côtés."},{"theme":"Mobilier et équipements","term":"Présentoir","def":"Support conçu pour mettre en valeur des produits."},{"theme":"Mobilier et équipements","term":"Vitrine","def":"Espace vitré permettant de présenter des marchandises."},{"theme":"Mobilier et équipements","term":"Vitrine réfrigérée","def":"Meuble vitré maintenant les produits au froid."},{"theme":"Mobilier et équipements","term":"Armoire réfrigérée","def":"Meuble vertical de conservation au froid."},{"theme":"Mobilier et équipements","term":"Bac surgelé","def":"Meuble destiné à conserver les produits surgelés."},{"theme":"Mobilier et équipements","term":"Balance","def":"Appareil permettant de mesurer le poids."},{"theme":"Mobilier et équipements","term":"Caisse","def":"Poste où sont enregistrés et réglés les achats."},{"theme":"Mobilier et équipements","term":"Terminal de paiement (TPE)","def":"Appareil permettant le paiement électronique."},{"theme":"Mobilier et équipements","term":"Douchette","def":"Lecteur de codes-barres portatif."},{"theme":"Mobilier et équipements","term":"Chariot","def":"Équipement roulant permettant de transporter des marchandises ou achats."},{"theme":"Mobilier et équipements","term":"Roll","def":"Conteneur roulant utilisé pour transporter les marchandises."},{"theme":"Mobilier et équipements","term":"Transpalette","def":"Appareil servant à déplacer des palettes."},{"theme":"Implantation et organisation","term":"Surface de vente","def":"Espace accessible aux clients consacré à la vente."},{"theme":"Implantation et organisation","term":"Réserve","def":"Espace de stockage non destiné à la clientèle."},{"theme":"Implantation et organisation","term":"Rayon","def":"Espace regroupant des produits selon une catégorie."},{"theme":"Implantation et organisation","term":"Univers","def":"Ensemble de rayons répondant à un même besoin général."},{"theme":"Implantation et organisation","term":"Allée principale","def":"Axe majeur de circulation dans le magasin."},{"theme":"Implantation et organisation","term":"Allée secondaire","def":"Passage desservant les rayons."},{"theme":"Implantation et organisation","term":"Zone chaude","def":"Espace naturellement très fréquenté."},{"theme":"Implantation et organisation","term":"Zone froide","def":"Espace naturellement moins fréquenté."},{"theme":"Implantation et organisation","term":"Parcours client","def":"Chemin suivi par le client dans le magasin."},{"theme":"Implantation et organisation","term":"Flux client","def":"Déplacement des clients dans un espace de vente."},{"theme":"Implantation et organisation","term":"Implantation","def":"Organisation physique des produits ou rayons."},{"theme":"Implantation et organisation","term":"Plan de masse","def":"Plan représentant l'organisation générale du magasin."},{"theme":"Implantation et organisation","term":"Planogramme","def":"Schéma indiquant la position précise des références sur un meuble."},{"theme":"Implantation et organisation","term":"Entrée","def":"Point d'accès des clients au magasin."},{"theme":"Implantation et organisation","term":"Sortie","def":"Point par lequel les clients quittent le magasin."},{"theme":"Implantation et organisation","term":"Zone de caisse","def":"Espace consacré à l'encaissement."},{"theme":"Implantation et organisation","term":"Zone promotionnelle","def":"Espace réservé aux offres mises en avant."},{"theme":"Implantation et organisation","term":"Zone de réception","def":"Espace où les livraisons sont contrôlées."},{"theme":"Implantation et organisation","term":"Accessibilité","def":"Possibilité pour tous les clients d'accéder aux espaces et services."},{"theme":"Implantation et organisation","term":"Circulation","def":"Organisation des déplacements dans le magasin."},{"theme":"Merchandising et mise en rayon","term":"Merchandising","def":"Techniques d'organisation et de présentation destinées à faciliter et développer les ventes."},{"theme":"Merchandising et mise en rayon","term":"Facing","def":"Nombre de produits identiques visibles de face sur un niveau de rayon."},{"theme":"Merchandising et mise en rayon","term":"Frontale","def":"Face visible d'un produit présenté au client."},{"theme":"Merchandising et mise en rayon","term":"Réassort","def":"Action de remettre des produits en rayon."},{"theme":"Merchandising et mise en rayon","term":"Remplissage","def":"Action de garnir le rayon de marchandises."},{"theme":"Merchandising et mise en rayon","term":"Rupture en rayon","def":"Absence d'une référence à son emplacement de vente."},{"theme":"Merchandising et mise en rayon","term":"Linéaire au sol","def":"Longueur du meuble mesurée au sol."},{"theme":"Merchandising et mise en rayon","term":"Linéaire développé","def":"Somme des longueurs de présentation de tous les niveaux."},{"theme":"Merchandising et mise en rayon","term":"Niveau des yeux","def":"Hauteur de présentation proche du regard du client."},{"theme":"Merchandising et mise en rayon","term":"Niveau des mains","def":"Hauteur permettant une prise facile du produit."},{"theme":"Merchandising et mise en rayon","term":"Niveau bas","def":"Partie inférieure du meuble de vente."},{"theme":"Merchandising et mise en rayon","term":"Niveau haut","def":"Partie supérieure du meuble de vente."},{"theme":"Merchandising et mise en rayon","term":"Implantation verticale","def":"Présentation d'une famille sur plusieurs niveaux superposés."},{"theme":"Merchandising et mise en rayon","term":"Implantation horizontale","def":"Présentation d'une famille sur un même niveau."},{"theme":"Merchandising et mise en rayon","term":"Cross-merchandising","def":"Présentation rapprochée de produits complémentaires."},{"theme":"Merchandising et mise en rayon","term":"Massification","def":"Présentation d'une quantité importante de produits pour renforcer leur visibilité."},{"theme":"Merchandising et mise en rayon","term":"Théâtralisation","def":"Mise en scène des produits pour attirer l'attention."},{"theme":"Merchandising et mise en rayon","term":"Balisation","def":"Repérage visuel des produits et espaces."},{"theme":"Merchandising et mise en rayon","term":"Part de linéaire","def":"Proportion du linéaire attribuée à une référence ou famille."},{"theme":"Merchandising et mise en rayon","term":"Productivité du linéaire","def":"Chiffre d'affaires ou marge rapporté à une longueur de linéaire."},{"theme":"Signalétique et communication","term":"PLV","def":"Publicité sur le lieu de vente destinée à attirer et convaincre."},{"theme":"Signalétique et communication","term":"ILV","def":"Information sur le lieu de vente destinée à renseigner le client."},{"theme":"Signalétique et communication","term":"Signalétique","def":"Ensemble des indications visuelles orientant ou informant le client."},{"theme":"Signalétique et communication","term":"Stop-rayon","def":"Support dépassant du rayon pour attirer le regard."},{"theme":"Signalétique et communication","term":"Kakémono","def":"Support publicitaire vertical suspendu ou sur pied."},{"theme":"Signalétique et communication","term":"Affiche","def":"Support imprimé transmettant un message."},{"theme":"Signalétique et communication","term":"Étiquette prix","def":"Support indiquant le prix et les informations utiles à l'achat."},{"theme":"Signalétique et communication","term":"Balisage prix","def":"Ensemble des supports permettant d'identifier les prix."},{"theme":"Signalétique et communication","term":"Totem","def":"Support vertical autonome de communication."},{"theme":"Signalétique et communication","term":"Vitrophanie","def":"Décor ou message adhésif appliqué sur une vitre."},{"theme":"Produits et assortiment","term":"Assortiment","def":"Ensemble des références proposées à la vente."},{"theme":"Produits et assortiment","term":"Référence","def":"Produit précisément identifié dans l'assortiment."},{"theme":"Produits et assortiment","term":"Famille","def":"Groupe de produits présentant des caractéristiques communes."},{"theme":"Produits et assortiment","term":"Sous-famille","def":"Subdivision d'une famille de produits."},{"theme":"Produits et assortiment","term":"Gamme","def":"Ensemble de produits liés par leur usage ou positionnement."},{"theme":"Produits et assortiment","term":"Largeur d'assortiment","def":"Nombre de familles de produits proposées."},{"theme":"Produits et assortiment","term":"Profondeur d'assortiment","def":"Nombre de références proposées dans une famille."},{"theme":"Produits et assortiment","term":"Marque nationale","def":"Marque commercialisée par un fabricant auprès de plusieurs distributeurs."},{"theme":"Produits et assortiment","term":"MDD","def":"Marque de distributeur commercialisée sous sa responsabilité."},{"theme":"Produits et assortiment","term":"Premier prix","def":"Produit positionné parmi les moins chers de sa catégorie."},{"theme":"Produits et assortiment","term":"Produit d'appel","def":"Produit destiné à attirer les clients."},{"theme":"Produits et assortiment","term":"Produit complémentaire","def":"Produit dont l'utilisation complète celle d'un autre."},{"theme":"Produits et assortiment","term":"Produit saisonnier","def":"Produit dont les ventes dépendent d'une période de l'année."},{"theme":"Produits et assortiment","term":"Conditionnement","def":"Présentation et contenant immédiat du produit."},{"theme":"Produits et assortiment","term":"EAN/GTIN","def":"Identifiant normalisé d'une référence commerciale, souvent représenté par un code-barres."},{"theme":"Hygiène et traçabilité","term":"DLC","def":"Date limite de consommation : au-delà, un aliment très périssable ne doit plus être consommé ni vendu."},{"theme":"Hygiène et traçabilité","term":"DDM","def":"Date de durabilité minimale : au-delà, les qualités peuvent diminuer sans danger automatique si le produit est bien conservé et intact."},{"theme":"Hygiène et traçabilité","term":"Chaîne du froid","def":"Maintien des températures requises pendant le stockage, le transport et la vente."},{"theme":"Hygiène et traçabilité","term":"Rupture de la chaîne du froid","def":"Interruption du maintien des températures requises."},{"theme":"Hygiène et traçabilité","term":"Traçabilité","def":"Capacité à retrouver l'origine et le parcours d'un produit."},{"theme":"Hygiène et traçabilité","term":"Lot","def":"Ensemble de produits identifiés comme issus de conditions de production communes."},{"theme":"Hygiène et traçabilité","term":"Retrait","def":"Action de retirer un produit de la distribution."},{"theme":"Hygiène et traçabilité","term":"Rappel","def":"Action visant aussi les produits déjà remis aux consommateurs."},{"theme":"Hygiène et traçabilité","term":"HACCP","def":"Méthode d'analyse et de maîtrise des dangers alimentaires."},{"theme":"Hygiène et traçabilité","term":"Contamination","def":"Présence ou introduction d'un danger dans un aliment."},{"theme":"Hygiène et traçabilité","term":"Contamination croisée","def":"Transfert d'un contaminant entre aliments, surfaces ou matériels."},{"theme":"Hygiène et traçabilité","term":"Allergène","def":"Substance susceptible de provoquer une réaction allergique."},{"theme":"Hygiène et traçabilité","term":"Nettoyage","def":"Élimination des salissures."},{"theme":"Hygiène et traçabilité","term":"Désinfection","def":"Réduction des micro-organismes par un procédé adapté."},{"theme":"Hygiène et traçabilité","term":"FIFO (PEPS)","def":"Premier entré, premier sorti."},{"theme":"Hygiène et traçabilité","term":"FEFO","def":"Produit dont la date expire le plus tôt sorti en priorité."},{"theme":"Hygiène et traçabilité","term":"Rotation des dates","def":"Organisation des produits pour vendre en priorité ceux dont la date est la plus proche."},{"theme":"Hygiène et traçabilité","term":"Température de conservation","def":"Température à respecter selon le produit et la réglementation."},{"theme":"Hygiène et traçabilité","term":"Non-conformité","def":"Écart par rapport à une exigence définie."},{"theme":"Hygiène et traçabilité","term":"Démarque sanitaire","def":"Perte liée à des produits devenus impropres à la vente pour raison sanitaire."},{"theme":"Stocks et approvisionnement","term":"Stock","def":"Quantité de marchandises détenue à un moment donné."},{"theme":"Stocks et approvisionnement","term":"Stock initial","def":"Quantité présente au début d'une période."},{"theme":"Stocks et approvisionnement","term":"Stock final","def":"Quantité présente à la fin d'une période."},{"theme":"Stocks et approvisionnement","term":"Stock théorique","def":"Quantité calculée à partir des mouvements enregistrés."},{"theme":"Stocks et approvisionnement","term":"Stock réel","def":"Quantité effectivement comptée."},{"theme":"Stocks et approvisionnement","term":"Stock de sécurité","def":"Réserve destinée à absorber les imprévus."},{"theme":"Stocks et approvisionnement","term":"Stock d'alerte","def":"Niveau déclenchant une commande."},{"theme":"Stocks et approvisionnement","term":"Rupture de stock","def":"Absence de stock disponible."},{"theme":"Stocks et approvisionnement","term":"Surstock","def":"Quantité supérieure aux besoins prévus."},{"theme":"Stocks et approvisionnement","term":"Inventaire","def":"Comptage et contrôle des marchandises."},{"theme":"Stocks et approvisionnement","term":"Approvisionnement","def":"Ensemble des opérations permettant de disposer des marchandises."},{"theme":"Stocks et approvisionnement","term":"Bon de commande","def":"Document précisant les marchandises commandées."},{"theme":"Stocks et approvisionnement","term":"Bon de livraison","def":"Document détaillant les marchandises livrées."},{"theme":"Stocks et approvisionnement","term":"Démarque connue","def":"Perte identifiée et enregistrée, par exemple une casse."},{"theme":"Stocks et approvisionnement","term":"Démarque inconnue","def":"Écart de stock dont la cause précise n'est pas identifiée."},{"theme":"Prix et calculs commerciaux","term":"Prix d'achat HT","def":"Prix facturé par le fournisseur hors taxes."},{"theme":"Prix et calculs commerciaux","term":"Coût d'achat HT","def":"Prix d'achat net augmenté des frais d'achat."},{"theme":"Prix et calculs commerciaux","term":"Prix de vente HT","def":"Prix de vente hors taxes."},{"theme":"Prix et calculs commerciaux","term":"Prix de vente TTC","def":"Prix payé par le consommateur, taxes comprises."},{"theme":"Prix et calculs commerciaux","term":"TVA","def":"Taxe sur la valeur ajoutée."},{"theme":"Prix et calculs commerciaux","term":"Taux de TVA","def":"Pourcentage de taxe appliqué au prix HT."},{"theme":"Prix et calculs commerciaux","term":"Marge commerciale","def":"Prix de vente HT moins coût d'achat HT, pour une unité."},{"theme":"Prix et calculs commerciaux","term":"Taux de marge","def":"Marge divisée par coût d'achat HT, multipliée par 100."},{"theme":"Prix et calculs commerciaux","term":"Taux de marque","def":"Marge divisée par prix de vente HT, multipliée par 100."},{"theme":"Prix et calculs commerciaux","term":"Coefficient multiplicateur","def":"Rapport entre prix de vente TTC et prix d'achat HT selon la convention utilisée."},{"theme":"Prix et calculs commerciaux","term":"Chiffre d'affaires","def":"Somme des ventes réalisées sur une période."},{"theme":"Prix et calculs commerciaux","term":"Panier moyen","def":"Chiffre d'affaires divisé par le nombre de tickets."},{"theme":"Prix et calculs commerciaux","term":"Prix unitaire","def":"Prix d'une unité de produit."},{"theme":"Prix et calculs commerciaux","term":"Prix au kilo ou au litre","def":"Prix rapporté à une unité de mesure pour faciliter la comparaison."},{"theme":"Prix et calculs commerciaux","term":"Réduction","def":"Diminution d'un prix."},{"theme":"Prix et calculs commerciaux","term":"Remise","def":"Réduction commerciale accordée sur un prix."},{"theme":"Prix et calculs commerciaux","term":"Taux de réduction","def":"Montant de la réduction divisé par le prix initial, multiplié par 100."},{"theme":"Prix et calculs commerciaux","term":"Prix net","def":"Prix après déduction des réductions applicables."},{"theme":"Prix et calculs commerciaux","term":"Rentabilité","def":"Capacité à dégager un résultat par rapport aux moyens engagés."},{"theme":"Prix et calculs commerciaux","term":"Taux d'évolution","def":"Différence entre valeur finale et initiale divisée par valeur initiale, multipliée par 100."},{"theme":"Promotion et animation","term":"Promotion","def":"Avantage commercial temporaire destiné à stimuler les ventes."},{"theme":"Promotion et animation","term":"Animation commerciale","def":"Action organisée pour dynamiser les ventes ou attirer les clients."},{"theme":"Promotion et animation","term":"Dégustation","def":"Action permettant au client de goûter un produit."},{"theme":"Promotion et animation","term":"Échantillonnage","def":"Distribution d'une petite quantité de produit pour essai."},{"theme":"Promotion et animation","term":"Vente additionnelle","def":"Vente d'un produit supplémentaire lors d'un achat."},{"theme":"Promotion et animation","term":"Offre groupée","def":"Offre réunissant plusieurs produits dans un même ensemble."},{"theme":"Promotion et animation","term":"Bon de réduction","def":"Support donnant droit à une réduction selon ses conditions."},{"theme":"Promotion et animation","term":"Fidélisation","def":"Actions visant à encourager les achats répétés."},{"theme":"Promotion et animation","term":"Carte de fidélité","def":"Support permettant de bénéficier d'avantages liés aux achats."},{"theme":"Promotion et animation","term":"Prix antérieur","def":"Pour une annonce de réduction, en principe le prix le plus bas pratiqué durant les 30 jours précédents, sous réserve des exceptions légales."}];const q=document.getElementById('q'),theme=document.getElementById('theme'),list=document.getElementById('list'),count=document.getElementById('count');let memory=false;theme.add(new Option('Tous les thèmes',''));[...new Set(data.map(x=>x.theme))].forEach(t=>theme.add(new Option(t,t)));const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function filtered(){return data.filter(x=>(!theme.value||x.theme===theme.value)&&norm(x.term+' '+x.def).includes(norm(q.value)))}function render(){list.replaceChildren();let rows=filtered();count.textContent=rows.length+' définition(s)';rows.forEach(x=>{let a=document.createElement('article'),h=document.createElement('h2'),s=document.createElement('small'),p=document.createElement('p');h.textContent=(data.indexOf(x)+1)+'. '+x.term;s.textContent=x.theme;p.textContent=x.def;a.append(s,h,p);if(memory){p.hidden=true;let b=document.createElement('button');b.textContent='Afficher / masquer';b.onclick=()=>p.hidden=!p.hidden;a.append(b)}list.append(a)})}q.oninput=theme.onchange=render;document.getElementById('mode').onclick=function(){memory=!memory;this.textContent=memory?'Mode dictionnaire':'Mode mémorisation';render()};document.getElementById('quiz').onclick=function(){let rows=filtered();if(!rows.length)return;let x=rows[Math.floor(Math.random()*rows.length)];list.replaceChildren();count.textContent='Quel terme correspond à cette définition ?';let p=document.createElement('p');p.textContent=x.def;list.append(p);let choices=[x,...data.filter(y=>y!==x).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);let feedback=document.createElement('p');choices.forEach(y=>{let b=document.createElement('button');b.textContent=y.term;b.onclick=()=>{feedback.textContent=y===x?'Correct !':'Réponse : '+x.term;list.querySelectorAll('button').forEach(z=>z.disabled=true);let next=document.createElement('button');next.textContent='Question suivante';next.onclick=()=>document.getElementById('quiz').click();list.append(next)};list.append(b)});list.append(feedback)};render();</script></html>
