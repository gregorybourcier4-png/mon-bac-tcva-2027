nt au client de goûter un produit."},{"theme":"Promotion et animation","term":"Bon de réduction","def":"Support donnant droit à une réduction selon ses conditions."},{"theme":"Promotion et animation","term":"Prix antérieur","def":"Pour une annonce de réduction, en principe le prix le plus bas pratiqué durant les 30 jours précédents, sous réserve des exceptions légales."},{"theme":"Promotion et animation","term":"Remise immédiate","def":"Réduction appliquée directement lors du passage en caisse."},{"theme":"Promotion et animation","term":"Réduction en pourcentage","def":"Baisse du prix exprimée en pourcentage du prix initial."},{"theme":"Promotion et animation","term":"Réduction en euros","def":"Baisse du prix exprimée en montant fixe."},{"theme":"Promotion et animation","term":"Deux achetés, un offert","def":"Offre donnant une unité gratuite pour deux unités achetées, selon les conditions annoncées."},{"theme":"Promotion et animation","term":"Deuxième produit à prix réduit","def":"Réduction appliquée au deuxième article éligible."},{"theme":"Promotion et animation","term":"Lot promotionnel","def":"Ensemble de produits vendu à un prix promotionnel."},{"theme":"Promotion et animation","term":"Format économique","def":"Conditionnement de grande taille présenté comme avantageux au prix unitaire."},{"theme":"Promotion et animation","term":"Quantité supplémentaire offerte","def":"Quantité ajoutée sans augmentation du prix annoncé."},{"theme":"Promotion et animation","term":"Cagnottage","def":"Avantage crédité sur un compte fidélité pour une utilisation ultérieure."},{"theme":"Promotion et animation","term":"Offre de remboursement (ODR)","def":"Remboursement total ou partiel après achat, selon les conditions de l'offre."},{"theme":"Promotion et animation","term":"Coupon différé","def":"Bon de réduction utilisable lors d'un achat ultérieur."},{"theme":"Promotion et animation","term":"Vente flash","def":"Offre limitée à une courte durée."},{"theme":"Promotion et animation"," e, par exemple une casse."},{"theme":"Stocks et approvisionnement","term":"Démarque inconnue","def":"Écart de stock dont la cause précise n'est pas identifiée."},{"theme":"Produits et assortiment","term":"Assortiment","def":"Ensemble des références proposées à la vente."},{"theme":"Produits et assortiment","term":"Référence","def":"Produit précisément identifié dans l'assortiment."},{"theme":"Produits et assortiment","term":"Famille","def":"Groupe de produits présentant des caractéristiques communes."},{"theme":"Produits et assortiment","term":"Gamme","def":"Ensemble de produits liés par leur usage ou positionnement."},{"theme":"Produits et assortiment","term":"Largeur d'assortiment","def":"Nombre de familles de produits proposées."},{"theme":"Produits et assortiment","term":"Profondeur d'assortiment","def":"Nombre de références proposées dans une famille."},{"theme":"Produits et assortiment","term":"MDD","def":"Marque de distributeur commercialisée sous sa responsabilité."},{"theme":"Produits et assortiment","term":"Produit d'appel","def":"Produit destiné à attirer les clients."},{"theme":"Hygiène et traçabilité","term":"DLC","def":"Date limite de consommation : au-delà, un aliment très périssable ne doit plus être consommé ni vendu."},{"theme":"Hygiène et traçabilité","term":"DDM","def":"Date de durabilité minimale : au-delà, les qualités peuvent diminuer sans danger automatique si le produit est bien conservé et intact."},{"theme":"Hygiène et traçabilité","term":"Chaîne du froid","def":"Maintien des températures requises pendant le stockage, le transport et la vente."},{"theme":"Hygiène et traçabilité","term":"Traçabilité","def":"Capacité à retrouver l'origine et le parcours d'un produit."},{"theme":"Hygiène et traçabilité","term":"Lot","def":"Ensemble de produits identifiés comme issus de conditions de production communes."},{"theme":"Hygiène et traçabilité","term":"FEFO","def":"Produit dont la date expire le plus tôt sorti en priorité."},{"theme":"Hygiène et traçabilité","term":"Rotation des dates","def":"Organisation des produits pour vendre en priorité ceux dont la date est la plus proche."}];const q=document.getElementById('q'),theme=document.getElementById('theme'),list=document.getElementById('list'),count=document.getElementById('count');let memory=false;theme.add(new Option('Tous les thèmes',''));[...new Set(data.map(x=>x.theme))].forEach(t=>theme.add(new Option(t,t)));const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function filtered(){return data.filter(x=>(!theme.value||x.theme===theme.value)&&norm(x.term+' '+x.def).includes(norm(q.value)))}function render(){list.replaceChildren();let rows=filtered();count.textContent=rows.length+' définition(s)';rows.forEach(x=>{let a=document.createElement('article'),h=document.createElement('h2'),s=document.createElement('small'),p=document.createElement('p');h.textContent=(data.indexOf(x)+1)+'. '+x.term;s.textContent=x.theme;p.textContent=x.def;a.append(s,h,p);if(memory){p.hidden=true;let b=document.createElement('button');b.textContent='Afficher / masquer';b.onclick=()=>p.hidden=!p.hidden;a.append(b)}list.append(a)})}q.oninput=theme.onchange=render;document.getElementById('mode').onclick=function(){memory=!memory;this.textContent=memory?'Mode dictionnaire':'Mode mémorisation';render()};document.getElementById('quiz').onclick=function(){let rows=filtered();if(!rows.length)return;let x=rows[Math.floor(Math.random()*rows.length)];list.replaceChildren();count.textContent='Quel terme correspond à cette définition ?';let p=document.createElement('p');p.textContent=x.def;list.append(p);let choices=[x,...data.filter(y=>y!==x).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);let feedback=document.createElement('p');choices.forEach(y=>{let b=document.createElement('button');b.textContent=y.term;b.onclick=()=>{feedback.textContent=y===x?'Correct !':'Réponse : '+x.term;list.querySelectorAll('button').forEach(z=>z.disabled=true);let next=document.createElement('button');next.textContent='Question suivante';next.onclick=()=>document.getElementById('quiz').click();list.append(next)};list.append(b)});list.append(feedback)};render();</script></html>
