const manual={"8":["Un point de vente est un lieu physique ou numérique où une offre est proposée à une clientèle. Sa caractérisation repose sur sa forme de commerce, son statut juridique, son implantation et son organisation.","Le commerce indépendant isolé appartient à un commerçant autonome. Le commerce indépendant associé regroupe des commerçants juridiquement indépendants au sein d'un réseau. Le commerce intégré regroupe des points de vente détenus ou pilotés par une même entreprise.","La surface de vente accueille les clients et les produits accessibles à l'achat ; la réserve permet le stockage. Les accès, la circulation, l'affichage des prix et les espaces de service influencent l'expérience client.","Ne confonds pas la forme de commerce (organisation du réseau) et la forme juridique (entreprise individuelle, société…). Deux magasins d'un même secteur peuvent avoir des organisations très différentes."],"9":["Le marché est le lieu de rencontre entre une offre et une demande. Il évolue sous l'effet des habitudes alimentaires, du pouvoir d'achat, des innovations et des règles applicables.","La concurrence directe propose une offre proche à une clientèle semblable. La concurrence indirecte répond au même besoin avec une solution différente. Une comparaison sérieuse porte sur les prix à quantité égale, l'assortiment et les services.","La veille commerciale consiste à collecter régulièrement des informations fiables : enseignes concurrentes, prix, tendances et retours clients. Chaque information doit être datée et sa source identifiée."],"10":["La zone de chalandise correspond à l'espace géographique d'où proviennent les clients d'un commerce. Elle dépend du temps d'accès, des déplacements, des concurrents et de l'attractivité du magasin.","On distingue souvent une zone primaire, secondaire et tertiaire, mais leurs limites ne sont pas universelles : elles doivent être justifiées par les trajets et les habitudes réels.","Un bon emplacement combine visibilité, accessibilité, flux, stationnement ou transports et cohérence avec la clientèle ciblée. La présence d'un concurrent peut être un risque ou renforcer l'attractivité d'un pôle."],"11":["Segmenter consiste à diviser un marché en groupes de clients ayant des caractéristiques ou attentes communes. On peut utiliser des critères géographiques, démographiques, psychographiques ou comportementaux.","La cible est le ou les segments que l'enseigne décide de privilégier. Un persona représente un client type fictif, construit à partir d'observations plutôt que de stéréotypes.","Une enquête efficace emploie des questions neutres, un vocabulaire clair et un échantillon pertinent. Il faut éviter les questions orientées et distinguer ce que les répondants déclarent de ce qu'ils font."],"12":["L'analyse d'enquête commence par le contrôle des réponses : doublons, non-réponses, erreurs et taille de l'échantillon.","La fréquence relative se calcule en divisant le nombre de réponses d'une catégorie par le nombre de réponses valides, puis en multipliant par 100. Exemple : 18 réponses sur 60 = 30 %.","Un graphique doit comporter un titre, des unités et une base de calcul. Une conclusion professionnelle relie le résultat à une décision, tout en indiquant les limites de l'enquête."],"13":["L'information du consommateur doit être claire, loyale et accessible : prix, caractéristiques essentielles, conditions de vente et informations réglementaires selon les produits.","Le droit de rétractation dépend notamment du canal de vente et des exceptions légales ; il ne faut pas annoncer qu'il s'applique automatiquement à tout achat en magasin.","Face à une réclamation, le vendeur écoute, vérifie les faits et distingue garantie légale, politique commerciale et geste commercial. Une solution doit être conforme aux droits du client."],"14":["L'organigramme représente les liens hiérarchiques et fonctionnels entre les personnes. Les missions du responsable, du vendeur, du réceptionnaire et du personnel de caisse doivent être coordonnées.","Une fiche de poste précise les activités, responsabilités, compétences et limites d'autonomie. Une consigne utile indique qui fait quoi, quand et avec quels contrôles.","La qualité de service dépend aussi de la circulation de l'information : ruptures, anomalies, réclamations et priorités doivent être transmises à la bonne personne."],"15":["La qualité de service se mesure à partir de critères observables : accueil, disponibilité, conseil, propreté, attente et traitement des réclamations.","Une grille de client mystère doit comporter des indicateurs précis, par exemple « salutation dans les premières secondes » plutôt que « accueil sympathique ».","Une satisfaction déclarée ne suffit pas à expliquer un problème : on croise les avis avec les faits observés et on propose des améliorations vérifiables."],"16":["Le choix d'un fournisseur combine prix d'achat, qualité, régularité, délais, conditions de livraison et engagements.","Le moins cher n'est pas nécessairement le plus avantageux : frais de transport, pertes, minimum de commande et fiabilité modifient le coût réel.","Une comparaison multicritère doit expliciter les critères et justifier leur importance pour le magasin et ses clients."],"17":["L'assortiment est l'ensemble des produits proposés. Sa largeur correspond au nombre de familles ou gammes ; sa profondeur au nombre de références à l'intérieur d'une famille ou gamme.","Une offre cohérente tient compte de la cible, de la place disponible, de la saisonnalité, du budget et du positionnement de l'enseigne.","Un produit d'appel attire les clients ; un produit complémentaire peut augmenter la valeur du panier. Chaque référencement doit être justifié."],"18":["Le prix de vente doit couvrir les coûts et rester cohérent avec la clientèle et la concurrence. Les montants HT et TTC ne se confondent pas.","Marge commerciale unitaire = prix de vente HT − coût d'achat HT. Taux de marge = marge / coût d'achat HT × 100 ; taux de marque = marge / prix de vente HT × 100.","Une remise modifie le prix et souvent la marge : il faut recalculer plutôt que supposer qu'une hausse des ventes compense la baisse de prix."],"19":["La communication commerciale cherche à informer, attirer, convaincre ou fidéliser une cible définie.","Le choix d'un canal dépend des habitudes des clients, du budget et du message : affichage local, réseaux sociaux, prospectus, vitrine ou relation directe.","Une action de fidélisation se mesure : fréquence d'achat, satisfaction, taux de retour ou utilisation d'une offre. Il faut éviter les indicateurs sans lien avec l'objectif."],"20":["Le diagnostic d'une enseigne met en relation sa clientèle, son emplacement, son assortiment, ses prix et sa communication.","Un choix professionnel se justifie par des données : étude de marché, enquête, comparaison ou calcul. Une affirmation sans preuve reste une hypothèse.","Une synthèse efficace présente trois forces, trois risques et des actions réalistes, hiérarchisées selon leur impact."],"21":["L'implantation d'un rayon influence la visibilité des produits, la circulation et la facilité d'achat.","Les zones dites chaudes et froides dépendent du parcours réel et de l'agencement ; elles ne se décrètent pas sans observation.","Un diagnostic de rayon décrit d'abord des faits (hauteur, facing, prix, rupture), puis interprète leurs effets et propose des corrections."],"22":["Le facing désigne le nombre de faces visibles d'une référence sur le linéaire. Il contribue à la visibilité et à la disponibilité apparente.","L'étiquette doit correspondre à la bonne référence et au prix affiché. Les anomalies possibles comprennent l'absence de prix, la discordance et la mauvaise lisibilité.","Un contrôle de rayon suit une méthode : observer, relever les anomalies, hiérarchiser les risques, corriger et vérifier."],"23":["Une remise en état de rayon commence par la sécurité, la propreté et la vérification des produits.","Le réassort respecte les règles de rotation adaptées, l'implantation prévue et la cohérence des étiquettes.","Chaque intervention doit pouvoir être justifiée : disponibilité, qualité perçue, lisibilité ou réduction des pertes."],"24":["La réception compare la livraison avec la commande et le bon de livraison : références, quantités, état, températures si nécessaire et dates.","Une anomalie doit être isolée, documentée et signalée avant validation selon la procédure de l'entreprise.","La réserve s'organise pour faciliter la rotation, limiter les manipulations et respecter les exigences de conservation."],"25":["Une rupture de stock empêche de satisfaire une demande. Le suivi des ventes et des délais aide à anticiper les besoins.","Stock final = stock initial + entrées − sorties. La couverture de stock estime combien de jours de vente sont possibles au rythme observé.","Un réapprovisionnement doit intégrer le délai fournisseur, la saisonnalité, la place et les risques de surstock."],"26":["La démarque désigne les pertes de marchandises ou de valeur : casse, vols, erreurs, produits périmés et écarts d'inventaire.","L'inventaire compare le stock théorique au stock physique. Un écart doit être vérifié avant d'en chercher la cause.","Réduire la démarque nécessite des actions adaptées : rotation, contrôle, stockage, prévention et suivi chiffré."],"27":["Les risques professionnels en magasin comprennent manutention, chutes, coupures, circulation et travail au froid selon le poste.","La prévention privilégie l'organisation et les protections collectives avant les équipements individuels.","Une analyse de situation repère le danger, l'exposition, le dommage possible et la mesure de prévention adaptée."],"28":["Le linéaire est l'espace de présentation attribué aux produits. Son partage dépend des ventes, des marges, de la rotation et du positionnement.","Une implantation peut regrouper les références par famille, usage, marque ou niveau de prix ; chaque logique répond à une intention commerciale.","Le meilleur emplacement n'est pas forcément identique pour tous les produits : il faut confronter les choix aux objectifs et aux contraintes."],"29":["Un planogramme représente la place des références dans un rayon : niveaux, largeur, ordre et facings.","Pour construire un planogramme, on relève les dimensions du mobilier et des produits, puis on répartit les espaces en respectant les contraintes.","Le document final doit être lisible, coté ou à l'échelle si nécessaire, et justifié par des objectifs commerciaux."],"30":["Une réimplantation suit un ordre : diagnostic, objectifs, plan, préparation, réalisation et contrôle.","La PLV attire l'attention sur une offre ; l'ILV oriente et informe le client. Les deux doivent rester compréhensibles et cohérentes.","Après réimplantation, on vérifie circulation, accessibilité, étiquettes, disponibilité et sécurité."],"31":["Défendre une implantation exige de distinguer la description de l'analyse : « le produit est en haut » n'explique pas pourquoi.","Une justification professionnelle relie un fait, un objectif commercial et un effet attendu.","Une proposition d'amélioration est d'autant plus crédible qu'elle indique ses contraintes et un indicateur de suivi."],"32":["Le chiffre d'affaires correspond au montant des ventes sur une période, selon la convention de calcul utilisée.","Panier moyen = chiffre d'affaires / nombre de tickets. Taux d'évolution = (valeur finale − valeur initiale) / valeur initiale × 100.","Un indicateur isolé peut tromper : il faut comparer des périodes comparables et rechercher les causes possibles des variations."],"33":["Le rendement d'un linéaire rapporte les ventes ou la marge à l'espace occupé, avec des unités explicites.","Comparer deux rayons suppose des périodes, des surfaces et des conventions identiques.","La décision ne repose pas seulement sur le rendement : variété, image, saisonnalité et rôle des produits comptent aussi."],"34":["Une étude chiffrée professionnelle exige des données identifiées, des formules posées et des unités correctes.","Après chaque calcul, on interprète le résultat : favorable ou défavorable, pour qui et pourquoi.","Une recommandation finale précise une action réaliste et le moyen de vérifier son efficacité."],"35":["À l'oral, observer un rayon avant de proposer des changements : implantation, prix, promotions, visibilité et cohérence.","Structurer l'intervention : décrire des faits, analyser les effets, proposer deux améliorations et justifier les priorités.","Employer un vocabulaire précis et distinguer observation et hypothèse."],"36":["La remédiation commence par identifier les erreurs récurrentes : vocabulaire, observation, calcul ou argumentation.","Une bonne réponse orale suit la logique constat → conséquence → proposition → justification.","Le progrès se mesure en comparant deux prestations avec la même grille."],"37":["Un écrit d'examen demande de lire le contexte, relever les données utiles, poser les calculs et rédiger des conclusions.","Vérifier unités, taux, périodes et cohérence des résultats avant de conclure.","Une réponse complète distingue résultat numérique, interprétation et décision."],"38":["L'observation d'un rayon réel exige une grille factuelle : promotions, circulation, prix, étiquetage, facing et disponibilité.","Une photo ou une note doit être reliée à un constat précis ; on évite les jugements vagues.","Les améliorations proposées doivent tenir compte des contraintes du magasin et des autorisations de visite."],"39":["La préparation orale mobilise le vocabulaire technique et la capacité à argumenter sans réciter.","Face à une question imprévue, reformuler, identifier les faits observés puis proposer une réponse justifiée.","La qualité de l'oral dépend de la précision des exemples, de la cohérence des choix et de la gestion du temps."],"40":["L'écrit final associe analyse de documents, calculs commerciaux et préconisations argumentées.","Une bonne copie annonce les formules, présente des résultats lisibles et explique ce qu'ils signifient pour le rayon.","Après correction, identifier les notions encore fragiles et cibler les révisions."],"41":["Une animation commerciale poursuit un objectif précis : découverte, trafic, ventes, fidélisation ou valorisation d'un produit.","Définir la cible, le thème, la période, le lieu et les moyens disponibles avant de choisir l'activité.","Les objectifs doivent pouvoir être mesurés à partir d'indicateurs réalistes."],"42":["Préparer une animation demande un rétroplanning, une répartition des rôles, du matériel et un budget.","La communication, la sécurité, les autorisations et la disponibilité des produits sont à anticiper.","Une check-list avant ouverture réduit les oublis et clarifie les responsabilités."],"43":["Pendant l'animation, accueillir, conseiller et adapter son discours aux réactions des clients.","Le bilan compare les résultats aux objectifs : participation, ventes, coûts et satisfaction.","L'analyse finale distingue réussites, difficultés et améliorations pour la prochaine opération."]};

out='<div class="panel"><h2>Bienvenue dans ton parcours</h2><p>Les séances 1 à 7 sont conservées dans l’application d’origine.</p><p><a href="'+oldUrl+'">Ouvrir l’ancienne application</a></p><p>'+count+' séances validées sur '+flat.length+'</p><div class="bar"><div class="fill" style="width:'+(100*count/flat.length)+'%"></div></div></div><div class="cards">'+seq.map((s,i)=>'<div class="card"><span class="chip '+s.mp.toLowerCase()+'">'+s.mp+' · '+safe(s.id)+'</span><h3>'+safe(s.title)+'</h3><p>'+safe(s.date)+'</p><p>'+s.lessons.length+' séances</p><button class="btn" data-seq="'+i+'">Voir les séances</button></div>').join('')+'</div>';
