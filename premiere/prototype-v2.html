<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Première TCVA — Parcours 2026-2027 · Prototype V2</title><style>:root{font-family:system-ui,Arial;color:#193349;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}header{background:#102e45;color:white;padding:22px 5vw}header h1{margin:5px 0;font-size:clamp(24px,4vw,38px)}header p{color:#c7d9e6}.wrap{max-width:1150px;margin:auto;padding:20px}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.tabs button,.btn{border:0;border-radius:11px;padding:12px 17px;background:#e5edf3;color:#153b57;font-weight:750;cursor:pointer}.tabs button.active,.btn.primary{background:#087b92;color:white}.panel{background:white;border:1px solid #dbe5ed;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #123405}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px}.card{background:white;border:1px solid #dce6ec;border-radius:14px;padding:17px}.chip{font-size:12px;font-weight:800;display:inline-block;border-radius:8px;background:#dbeef4;padding:5px 8px}.chip.mp4{background:#dff4e9;color:#116442}.chip.mp6{background:#fff0d6;color:#855208}.muted{color:#5a6c78}.bar{background:#e4edf1;height:10px;border-radius:10px;overflow:hidden}.fill{height:100%;background:#0d9a84}.session{display:block;text-align:left;width:100%;border:1px solid #dce6ed;border-radius:12px;background:white;padding:14px;margin:9px 0;cursor:pointer;color:inherit}.session:hover{border-color:#087b92}.session b{display:block;margin:5px 0}small{color:#5a6c78}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}textarea{width:100%;min-height:100px;border:1px solid #c9d7e1;border-radius:10px;padding:12px;font:inherit}ul{line-height:1.8}label{display:block;margin:10px 0}input[type=checkbox]{transform:scale(1.25);margin-right:9px}a{color:#087b92}@media(max-width:700px){.split{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:15px}}</style><header><div style="font-size:12px;letter-spacing:.1em">MON ACADÉMIE COMMERCE · PREMIÈRE TCVA</div><h1>Mon parcours vers l'ECCF 2</h1><p>Une progression claire, des missions concrètes et des compétences vérifiables.</p></header><main class="wrap"><div class="tabs" id="tabs"></div><div id="app"></div></main><script>
const planning=[['Jusqu’au 17 janvier 2027','Semaine A (impaire) : lundi 1 h, mardi 2 h Mission Enseigne, vendredi 1 h · 4 h. Semaine B (paire) : mêmes créneaux + jeudi 1 h · 5 h.'],['Du 18 au 31 janvier 2027','Semaine A : mardi 2 h Mission Enseigne + vendredi 1 h · 3 h. Semaine B : lundi 2 h + mardi 2 h Mission Enseigne + jeudi 1 h + vendredi 2 h · 7 h.'],['1er au 27 février 2027','PFMP : aucune séance en classe programmée.'],['Mars à avril 2027','Priorité MP4, capacité C8.1 et ECCF 2 : analyse de rayon, mise en situation, calculs, justifications, oral et écrit. Mardi libéré de Mission Enseigne.'],['Mai 2027','Réserve : ECCF 2 si nécessaire, entraînement, remédiation, rattrapages et imprévus ; MP6 uniquement si la priorité examen est couverte.'],['7 juin au 10 juillet 2027','PFMP : aucune séance en classe programmée.']];
const oldUrl='https://gregorybourcier4-png.github.io/mon-bac-tcva-2027/premiere/';
const seq=[
{mp:'MP1',id:'1.1–1.2',title:'Comprendre son point de vente et son marché',date:'Nov.–déc. 2026',goal:'Caractériser le commerce, distinguer les formes de vente et repérer les évolutions du marché.',lessons:[['8','Quel type de commerce ?','Formes de commerce, statut, organisation physique','Comparer trois enseignes et justifier leur classement'],['9','Un marché qui évolue','Tendances, concurrence, comportements','Enquête et mini-benchmark de magasins']]},
{mp:'MP1',id:'1.3–1.4',title:'Comprendre la zone de chalandise et les clients',date:'Déc. 2026',goal:'Analyser l’emplacement, la concurrence, la clientèle et sa segmentation.',lessons:[['10','Où implanter mon enseigne ?','Zone de chalandise, accès, concurrence','Carte commentée de la zone'],['11','À qui vend-on ?','Typologies, segmentation, enquête','Créer une enquête client courte'],['12','Analyser les réponses','Lecture de résultats, clientèle cible','Tirer trois conclusions commerciales']]},
{mp:'MP1',id:'1.5 · 2.1–2.3',title:'Consommateur, équipe et qualité de service',date:'Déc. 2026 – janv. 2027',goal:'Repérer les droits du consommateur, les rôles de l’équipe et les critères de service.',lessons:[['13','Protéger le consommateur','Information, rétractation et recours','Résoudre des situations clients'],['14','Qui fait quoi dans le magasin ?','Organigramme, missions et autonomie','Construire une équipe pour son enseigne'],['15','Mesurer la qualité du service','Critères, satisfaction, client mystère','Grille d’observation d’accueil']]},
{mp:'MP1',id:'3.1–3.5',title:'Construire une politique commerciale cohérente',date:'Janv. 2027',goal:'Expliquer les choix de fournisseurs, assortiment, prix, communication et fidélisation.',lessons:[['16','Choisir ses fournisseurs','Approvisionnement et critères de sélection','Comparer trois offres fournisseurs'],['17','Construire son offre','Marques, MDD, gamme, positionnement','Composer une offre justifiée'],['18','Prix et valeur','Prix, marge et comparaison','Étude de prix contextualisée'],['19','Communiquer et fidéliser','Communication, fidélisation, veille','Proposer un plan d’action'],['20','Bilan MP1 avant stage','Mobiliser les objectifs 1 à 3','Diagnostic de l’enseigne et justification orale']]},
{mp:'MP4',id:'1.1–1.2 · 2.1–2.2',title:'Lire, entretenir et présenter un rayon',date:'Mars 2027',goal:'Réinvestir les plans de magasin, observer les rayons, assurer le facing et contrôler l’étiquetage.',lessons:[['21','Mission observation rayon','Implantation, circulation, zones, assortiment','Analyse guidée de photos'],['22','Rayon sous contrôle','Facing, étiquettes, prix, anomalies','Audit du magasin pédagogique'],['23','Je corrige le rayon','Mise en rayon, contrôle et justification','Défi pratique par équipe']]},
{mp:'MP4',id:'2.3–2.6',title:'Approvisionner et sécuriser la gestion du rayon',date:'Mars 2027',goal:'Suivre les commandes, prioriser le réassort, interpréter les stocks et limiter la démarque.',lessons:[['24','De la commande au rayon','Réception, anomalies, réserve','Simulation de livraison'],['25','Éviter les ruptures','Rotation, couverture, taux de rupture','Cas chiffrés progressifs'],['26','Limiter la démarque','Inventaires, démarque, invendus','Diagnostic d’un rayon à problèmes'],['27','Agir en sécurité','Risques de manutention et prévention','Observation de situations de travail']]},
{mp:'MP4',id:'3.1–3.2',title:'Réimplanter un rayon et défendre ses choix',date:'Fin mars–avril 2027',goal:'Attribuer le linéaire, raisonner la présentation, le mobilier, la PLV et l’ILV.',lessons:[['28','Pourquoi ce produit ici ?','Linéaire, saisonnalité, marque, rotation','Comparer deux implantations'],['29','Dessiner un planogramme','Répartition, facing, priorités','Créer un plan d’implantation'],['30','Réimplanter en équipe','Mobilier, PLV, ambiance','Mise en situation magasin'],['31','Défendre mon implantation','Observer, expliquer, justifier','Oral filmé ou simulé']]},
{mp:'MP4',id:'4.1–4.2',title:'Mesurer la performance et décider',date:'Avril 2027',goal:'Calculer et interpréter les indicateurs commerciaux et les résultats du rayon.',lessons:[['32','Lire les chiffres du rayon','CA, panier moyen, évolution','Tableau de bord commenté'],['33','Le linéaire est-il rentable ?','Rendements et indicateurs','Comparer deux rayons'],['34','Calculer puis proposer','Marges, charges, démarque','Écrit professionnel de 1 h 30']]},
{mp:'MP4',id:'C8.1',title:'Préparation intensive ECCF 2',date:'Avril–mai 2027',goal:'Observer, analyser et justifier à l’oral ; traiter des données et conclure à l’écrit.',lessons:[['35','Oral blanc 1 : rayon surprise','Description structurée et diagnostic','Tirage au sort au magasin'],['36','Retour sur l’oral','Argumentation et pistes d’amélioration','Remédiation différenciée'],['37','Écrit blanc 1','Calculs, interprétations, propositions','Sujet complet chronométré'],['38','Observation d’un rayon réel','Promotions, implantation, cohérence','Sortie Leclerc sous réserve d’autorisation'],['39','Oral blanc 2','Autonomie, vocabulaire, justification','Rayon tiré au sort'],['40','Écrit blanc 2 et bilan','Exploitation de données et décisions','Sujet complet et grille de maîtrise']]},
{mp:'MP6',id:'1–3',title:'Animation commerciale — après priorité ECCF 2',date:'Après l’ECCF 2',goal:'Concevoir, conduire et évaluer une animation commerciale.',lessons:[['41','Proposer une animation','Cible, thème, objectifs','Idée d’animation argumentée'],['42','Préparer l’action','Vitrine, communication, logistique','Plan d’action'],['43','Animer et faire le bilan','Réalisation, indicateurs','Animation au magasin pédagogique']]}
];

const flat=seq.flatMap((s,si)=>s.lessons.map((l,li)=>({s,si,li,n:l[0],title:l[1],notion:l[2],activity:l[3]})));
let tab='parcours',selected=flat[0];
const safe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const done=n=>localStorage.getItem('tcva_v2_done_'+n)==='1';
const button=(name,label)=>'<button data-tab="'+name+'" class="'+(tab===name?'active':'')+'">'+label+'</button>';
function render(){
const count=flat.filter(x=>done(x.n)).length;
document.getElementById('tabs').innerHTML=[['parcours','Mon parcours'],['sequences','Séquences'],['examen','Objectif ECCF 2'],['mission','Mission Enseigne'],['prof','Vue professeur']].map(x=>button(x[0],x[1])).join('');
let out='';
if(tab==='parcours'){
out='<div class="panel"><h2>Bienvenue dans ton parcours</h2><p>Les séances 1 à 7 sont conservées dans l’application d’origine.</p><p><a href="'+oldUrl+'">Ouvrir l’ancienne application</a></p><p>'+count+' séances validées sur '+flat.length+'</p><div class="bar"><div class="fill" style="width:'+(100*count/flat.length)+'%"></div></div></div><div class="cards">'+seq.map((s,i)=>'<div class="card"><span class="chip '+s.mp.toLowerCase()+'">'+s.mp+' · '+safe(s.id)+'</span><h3>'+safe(s.title)+'</h3><p>'+safe(s.date)+'</p><p>'+s.lessons.length+' séances</p><button class="btn" data-seq="'+i+'">Voir les séances</button></div>').join('')+'</div>';
}
if(tab==='sequences'){
out='<div class="split"><div class="panel"><h2>Séquences et séances</h2>'+seq.map((s,si)=>'<h3>'+s.mp+' · '+safe(s.title)+'</h3><p class="muted">'+safe(s.date)+'</p>'+s.lessons.map((l,li)=>'<button class="session" data-lesson="'+si+'-'+li+'"><small>Séance '+l[0]+' · '+(done(l[0])?'Validée':'À travailler')+'</small><b>'+safe(l[1])+'</b></button>').join('')).join('')+'</div><div class="panel"><span class="chip">'+selected.s.mp+' · '+selected.s.id+'</span><h2>Séance '+selected.n+' : '+safe(selected.title)+'</h2><p><b>Séquence :</b> '+safe(selected.s.title)+'</p><p><b>Objectif :</b> '+safe(selected.s.goal)+'</p><p><b>Notions :</b> '+safe(selected.notion)+'</p><p><b>Activité :</b> '+safe(selected.activity)+'</p><p>Séance '+(selected.li+1)+' sur '+selected.s.lessons.length+'</p>'+(selected.n==='8'?'<p><a class="btn primary" href="seance-8-v2.html">Ouvrir le cours, les exercices, la synthèse et le corrigé de la séance 8</a></p>':'<p class="muted">Contenu détaillé en préparation ; progression indicative.</p>')<label><input id="done" type="checkbox" '+(done(selected.n)?'checked':'')+'> Séance réalisée et comprise</label><textarea id="notes" placeholder="Mon bilan de séance">'+safe(localStorage.getItem('tcva_v2_notes_'+selected.n)||'')+'</textarea><button class="btn primary" id="save">Sauvegarder mes notes</button><p class="muted">Les cours détaillés et exercices interactifs seront intégrés après validation de la progression.</p></div></div>';
}
if(tab==='examen'){
out='<div class="panel"><span class="chip mp4">MP4 · C8.1</span><h2>Préparation ECCF 2 — Marchandisage</h2><div class="cards"><div class="card"><h3>Oral : rayon surprise</h3><p>Observer, décrire les promotions et l’implantation, analyser les choix, proposer des améliorations et les justifier.</p></div><div class="card"><h3>Écrit : 1 h 30</h3><p>Calculer, interpréter les indicateurs commerciaux et rédiger des conclusions professionnelles.</p></div></div><h3>Mes compétences</h3>'+['Décrire un rayon','Repérer et expliquer les promotions','Justifier l’implantation','Proposer des améliorations','Calculer et interpréter les indicateurs'].map((x,i)=>'<label><input type="checkbox" data-exam="'+i+'" '+(localStorage.getItem('tcva_v2_exam_'+i)==='1'?'checked':'')+'> '+x+'</label>').join('')+'</div>';
}
if(tab==='mission'){
out='<div class="panel"><h2>Mission Enseigne 2027</h2><p><a class="btn primary" href="mission-enseigne-evaluation.html">Ouvrir la grille d’évaluation : 100 critères, note /100 et /20</a></p><p class="muted">Grille conforme aux 100 directives du PDF original. Validation professeur sur téléphone, enregistrement local et export CSV/JSON.</p><p>Recherche autonome et projet jusqu’au stage de février, en lien avec le MP1.</p><div class="cards">'+[['Présenter son enseigne','MP1 · concept et marché'],['Choisir son emplacement','MP1 · zone de chalandise'],['Comprendre ses clients','MP1 · segmentation'],['Construire son équipe','MP1 · organisation'],['Construire son offre','MP1 · assortiment et prix'],['Faire connaître son enseigne','MP1 · communication']].map(x=>'<div class="card"><span class="chip">'+x[1]+'</span><h3>'+x[0]+'</h3></div>').join('')+'</div></div>';
}
if(tab==='prof'){
out='<div class="panel"><h2>Vue professeur</h2><p><b>Avant février :</b> MP1 et Mission Enseigne.</p><p><b>Mars à l’ECCF 2 :</b> priorité au MP4 et aux simulations pratiques et écrites.</p><p><b>Après l’ECCF 2 :</b> MP6 selon le temps disponible.</p><p>Chaque séquence vérifie des aptitudes observables : repérer, expliquer, agir, justifier.</p><h3>Planning réel et contraintes</h3>'+planning.map(x=>'<div class="card"><b>'+safe(x[0])+'</b><p>'+safe(x[1])+'</p></div>').join('')+'<h3>Cadre pédagogique validé</h3><p>Une heure : cours complet, exercices variés en cinq parties (QCM, textes et situations professionnelles), correction à code et synthèse en cinq points masqués à révéler. Sur un créneau de deux heures, deuxième heure réservée à une mission ludique externe (PDF, vidéo, photos, magasin pédagogique). La mission n’est qu’annoncée dans l’application.</p><p>Préserver les séances 1 à 7 et l’application d’origine. Séance 8 disponible comme modèle à enrichir. MP5 exclu de la progression. MP6 après la préparation prioritaire de l’ECCF 2.</p><p>Dates de placement de chaque séance encore indicatives : les semaines réelles, jours fériés et disponibilités doivent être vérifiés avant publication définitive.</p></div>';
}
document.getElementById('app').innerHTML=out;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.querySelectorAll('[data-seq]').forEach(b=>b.onclick=()=>{selected=flat.find(x=>x.si===Number(b.dataset.seq));tab='sequences';render()});
document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{const [si,li]=b.dataset.lesson.split('-').map(Number);selected=flat.find(x=>x.si===si&&x.li===li);render()});
const cb=document.getElementById('done');if(cb)cb.onchange=()=>{localStorage.setItem('tcva_v2_done_'+selected.n,cb.checked?'1':'0');render()};
const save=document.getElementById('save');if(save)save.onclick=()=>{localStorage.setItem('tcva_v2_notes_'+selected.n,document.getElementById('notes').value);save.textContent='Notes sauvegardées'};
document.querySelectorAll('[data-exam]').forEach(b=>b.onchange=()=>localStorage.setItem('tcva_v2_exam_'+b.dataset.exam,b.checked?'1':'0'));
}
render();</script></html>
